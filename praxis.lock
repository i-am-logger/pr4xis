# praxis.lock — pinned content hashes + per-source structural extraction
# for entries in praxis.toml. Cargo-precedent naming. Auto-managed
# (regenerated by `pr4xis lock`, M3+); manual edits will be overwritten.
#
# [hashes] section: keys are `"<name>@<version>"` strings matching
# `[sources.<name>] version` in praxis.toml. Values are hex SHA-256.
# For Heap-store sources (e.g. WordNet) the hash pins the source bytes
# after any transport-layer decompression but before any decoder runs.
# For Static-store sources (e.g. Statutes) the hash is the canonical
# sha256 of the JSON-serialised structural data (sort_keys=true,
# separators=(",",":")), which makes drift between this lock's content
# and its pinned hash detectable.
#
# [structural."<name>@<version>"] sections: per-source structural
# extraction (terms + relations) for sources whose Store backend bakes
# the derived ontology at build time. Schema matches
# `pr4xis::codegen::statute::RawStatuteDoc` directly.
#
# Drift detection (the `LockManifestAgreement` axiom) compares each
# manifest entry to its lock hash; missing lock entry, extra lock entry,
# or mismatching hash all fail closed at startup.

[hashes]
