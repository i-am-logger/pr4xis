# Sarbanes–Oxley § 806 (codified at 18 U.S.C. § 1514A). 28 terms /
# 18 relations. Bootstrap extraction transformed from the canonical
# structural source; the canonical sha256 above pins this content so
# any future edit forces a regeneration of the hash.
[structural."sox_1514a@2002"]
description = "18 U.S.C. § 1514A — Civil action to protect against retaliation in fraud cases"

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:a"
name = "Covered Employer"
definition = "A company with registered securities, its subsidiaries, affiliates, or a nationally recognized statistical rating organization."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:a_v2"
name = "Covered Persons"
definition = "Officers, employees, contractors, subcontractors, and agents of covered employers or rating organizations."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:a_v3"
name = "Prohibition on Retaliation"
definition = "Employers may not discharge, demote, suspend, threaten, harass, or discriminate against employees for protected activity."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:1"
name = "Protected Activity: Providing Information and Assistance"
definition = "Protected activity includes providing information, causing information to be provided, or assisting in an investigation regarding violations."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:1_v2"
name = "Protected Conduct: Violations of Federal Law"
definition = "Conduct the employee reasonably believes constitutes violations of fraud-related statutes, SEC rules, or federal fraud laws."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:1a"
name = "Reporting to Federal Agency"
definition = "Employee's protected activity includes providing information to or assisting investigation by a federal regulatory or law enforcement agency."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:1b"
name = "Reporting to Congress"
definition = "Employee's protected activity includes providing information to or assisting investigation by a Member of Congress or committee of Congress."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:1c"
name = "Reporting to Supervisor or Internal Authority"
definition = "Employee's protected activity includes providing information to a person with supervisory authority or another person with authority to investigate, discover, or terminate misconduct."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:2"
name = "Protected Activity: Participation in Proceedings"
definition = "Protected activity includes filing, causing to be filed, testifying, participating in, or assisting in a proceeding relating to alleged violations."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:a_v4"
name = "Causation: Because Of Protected Activity"
definition = "The employer's adverse action must be taken because of the employee's lawful protected activity."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:a_v5"
name = "Lawfulness of Protected Activity"
definition = "The protected activity must consist of a lawful act done by the employee."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:b1"
name = "Right to Seek Relief"
definition = "A person alleging discharge or discrimination may seek relief under the prescribed remedies."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:b1a"
name = "Complaint Filing with Secretary of Labor"
definition = "A person may file a complaint with the Secretary of Labor."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:b1b"
name = "District Court Filing as Alternative Remedy"
definition = "If the Secretary has not issued a final decision within 180 days and there is no showing of bad faith by the claimant, the person may bring an action in district court for de novo review."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:b1b_v2"
name = "District Court Jurisdiction"
definition = "The district court shall have jurisdiction over such actions without regard to the amount in controversy."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:b2a"
name = "Governance by 49 U.S.C. § 42121(b)"
definition = "Actions under paragraph (1)(A) shall be governed by the rules and procedures set forth in 49 U.S.C. § 42121(b)."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:b2b"
name = "Secretary's Notification Obligation"
definition = "Upon receipt of a complaint, the Secretary of Labor shall notify in writing the person named in the complaint and the employer."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:b2c"
name = "Burdens of Proof for District Court Actions"
definition = "Actions brought under paragraph (1)(B) shall be governed by the legal burdens of proof set forth in 49 U.S.C. § 42121(b)."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:b2d"
name = "Statute of Limitations for Filing"
definition = "An action under paragraph (1) shall be commenced not later than 180 days after the violation occurs or after the employee became aware of the violation."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:b2e"
name = "Right to Jury Trial"
definition = "A party to an action brought under paragraph (1)(B) is entitled to trial by jury."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:c1"
name = "Remedies in General"
definition = "An employee who prevails in an action under subsection (b)(1) is entitled to all relief necessary to make the employee whole."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:c2"
name = "Compensatory Damages"
definition = "Relief in actions under paragraph (1) shall include reinstatement, back pay with interest, and compensation for special damages."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:c2a"
name = "Reinstatement"
definition = "Reinstatement of the employee to the same seniority status the employee would have had but for the discrimination."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:c2b"
name = "Back Pay"
definition = "The amount of back pay with interest, compensating the employee for lost wages due to the discrimination."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:c2c"
name = "Special Damages"
definition = "Compensation for special damages sustained as a result of the discrimination, including litigation costs, expert witness fees, and reasonable attorney fees."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:d"
name = "Rights Retained by Employee"
definition = "This section preserves employee rights, privileges, and remedies under Federal law, State law, and collective bargaining agreements without diminishment."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:e1"
name = "Non-Waivability of Rights and Remedies"
definition = "Rights and remedies provided under this section cannot be waived by any agreement, policy form, or condition of employment."

[[structural."sox_1514a@2002".terms]]
id = "sox_1514a:e2"
name = "Invalidity of Predispute Arbitration Agreements"
definition = "Predispute arbitration agreements are not valid or enforceable if they require arbitration of disputes arising under this section."

