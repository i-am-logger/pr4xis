# praxis.lock — pinned content hashes for entries in praxis.toml.
#
# Cargo-precedent naming. Auto-managed (regenerated by `pr4xis lock`, M3+);
# manual edits will be overwritten.
#
# Keys are `"<name>@<version>"` strings matching `[sources.<name>] version`
# in praxis.toml. Values are hex SHA-256 of the source bytes after any
# transport-layer decompression but before any decoder runs (i.e., what
# would be re-fetched cleanly from the URL and gunzipped).
#
# Drift detection (the `LockManifestAgreement` axiom) compares each
# manifest entry to its lock value; a missing lock entry, an extra lock
# entry, or a mismatching hash all fail closed at startup.

[hashes]
"english_wordnet@2025" = "6f49adeec174ab3092169fb25cf4a925226b63975a5d29a691a5dff88f0673b2"
