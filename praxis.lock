# praxis.lock — pinned content hashes for entries in praxis.toml.
# Cargo-precedent naming. Auto-managed (regenerated by `pr4xis lock`);
# manual edits will be overwritten.
#
# Two parallel sections:
#
# `[hashes]` — SHA-256 of the source bytes as delivered by the fetch
# pipeline (after transport-layer decompression, before any decoder
# runs). Keys are `"<name>@<version>"` strings matching
# `[sources.<name>] version` in praxis.toml. Verifies "we got the same
# source we expected" (Dolstra 2006 content-addressed storage).
#
# `[canonical_signatures]` — SHA-256 of the canonical-form bytes
# produced by the source's well-behaved lens (Foster, Greenwald,
# Moore, Pierce & Schmitt 2007 ACM TOPLAS 29(3)). The canonical form
# is the lens's normalized output — W3C XML Canonicalization 1.1
# (Boyer & Marcy 2008) for USLM/XML sources, W3C RDF Dataset
# Canonicalization (RDFC-1.0, REC-rdf-canon-20240521) serialized
# N-Quads of the source RDF graph for OWL/RDF sources, RFC 8785 JCS
# for JSON, Unicode NFKC for plain text, etc. Verifies "the source,
# after lens normalization, has the same structural shape" — drift in
# the lens implementation surfaces here while the raw-bytes hash
# remains stable. Optional per source; sources without a signature are
# not yet round-trip-pinned.
#
# Drift detection: the LockManifestAgreement axiom compares each
# manifest entry to its lock hash. Missing lock entry, extra lock
# entry, or mismatching hash all fail closed at startup. A free-
# standing canonical_signature without a matching raw-bytes hash is
# rejected at parse time.

[hashes]
