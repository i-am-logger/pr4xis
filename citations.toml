# citations.toml — Praxis literature-citation registry.
#
# Every literature citation in praxis code (module-level doc-comments,
# `pr4xis::axiom!` declarations, `pr4xis::register_axiom!` source
# strings, `[sources.X]` description fields in praxis.toml, and the
# `description`/`citation: Citation::parse_static(...)` strings in
# `pr4xis::ontology!` macro bodies) MUST appear here with a verified
# section reference, year, author, publisher, and source URL/DOI.
#
# Each entry resolves to exactly one (work, section) pair. If two
# axioms cite the same work at different sections, each section gets
# its own entry — sections are the load-bearing granularity, since
# "Mac Lane (1971) §IV.1" and "Mac Lane (1971) §V.2" cite different
# claims even though they share an author and year.
#
# ---------------------------------------------------------------------
# Schema (one `[citations.<slug>]` block per (work, section) pair)
# ---------------------------------------------------------------------
#
#   authors             — full names, primary author first, "Last, First; …"
#   year                — publication year, integer.
#   title               — exact title as it appears on the title page.
#   publisher           — publisher / SDO (Springer, W3C, IETF, ISO, …).
#   edition             — "1st", "2nd", "Fifth Edition", "Second Edition",
#                         … or "" if the work has no edition concept
#                         (RFCs, W3C Recs, ISO standards).
#   section_or_page     — the SECTION or PAGE within the work this entry
#                         cites. Required. If the citation is to the
#                         work as a whole (with no section), leave "" and
#                         document in `verification_notes`.
#   isbn                — ISBN-13 if known; else "".
#   doi                 — DOI if applicable; else "".
#   url                 — fetch URL (HTTPS) for web-published documents
#                         (W3C, WHATWG, IETF RFC, NIST, …); else "".
#   content_summary     — one-sentence summary of what the cited section
#                         says. The verifier reads the work and confirms
#                         the summary matches the cited section. This is
#                         the heart of the audit — vague summaries get
#                         flagged.
#   verified_by         — set when human verifies — slug ID, GitHub
#                         handle, name, or email. EMPTY = unverified.
#   verified_on         — ISO 8601 date of verification (YYYY-MM-DD).
#   verification_method — one of:
#                           "book-in-hand"   — physical or scanned copy
#                                              consulted directly
#                           "web-fetched"    — published URL fetched
#                                              and checked
#                           "doi-resolved"   — DOI followed and content
#                                              cross-checked
#                           "library-loan"   — borrowed through library
#                                              and consulted
#   verification_notes  — any caveats; required when `section_or_page`
#                         is downgraded (see "Downgrade path" below).
#
# ---------------------------------------------------------------------
# Multi-version entries (the version-polymorphic citation adjunction)
# ---------------------------------------------------------------------
#
# When a cited work has several published versions whose section
# numbering differs (e.g. the LRC USLM User Guide: 0.1.4 numbers
# Identifiers as §12.5, the current edition as §11.5), pinning a single
# `section_or_page` is brittle and version-specific. Such an entry
# instead anchors a version-independent `claim` and carries one
# `[[citations.<slug>.versions]]` table per published version:
#
#   [citations.<slug>]
#   authors = "…"
#   title   = "…"
#   claim   = "the version-independent statement the citation supports"
#
#   [[citations.<slug>.versions]]
#   version = "0.1.4"            # a label identifying the version
#   edition = "0.1.4 (…)"
#   year    = 2013
#   section_or_page = "§12.5 …"  # where the claim lives IN THIS version
#   url     = "…"
#   content_summary = "…"        # what that version's section says
#   verified_by = "…"            # per-version verification
#   verified_on = "…"
#   verification_method = "…"
#   verification_notes  = "…"
#
#   [[citations.<slug>.versions]]
#   version = "current"
#   … (the same claim, located in the current edition)
#
# This is a citation **version adjunction** (Bancilhon & Spyratos 1981
# constant-complement; Grothendieck 1971 SGA1 fibration): the `claim`
# is the complement held constant across versions, each `versions`
# fiber is a view of it in one edition, and forget-version ⊣
# locate-in-version maps between them. The audit treats a versioned
# entry as verified iff the `claim` is non-empty and EVERY fiber is
# well-formed (has a `version` + `section_or_page`) and verified — the
# adjunction must be total over the registered versions. The flat
# `section_or_page` / `verified_*` fields stay empty for versioned
# entries (single-version entries continue to use them, unchanged).
#
# ---------------------------------------------------------------------
# Slug naming convention
# ---------------------------------------------------------------------
#
#   <first-author-lowercased>_<year>_<short-title>_<section-marker>
#
#   - Author: surname, lowercased, ASCII-folded (e.g. "mac_lane",
#     "gao", "spivak"). Multi-word surnames stay joined with underscore.
#   - Year: 4-digit integer.
#   - Short title: 2-4 words capturing the work. Lowercased,
#     underscore-separated, no punctuation. E.g.
#       "categories_working_mathematician" (Mac Lane 1971)
#       "xsd_1_1_part_1"                   (Gao et al. 2012 XSD 1.1 Part 1)
#       "wordnet_electronic_lexical"       (Fellbaum 1998)
#       "xhtml_1_0_strict"                 (Pemberton et al. 2002)
#   - Section marker: kebab-converted "§N.M" → "iv1", "3_4_6_4",
#     "a2_strict_schema", "page_123". Use what makes the entry unique
#     and stable. If only one section is cited workspace-wide, the
#     section marker may be omitted, but every additional section
#     reference to the same work MUST add a marker.
#
# Examples:
#   `mac_lane_1971_categories_working_mathematician_i3`
#       Mac Lane 1971, §I.3 Functors
#   `gao_2012_xsd_1_1_part_1_2_2`
#       Gao et al. 2012 XSD 1.1 Part 1, §2.2 Schema components
#   `gao_2012_xsd_1_1_part_1_3_8_1`
#       Gao et al. 2012 XSD 1.1 Part 1, §3.8.1 Model groups
#
# Entries are SORTED by slug name (alphabetical). Adding a new entry:
# pick the slug, insert in sort order, fill required fields, leave
# `verified_by = ""` until the cited work / URL is actually consulted.
#
# ---------------------------------------------------------------------
# Verification workflow
# ---------------------------------------------------------------------
#
# 1. CI test `citation_audit` in pr4xis-domains walks the registry and
#    fails on:
#      (a) any entry with `verified_by = ""`,
#      (b) any code reference to a slug not in the registry,
#      (c) (warning, not failure in Phase A) free-form citations in code
#          that haven't been migrated to slug references.
#
# 2. Human verifier picks an unverified entry, opens the cited work
#    (book, paper, W3C Rec, RFC, ISO standard) at the section named in
#    `section_or_page`, reads the section, and confirms that
#    `content_summary` matches what the section actually says. If
#    matched: fill in `verified_by`, `verified_on`, `verification_method`.
#    If mismatched: either fix `section_or_page` + `content_summary`
#    to match the published work, or — if the cited section is wrong
#    and no correct section exists — *delete the entry and remove the
#    code reference* (don't paper over an unverifiable citation).
#
# 3. NO ALLOW-LIST. There is no "warn-only" mode. There is no
#    "trusted authors get a pass" exception. Unverified entries FAIL
#    CI. This is by design: the audit gate exists because vague /
#    fabricated section references ("Spivak (2014) §3.1 — typed-handle
#    patterns and functorial data migration" — confirmed wrong on
#    audit; §3.1 is not where functorial data migration lives, and
#    "typed-handle patterns" is not Spivak's terminology) are the
#    failure mode this gate prevents.
#
# ---------------------------------------------------------------------
# Downgrade path
# ---------------------------------------------------------------------
#
# If the cited claim is real but the section number can't be verified
# (e.g. you have the work in hand and the claim appears somewhere in
# it, but the specific section number in code is wrong or can't be
# narrowed down):
#
#   1. Set `section_or_page = ""`.
#   2. Document the downgrade in `verification_notes` ("Section number
#      could not be confirmed — author + year + work cited only; the
#      cited claim does appear in the work but not at the originally-
#      cited section. Reviewer X 2026-MM-DD.")
#   3. Fill `verified_by` etc. for the looser (author+year+work) claim.
#   4. Open a follow-up issue to narrow the section back down (or
#      remove the cite if it can't be).
#
# A downgraded entry IS verified for CI purposes — `verified_by` is
# filled. The looser claim is still grounded in a published work; the
# downgrade just acknowledges the section-level audit failed.
#
# ---------------------------------------------------------------------
# Code-reference format (Phase A: discovery-only)
# ---------------------------------------------------------------------
#
# Phase A (this commit): citations in code stay free-form prose. The
# CI walker recognizes citations by these heuristics in source files:
#
#   - "W3C XSD 1.1 Part 1 §3.8.1"      — recommendation + section
#   - "Mac Lane (1971) §I.3"           — author year section
#   - "RFC 5322 §3.4"                  — RFC + section
#   - "ISO 32000-2:2020 §9.6.5.4"      — ISO + section
#   - "Pemberton et al. (2002) §A.2"   — multi-author year section
#   - `pr4xis::register_axiom!(X, "...")` — string is the cite
#   - `citation: Citation::parse_static("...")` in `ontology!` body
#
# Free-form citations don't FAIL CI in Phase A — they generate
# warnings with file:line so they can be migrated.
#
# Phase B (separate commit): migrate every free-form citation to a
# slug reference, either `cite![mac_lane_1971_…]` or doc-comment
# `<!-- cite:mac_lane_1971_… -->`. At that point free-form citations
# become CI failures too.
#
# ===========================================================================
# Entries (sorted by slug)
# ===========================================================================

