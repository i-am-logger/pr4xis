# release-plz configuration for the praxis workspace.
#
# Replaces release-please + katyo/publish-crates. The previous tool
# trusted a local manifest file (`.release-please-manifest.json`),
# which silently drifted from crates.io when the publish step failed —
# pr4xis was tagged 0.16.0 locally while crates.io still held 0.6.0.
# release-plz reads from crates.io directly, so drift is impossible.
#
# Per-package settings inherit workspace defaults unless overridden in a
# `[[package]]` block.

[workspace]
# Use cargo-semver-checks before each release to verify that the
# proposed version bump matches the actual API change. A "patch" bump
# on a breaking change is rejected; release-plz auto-escalates the
# version to satisfy semver.
semver_check = true

# Match the existing per-package tag format that release-please used
# (`pr4xis-v0.16.0`, `pr4xis-domains-v0.21.0`, …). Keeps historical
# tags consistent with the new ones.
git_tag_name = "{{ package }}-v{{ version }}"

# Create a GitHub release for every tag — preserves the
# release-as-changelog pattern.
git_release_enable = true

# Only publish to crates.io when a release-plz-generated Release PR
# is merged to master, never when a plain feature/fix commit lands
# (default release-plz behaviour is the opposite — publish on every
# version-ahead commit). The two-step gate keeps publishing under
# explicit human review: release-plz-pr opens a PR that bumps
# Cargo.toml versions + writes CHANGELOG entries; merging that PR is
# the act that authorises the publish.
release_always = false

# Honor `publish = false` in per-crate Cargo.toml. Workspace-excluded
# crates (`crates/wasm`, `crates/e2e`) are invisible to release-plz —
# it only walks `[workspace].members`.

# Apply labels to every release PR so they're filterable in the GitHub
# UI (`is:pr label:release`) and so blanket "needs human review"
# queries can exclude them via `-label:automated`.
pr_labels = ["release", "automated"]

[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

# Skip release-plz's own release commits when generating changelogs.
# A `chore: release` merge commit is not a real change — but on the next
# run release-plz would otherwise attribute it to a package (notably one
# force-bumped by the version_group with no commits of its own), back-fill
# a changelog entry, and open a redundant "chore: release" PR (e.g. #196).
# Left unfiltered this self-feeds: merging that PR creates another release
# commit, which spawns the next empty PR. Filtering breaks the loop.
#
# Release-plz emits these commits in TWO forms — the unscoped aggregate
# `chore: release` and the per-package `chore(<package>): release v<x>`
# (e.g. `chore(pr4xis-runtime): release v0.23.0`). One optional-scope regex
# catches both; matching only the unscoped form (the earlier rule) let a
# scoped release commit slip through and spawn a redundant release PR (#199).
commit_parsers = [
    { message = "^chore(\\(.+\\))?: release", skip = true },
]

# Full workspace version sync — every workspace member shares a single
# version number. Modelled on the Bevy / Tauri / SeaORM convention:
# users install one praxis version and every supporting crate moves in
# lockstep. Removes the per-crate version drift that previously let
# pr4xis-derive sit at 0.1.0 while pr4xis evolved through 0.16.0 (the
# bug that broke catch-up publish; see chore/sync-all-versions-0.22.0).
#
# `pr4xis-examples` is in the version group so its number stays aligned
# with the rest, but `publish = false` keeps it off crates.io — examples
# aren't a library consumers pull in transitively.
[[package]]
name = "pr4xis-derive"
version_group = "praxis"

[[package]]
name = "pr4xis"
version_group = "praxis"

# `pr4xis-runtime` (the `.prx` runtime crate) is a workspace member and
# must move in lockstep with the rest of the group. Without this block it
# is invisible to the version_group sync and drifts behind (it sat at
# 0.22.0 while the group reached 0.23.0).
[[package]]
name = "pr4xis-runtime"
version_group = "praxis"

# `pr4xis-domains` is held back from crates.io until the registered-source
# story (`praxis.toml` + `pr4xis update`) lands as a Rust ontology rather
# than a build-time `include_str!` of workspace files. Path deps still
# work locally; only the publish step is gated. Crates that depend on
# domains (`pr4xis-chat`, `pr4xis-cli`) cascade — cargo refuses to publish
# a crate whose dep tree contains a `publish = false` member.
[[package]]
name = "pr4xis-domains"
version_group = "praxis"
publish = false

[[package]]
name = "pr4xis-cli"
version_group = "praxis"
publish = false

[[package]]
name = "pr4xis-chat"
version_group = "praxis"
publish = false

[[package]]
name = "pr4xis-web"
version_group = "praxis"

[[package]]
name = "pr4xis-examples"
version_group = "praxis"
publish = false
