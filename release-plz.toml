# release-plz configuration for the praxis workspace.
#
# Replaces release-please + katyo/publish-crates. The previous tool
# trusted a local manifest file (`.release-please-manifest.json`),
# which silently drifted from crates.io when the publish step failed —
# pr4xis was tagged 0.16.0 locally while crates.io still held 0.6.0.
# release-plz reads from crates.io directly, so drift is impossible.
#
# Per-package settings inherit workspace defaults unless overridden in a
# `[[package]]` block.

[workspace]
# Use cargo-semver-checks before each release to verify that the
# proposed version bump matches the actual API change. A "patch" bump
# on a breaking change is rejected; release-plz auto-escalates the
# version to satisfy semver.
semver_check = true

# Match the existing per-package tag format that release-please used
# (`pr4xis-v0.16.0`, `pr4xis-domains-v0.21.0`, …). Keeps historical
# tags consistent with the new ones.
git_tag_name = "{{ package }}-v{{ version }}"

# Create a GitHub release for every tag — preserves the
# release-as-changelog pattern.
git_release_enable = true

# Only publish to crates.io when a release-plz-generated Release PR
# is merged to master, never when a plain feature/fix commit lands
# (default release-plz behaviour is the opposite — publish on every
# version-ahead commit). The two-step gate keeps publishing under
# explicit human review: release-plz-pr opens a PR that bumps
# Cargo.toml versions + writes CHANGELOG entries; merging that PR is
# the act that authorises the publish.
release_always = false

# Honor `publish = false` in per-crate Cargo.toml. Workspace-excluded
# crates (`crates/wasm`, `crates/e2e`) are invisible to release-plz —
# it only walks `[workspace].members`.

# Apply labels to every release PR so they're filterable in the GitHub
# UI (`is:pr label:release`) and so blanket "needs human review"
# queries can exclude them via `-label:automated`.
pr_labels = ["release", "automated"]

[changelog]
header = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

# Per-package overrides — pr4xis-examples is not a library to publish;
# it carries runnable demos that consumers don't pull in transitively.
[[package]]
name = "pr4xis-examples"
publish = false

# Couple `pr4xis` and `pr4xis-derive` so they always release at the
# same version — the derive crate is meaningless apart from its host
# (a `pr4xis-derive 0.X` only ever pairs with a single `pr4xis 0.X`),
# so the standard `*-derive` convention from the wider Rust ecosystem
# (serde+serde_derive, thiserror+thiserror-impl, rkyv+rkyv_derive) is
# to version-lock the pair. Application crates (`pr4xis-domains`,
# `pr4xis-cli`, `pr4xis-chat`, `pr4xis-web`) version independently.
[[package]]
name = "pr4xis"
version_group = "pr4xis-core"

[[package]]
name = "pr4xis-derive"
version_group = "pr4xis-core"
