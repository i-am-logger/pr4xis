name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

# ── CI architecture ────────────────────────────────────────────────
# All Rust jobs build in `--release`. `[profile.dev]` does not appear
# in CI; `target/release/` is the only profile that exists. Every
# host-target job uses the same `Swatinem/rust-cache@v2` shared-key
# ("release") so the dep graph compile happens once across the
# workflow and all downstream jobs restore the same cache slice.
# Wasm-target jobs use a separate "wasm-release" pool.
#
# Job graph:
#   build ──► lint-docs ──┐
#         ├─► test ───────┤
#         └─► wasm ───────┼─► release-plz-release ──► pages
#                         └─► release-plz-pr        (opens Release PR)
#   format, no-ignored-doctests       (independent, no compile)
#
# Coverage runs in its own workflow (.github/workflows/coverage.yml)
# — nightly cron + on Release PRs (label-filtered) — because it uses
# a different cache slice (LLVM coverage instrumentation = different
# rustc fingerprints) and shouldn't block PR merges.
#
# Build job builds (all host target, all `RUSTFLAGS=-D warnings`):
#   - pr4xis-cli                       — uploaded as artifact for downstream
#   - workspace libs + bins (release)  — populates the `release` cache slice
#   - test binaries via `cargo         — uploaded as artifact, `test` runs
#     nextest archive`                   directly from it (no recompile)
#
# Downstream jobs share `shared-key: release`, so they restore every
# compiled host crate from build's slice. The only Rust compilation
# in `test`/`lint-docs`/`wasm` is incremental over already-compiled
# state: `test` is a no-compile archive run, `lint-docs` just runs
# clippy+rustdoc over cached artefacts, and `wasm` compiles only the
# wasm32 target (host crates `pr4xis-cli`/`pr4xis-domains`/`pr4xis-
# web`/`pr4xis-e2e` are already in `target/release/`).
#
# Release pipeline (replaces the old release-please + katyo pair):
#   release-plz-pr      — opens / updates a Release PR with version
#                          bumps + per-crate CHANGELOG entries derived
#                          from conventional commits. Runs every push
#                          to master.
#   release-plz-release — on master, detects merged Release PRs (or
#                          any commit whose Cargo.toml version is ahead
#                          of crates.io) and publishes + tags + makes
#                          GitHub releases. cargo-semver-checks gates
#                          version-vs-API consistency per crate.
# ───────────────────────────────────────────────────────────────────

jobs:
  # Build pr4xis-cli once + fetch external data. Uploads the binary
  # as an artifact every downstream Rust job reuses; populates the
  # `release` Swatinem cache slice they all restore from.
  build:
    name: Build (host + test archive + data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - uses: taiki-e/install-action@cargo-nextest
      - name: Cache WordNet XML
        uses: actions/cache@v5
        with:
          path: crates/domains/data/wordnet/english-wordnet-2025.xml
          key: wordnet-english-2025-v1
      - name: Cache fetched external data (USC titles + conformance suites)
        uses: actions/cache@v5
        with:
          path: |
            crates/domains/data/legal/uscode
            crates/domains/data/markup-schemas/xsts
            crates/domains/data/markup-schemas/xmlconf
          key: praxis-data-${{ hashFiles('praxis.lock') }}
      # Build pr4xis-cli + the full workspace + all test binaries in
      # one pass. Downstream `lint-docs` and `test` then run against the
      # populated `release` cache slice with no further compilation —
      # see `nextest archive` step below.
      #
      # Matching `-D warnings` is essential — without it, the cache
      # slice this job writes has different rustc fingerprints than the
      # slice `lint-docs` / `test` / `wasm` expect, and they would
      # recompile from scratch on restore. Same flags everywhere keeps
      # `shared-key: release` actually shared.
      - name: Build pr4xis-cli (release)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build -p pr4xis-cli --release
      - name: Fetch external data
        run: ./target/release/pr4xis update
      # `cargo nextest archive` compiles every workspace test binary
      # (and the workspace libs they depend on) into a single
      # self-contained tarball. The `test` job downloads this archive
      # and runs the tests directly without recompiling — eliminates
      # the largest single source of CI wall time.
      - name: Build nextest archive
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo nextest archive --workspace --profile ci --release --archive-file target/nextest-archive.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: pr4xis-cli
          path: target/release/pr4xis
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: nextest-archive
          path: target/nextest-archive.tar.zst
          retention-days: 1

  # All host-target lint + doc + doctest passes against the same warm
  # `target/release/` tree. One workspace compile, four cheap incremental
  # passes on top.
  lint-docs:
    name: Lint & Docs
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - name: Cache WordNet XML
        uses: actions/cache@v5
        with:
          path: crates/domains/data/wordnet/english-wordnet-2025.xml
          key: wordnet-english-2025-v1
      - name: Cache fetched external data
        uses: actions/cache@v5
        with:
          path: |
            crates/domains/data/legal/uscode
            crates/domains/data/markup-schemas/xsts
            crates/domains/data/markup-schemas/xmlconf
          key: praxis-data-${{ hashFiles('praxis.lock') }}
      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      - uses: actions/download-artifact@v8
        with:
          name: pr4xis-cli
          path: target/release
      - name: Make pr4xis-cli executable
        run: chmod +x target/release/pr4xis
      - name: Materialise external data (no-op on data-cache hit)
        run: ./target/release/pr4xis update
      - name: Clippy (release)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo clippy --workspace --all-targets --release -- -D warnings
      - name: Docs (release)
        env:
          RUSTDOCFLAGS: "-D warnings -D rustdoc::broken_intra_doc_links -D rustdoc::invalid_html_tags"
        run: cargo doc --workspace --no-deps --release
      - name: Doc Tests (release)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --doc --workspace --release
      - name: mdBook Test
        run: mdbook test docs/

  # Runs the workspace test suite from the prebuilt nextest archive
  # that `build` uploads — no Rust compilation happens here. The
  # archive contains every test binary; this job just extracts and
  # executes. Saves ~10 minutes of compile time per CI run.
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-nextest
      - name: Cache WordNet XML
        uses: actions/cache@v5
        with:
          path: crates/domains/data/wordnet/english-wordnet-2025.xml
          key: wordnet-english-2025-v1
      - name: Cache fetched external data
        uses: actions/cache@v5
        with:
          path: |
            crates/domains/data/legal/uscode
            crates/domains/data/markup-schemas/xsts
            crates/domains/data/markup-schemas/xmlconf
          key: praxis-data-${{ hashFiles('praxis.lock') }}
      - uses: actions/download-artifact@v8
        with:
          name: pr4xis-cli
          path: target/release
      - name: Make pr4xis-cli executable
        run: chmod +x target/release/pr4xis
      - name: Materialise external data (no-op on data-cache hit)
        run: ./target/release/pr4xis update
      # Parse-once: compile each registered USC title into its portable COMPACT
      # `.cprx.gz` ONCE, up front, so the corpus loader content-gates + deserialises
      # the archive (~ms total) instead of re-parsing ~250 MB of USLM XML in every
      # nextest process (process-per-test). `--compact` emits + verifies ONLY the
      # runtime fast-load cache `loaded()` reads (the only on-disk cache nextest
      # touches), and verifies the portable `[compact_archive_signatures]` pins for
      # all titles incl. the giants — it skips the heavy, toolchain-coupled rkyv
      # envelopes (the `decompile` artifacts, which no test reads). Cached on
      # praxis.lock so a warm run restores the archives and skips the emit entirely.
      - name: Cache compiled .prx archives
        id: prx-cache
        uses: actions/cache@v5
        with:
          path: .prx-cache
          key: prx-cache-${{ hashFiles('praxis.lock') }}
      - name: Compile compact .prx archives (parse-once fast load)
        if: steps.prx-cache.outputs.cache-hit != 'true'
        run: ./target/release/pr4xis compile --compact
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: target/
      - name: Run nextest from archive
        run: cargo nextest run --archive-file target/nextest-archive.tar.zst --workspace-remap . --profile ci
      - name: Upload test results to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && !cancelled()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci/junit.xml
          report_type: test_results

  # Browser-side wasm coverage + Firefox WebDriver E2E. Sequenced
  # after `build` and uses the same `release` cache slice — every
  # host-target binary this job needs (`pr4xis-cli` for the data
  # update, `pr4xis-domains` for `emit_prx`, `pr4xis-web` for the E2E
  # server, `pr4xis-e2e` for the WebDriver client) is already
  # compiled in `target/release/` from `build`. wasm-only work
  # (wasm-pack build + wasm-pack test for the wasm32 target) is the
  # only Rust compilation that actually happens here.
  wasm:
    name: WASM tests + E2E
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - name: Cache WordNet XML
        uses: actions/cache@v5
        with:
          path: crates/domains/data/wordnet/english-wordnet-2025.xml
          key: wordnet-english-2025-v1
      - name: Cache fetched external data
        uses: actions/cache@v5
        with:
          path: |
            crates/domains/data/legal/uscode
            crates/domains/data/markup-schemas/xsts
            crates/domains/data/markup-schemas/xmlconf
          key: praxis-data-${{ hashFiles('praxis.lock') }}
      - uses: actions/download-artifact@v8
        with:
          name: pr4xis-cli
          path: target/release
      - name: Make pr4xis-cli executable
        run: chmod +x target/release/pr4xis
      - name: Materialise external data (no-op on data-cache hit)
        run: ./target/release/pr4xis update
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: wasm-pack build (release, for E2E)
        run: |
          cd crates/wasm
          wasm-pack build --target web --release
      - name: wasm-bindgen tests (headless Firefox, release)
        run: |
          cd crates/wasm
          wasm-pack test --release --headless --firefox
      # pr4xis-wasm is workspace-excluded (wasm32 lib), so its NATIVE
      # `mod acceptance` #[test]s (browser-loads-a-prx with/without the
      # corpus + fail-closed against a wrong/tampered root) never run
      # under `cargo test --workspace`. Run them explicitly on the host
      # target — mirrors the dev-ci `wasm native acceptance tests` step
      # exactly (local == CI).
      - name: wasm native acceptance tests (release)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --manifest-path crates/wasm/Cargo.toml --release
      # praxis-corpus-tests is workspace-excluded so the default nextest run
      # never re-parses the multi-hundred-MB USC titles per process-isolated
      # test. It runs under `cargo test` (one process → a LazyLock fixture parses
      # each giant once) on the host, with the giants materialised above. Mirrors
      # the dev-ci `heavy-corpus tests` step exactly (local == CI).
      - name: heavy-corpus tests (release)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --manifest-path crates/praxis-corpus-tests/Cargo.toml --release
      - name: Emit .prx.gz ontology artifacts (for /ontologies/ click-to-load)
        run: |
          mkdir -p crates/wasm/ontologies
          cargo run -p pr4xis-domains --features "fetch codegen" --release --example emit_prx -- crates/wasm/ontologies
      - name: Run Rust WebDriver E2E
        run: |
          cargo run -p pr4xis-web --release 3000 &
          WEB=$!
          geckodriver --port 4444 &
          GECKO=$!
          for _ in $(seq 1 90); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 1; done
          for _ in $(seq 1 30); do curl -sf http://localhost:4444/status >/dev/null && break; sleep 1; done
          set +e
          ( cd crates/e2e && cargo run --release )
          code=$?
          kill "$WEB" "$GECKO" 2>/dev/null || true
          exit "$code"

  # Cheap parallel checks that don't need a Rust compile.
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  no-ignored-doctests:
    name: No ignored doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Forbid ```ignore in code/docs
        run: |
          if command grep -rn '```ignore' crates/ docs/ --include='*.rs' --include='*.md' ; then
            echo "::error::\`\`\`ignore is forbidden — every doctest must be machine-verified. Use \`\`\`text for pseudo-syntax illustrations, \`\`\`no_run / \`\`\`compile_fail when appropriate. See memory:feedback_no_unvalidated_doc_code."
            exit 1
          fi


  pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: [release-plz-release]
    if: needs.release-plz-release.outputs.releases_created == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm-release
      - name: Cache WordNet XML
        uses: actions/cache@v5
        with:
          path: crates/domains/data/wordnet/english-wordnet-2025.xml
          key: wordnet-english-2025-v1
      - name: Fetch WordNet (needed by wasm build.rs codegen step)
        run: cargo run -p pr4xis-cli --release --quiet -- update
      # Emit a `.prx.gz` per registered OWL vocabulary directly into the
      # pages tree. The emitter walks the registry, reads each bundled
      # in-repo `.owl`, and round-trip-validates every artifact through the
      # fail-closed load gate (embedded source hash must match praxis.lock).
      - name: Emit .prx.gz ontology artifacts
        run: |
          mkdir -p pages/ontologies
          cargo run -p pr4xis-domains --features "fetch codegen" --release --example emit_prx -- pages/ontologies
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM
        run: |
          cd crates/wasm
          wasm-pack build --target web --release
      - name: Build presentation
        run: npx @marp-team/marp-cli docs/presentations/overview.md --html -o docs/presentations/index.html
      - name: Assemble pages
        run: |
          mkdir -p pages/pkg pages/decks/technical pages/sources pages/ontologies
          cp docs/chat/index.html pages/index.html
          cp docs/worker.js pages/worker.js
          cp -r crates/wasm/pkg/* pages/pkg/
          # On-demand source documents (USLM XML), staged by the wasm
          # build. GitHub Pages rejects files >100 MB, so skip oversized
          # titles (e.g. Title 42 ≈ 113 MB) — they 404 gracefully on the
          # hosted demo (Retry shows the failure); all of it works under
          # `dev-web` locally.
          find crates/wasm/sources -name '*.xml' -size -95M -exec cp {} pages/sources/ \;
          cp docs/presentations/index.html pages/decks/technical/index.html
          cp docs/praxis-logo-dark.jpg pages/praxis-logo-dark.jpg
          cp docs/praxis-logo-light.jpg pages/praxis-logo-light.jpg
          cp docs/praxis-logo-video-dark.mp4 pages/praxis-logo-video-dark.mp4
          cp docs/praxis-logo-video-light.mp4 pages/praxis-logo-video-light.mp4
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      # Publish the SAME .prx.gz files to the pr4xis-domains release as
      # immutable archive assets. The release-plz `releases` output is a
      # JSON array — we pull the pr4xis-domains tag out of it. If
      # pr4xis-domains wasn't released this run (e.g. only pr4xis-cli
      # was bumped), skip upload cleanly.
      - name: Upload .prx.gz to pr4xis-domains release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ needs.release-plz-release.outputs.releases }}
        run: |
          TAG=$(echo "$RELEASES" | jq -r '.[] | select(.package_name == "pr4xis-domains") | .tag')
          if [ -n "$TAG" ] && [ "$TAG" != "null" ]; then
            gh release upload "$TAG" pages/ontologies/*.prx.gz --clobber
          else
            echo "pr4xis-domains not released in this run; skipping .prx.gz upload"
          fi

  # release-plz replaces the old release-please + katyo/publish-crates
  # pair. Reads the current repo state, queries crates.io for each
  # published-crate's last released version, and either opens a Release
  # PR (via the `release-pr` command) or publishes + tags + creates a
  # GitHub release (via the `release` command).
  #
  # cargo-semver-checks runs per-package via `semver_check = true` in
  # release-plz.toml, so a misbumped version on a breaking change is
  # rejected at PR-create time.
  release-plz-release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint-docs, test, wasm, format, no-ignored-doctests]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.lint-docs.result == 'success' &&
      needs.test.result == 'success' &&
      needs.wasm.result == 'success' &&
      needs.format.result == 'success' &&
      needs.no-ignored-doctests.result == 'success'
    permissions:
      contents: write
      pull-requests: read
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      releases: ${{ steps.release-plz.outputs.releases }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5.130
        id: release-plz
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    name: Release-PR
    runs-on: ubuntu-latest
    needs: [lint-docs, test, wasm, format, no-ignored-doctests]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.lint-docs.result == 'success' &&
      needs.test.result == 'success' &&
      needs.wasm.result == 'success' &&
      needs.format.result == 'success' &&
      needs.no-ignored-doctests.result == 'success'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5.130
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
