name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

# ── CI architecture ────────────────────────────────────────────────
# All Rust jobs build in `--release`. `[profile.dev]` does not appear
# in CI; `target/release/` is the only profile that exists. Every
# host-target job uses the same `Swatinem/rust-cache@v2` shared-key
# ("release") so the dep graph compile happens once across the
# workflow and all downstream jobs restore the same cache slice.
# Wasm-target jobs (`wasm`, `pages`) share it too rather than using a
# separate pool: both run host-target Rust before any wasm work, and a
# key only one job writes is a key that is always cold.
#
# Job graph:
#   build ──► lint-docs ──┐
#         ├─► test ───────┤
#         └─► wasm ───────┼─► release-plz-release ──► pages
#                         └─► release-plz-pr        (opens Release PR)
#   format, no-ignored-doctests       (independent, no compile)
#
# Coverage runs in its own workflow (.github/workflows/coverage.yml)
# — nightly cron + on Release PRs (label-filtered) — because it uses
# a different cache slice (LLVM coverage instrumentation = different
# rustc fingerprints) and shouldn't block PR merges.
#
# Build job builds (all host target, all `RUSTFLAGS=-D warnings`):
#   - pr4xis-cli                       — uploaded as artifact for downstream
#   - workspace libs + bins (release)  — populates the `release` cache slice
#   - test binaries via `cargo         — uploaded as artifact, `test` runs
#     nextest archive`                   directly from it (no recompile)
#
# Downstream jobs share `shared-key: release`, so they restore every
# compiled host crate from build's slice. The only Rust compilation
# in `test`/`lint-docs`/`wasm` is incremental over already-compiled
# state: `test` is a no-compile archive run, `lint-docs` just runs
# clippy+rustdoc over cached artefacts, and `wasm` compiles only the
# wasm32 target (host crates `pr4xis-cli`/`pr4xis-domains`/`pr4xis-
# web`/`pr4xis-e2e` are already in `target/release/`).
#
# Release pipeline (replaces the old release-please + katyo pair):
#   release-plz-pr      — opens / updates a Release PR with version
#                          bumps + per-crate CHANGELOG entries derived
#                          from conventional commits. Runs every push
#                          to master.
#   release-plz-release — on master, detects merged Release PRs (or
#                          any commit whose Cargo.toml version is ahead
#                          of crates.io) and publishes + tags + makes
#                          GitHub releases. cargo-semver-checks gates
#                          version-vs-API consistency per crate.
# ───────────────────────────────────────────────────────────────────

jobs:
  # Build pr4xis-cli once + fetch external data. Uploads the binary
  # as an artifact every downstream Rust job reuses; populates the
  # `release` Swatinem cache slice they all restore from.
  build:
    name: Build (host + test archive + data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - uses: taiki-e/install-action@cargo-nextest
      - name: Cache WordNet XML
        uses: actions/cache@v5
        with:
          path: crates/domains/data/wordnet/english-wordnet-2025.xml
          key: wordnet-english-2025-v1
      - name: Cache fetched external data (USC titles + conformance suites)
        uses: actions/cache@v5
        with:
          path: |
            crates/domains/data/legal/uscode
            crates/domains/data/markup-schemas/xsts
            crates/domains/data/markup-schemas/xmlconf
          key: praxis-data-${{ hashFiles('praxis.lock') }}
      # Build pr4xis-cli + the full workspace + all test binaries in
      # one pass. Downstream `lint-docs` and `test` then run against the
      # populated `release` cache slice with no further compilation —
      # see `nextest archive` step below.
      #
      # Matching `-D warnings` is essential — without it, the cache
      # slice this job writes has different rustc fingerprints than the
      # slice `lint-docs` / `test` / `wasm` expect, and they would
      # recompile from scratch on restore. Same flags everywhere keeps
      # `shared-key: release` actually shared.
      - name: Build pr4xis-cli (release)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build -p pr4xis-cli --release
      - name: Fetch external data
        run: ./target/release/pr4xis update
      # `cargo nextest archive` compiles every workspace test binary
      # (and the workspace libs they depend on) into a single
      # self-contained tarball. The `test` job downloads this archive
      # and runs the tests directly without recompiling — eliminates
      # the largest single source of CI wall time.
      - name: Build nextest archive
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo nextest archive --workspace --profile ci --release --archive-file target/nextest-archive.tar.zst
      # Constitution COMPLETENESS gate: every real test declares a guarantee
      # (untagged=0) and every registered tag maps to a real test (phantom=0).
      # This is inherently a TWO-PROCESS diff — libtest's inventory is only
      # enumerable from outside the binary (`--list`; rust-lang#50297 keeps the
      # in-process inventory unstable) — so the shell gate IS the minimal
      # machine-checkable form, not a workaround. The in-process
      # constitution_coverage meta-test asserts only PARTITION coverage; without
      # this step, untagged tests pass CI silently.
      #
      # Runs over all four crates that carry a `constitution_coverage` gate
      # test (pr4xis-domains has the richest coverage; pr4xis, pr4xis-runtime,
      # and pr4xis-chat each carry the minimal tag-dump version) — the
      # constitution binds the substrate and the pipeline layers, not only the
      # domain corpus.
      - name: Constitution completeness gate
        run: |
          bash scripts/constitution-gate.sh pr4xis --enforce
          bash scripts/constitution-gate.sh pr4xis-runtime --enforce
          bash scripts/constitution-gate.sh pr4xis-chat --enforce
          bash scripts/constitution-gate.sh pr4xis-domains --enforce
      # The caregiver demonstrator is the artifact a judge actually opens, and
      # no Rust test can see an HTML id or a hash route. These two gates are
      # the mechanical form of two failures that really happened: a blank page
      # from a binding to an element that had been removed, and figures on the
      # page drifting from the corpus they claim to be computed from.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Caregiver demonstrator gates (DOM contract + program ladder)
        run: |
          node docs/chat/dom-contract.test.mjs
          node docs/chat/program-ladder.test.mjs
          node docs/chat/abstain-load-gate.test.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: pr4xis-cli
          path: target/release/pr4xis
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: nextest-archive
          path: target/nextest-archive.tar.zst
          retention-days: 1

  # All host-target lint + doc + doctest passes against the same warm
  # `target/release/` tree. One workspace compile, four cheap incremental
  # passes on top.
  lint-docs:
    name: Lint & Docs
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - name: Cache WordNet XML
        uses: actions/cache@v5
        with:
          path: crates/domains/data/wordnet/english-wordnet-2025.xml
          key: wordnet-english-2025-v1
      - name: Cache fetched external data
        uses: actions/cache@v5
        with:
          path: |
            crates/domains/data/legal/uscode
            crates/domains/data/markup-schemas/xsts
            crates/domains/data/markup-schemas/xmlconf
          key: praxis-data-${{ hashFiles('praxis.lock') }}
      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      - uses: actions/download-artifact@v8
        with:
          name: pr4xis-cli
          path: target/release
      - name: Make pr4xis-cli executable
        run: chmod +x target/release/pr4xis
      - name: Materialise external data (no-op on data-cache hit)
        run: ./target/release/pr4xis update
      - name: Clippy (release)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo clippy --workspace --all-targets --release -- -D warnings
      - name: Docs (release)
        env:
          RUSTDOCFLAGS: "-D warnings -D rustdoc::broken_intra_doc_links -D rustdoc::invalid_html_tags"
        run: cargo doc --workspace --no-deps --release
      - name: Doc Tests (release)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --doc --workspace --release
      - name: mdBook Test
        run: mdbook test docs/

  # Regenerates the ACL Caregiver AI Challenge narrative PDFs and gates on
  # ACL's real 15-page narrative-body limit (Cover Page is capped
  # separately at 1 page and excluded from this count) — this exact class
  # of problem (a narrative silently drifting over the limit after an
  # edit) was caught by hand once already; this job is what should catch
  # it automatically next time. Independent of the Rust build (no cargo
  # dependency), so it runs on every push/PR rather than only master.
  caregiver-pdf:
    name: Caregiver PDF page limit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      # Ubuntu 24.04's apt pandoc is 3.1.3 -- the `typst` output writer this
      # pipeline depends on wasn't added until pandoc 3.1.9. Pin a version
      # confirmed to have it (matches the 3.7.0.2 tested locally via nix)
      # rather than take whatever apt happens to ship.
      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: "3.7.0.2"
      - name: Install Liberation fonts + poppler-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-liberation poppler-utils
      - name: Install typst
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/v0.15.0/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin typst-x86_64-unknown-linux-musl/typst
          typst --version
      - name: Build + page-limit check
        env:
          TYPST_FONT_PATHS: /usr/share/fonts/truetype/liberation
        run: |
          dir="docs/caregiver-challenge"
          pdfdir="$dir/pdf"
          mkdir -p "$pdfdir/build"
          over_limit=0
          for md in "$dir"/*.md; do
            name="$(basename "${md%.md}")"
            pandoc -f markdown+raw_tex --lua-filter="$pdfdir/pandoc-typst-fixups.lua" \
              "$md" --to typst -o "$pdfdir/build/$name.typ"
            cp "$pdfdir/build/$name.typ" "$pdfdir/build/fragment.typ"
            # /Title PDF metadata (a standard 508/PDF-UA checker item). The
            # SAME per-document titles devenv.nix's dev-caregiver-pdf passes;
            # without them every CI-built PDF got main.typ's generic fallback,
            # so the reproducible artifact and the submitted file disagreed on
            # the first property an accessibility checker reads.
            case "$name" in
              track1-phase1-narrative) doctitle="pr4xis Caregiver Answer Engine - ACL Caregiver AI Challenge Track 1 Phase 1 Narrative" ;;
              track2-phase1-narrative) doctitle="pr4xis HCBS/EVV Compliance Navigator - ACL Caregiver AI Challenge Track 2 Phase 1 Narrative" ;;
              track1-phase1-appendix) doctitle="pr4xis Caregiver Answer Engine - ACL Caregiver AI Challenge Track 1 Appendix" ;;
              track2-phase1-appendix) doctitle="pr4xis HCBS/EVV Compliance Navigator - ACL Caregiver AI Challenge Track 2 Appendix" ;;
              smart40-validation-log) doctitle="Smart 40 Validation Log - ACL Caregiver AI Challenge Phase 1 Data Output Logs" ;;
              *) doctitle="$name" ;;
            esac
            typst compile --pdf-standard ua-1 --input "build-date=$(date +%Y-%m-%d)" --input "doc-title=$doctitle" "$pdfdir/main.typ" "$pdfdir/build/$name.pdf"
            pages="$(pdfinfo "$pdfdir/build/$name.pdf" | awk '/^Pages:/{print $2}')"
            echo "$name: $pages total pages"
            if [[ "$name" == *-phase1-narrative ]]; then
              narrative_pages=$((pages - 1))
              if [[ $narrative_pages -gt 15 ]]; then
                echo "::error::$name narrative body is $narrative_pages pages, over ACL's 15-page limit (cover page excluded)"
                over_limit=1
              fi
            fi
            # ACL caps appendices at 10 pages. Ungated, one added sentence
            # silently breaks compliance -- and both appendices sit at exactly
            # 10 today, so the margin is zero.
            if [[ "$name" == *-phase1-appendix ]] && [[ $pages -gt 10 ]]; then
              echo "::error::$name is $pages pages, over ACL's 10-page appendix limit"
              over_limit=1
            fi
          done
          exit $over_limit
      - uses: actions/upload-artifact@v4
        with:
          name: caregiver-challenge-pdfs
          path: docs/caregiver-challenge/pdf/build/*.pdf

  # Runs the workspace test suite from the prebuilt nextest archive
  # that `build` uploads — no Rust compilation happens here. The
  # archive contains every test binary; this job just extracts and
  # executes. Saves ~10 minutes of compile time per CI run.
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-nextest
      - name: Cache WordNet XML
        uses: actions/cache@v5
        with:
          path: crates/domains/data/wordnet/english-wordnet-2025.xml
          key: wordnet-english-2025-v1
      - name: Cache fetched external data
        uses: actions/cache@v5
        with:
          path: |
            crates/domains/data/legal/uscode
            crates/domains/data/markup-schemas/xsts
            crates/domains/data/markup-schemas/xmlconf
          key: praxis-data-${{ hashFiles('praxis.lock') }}
      - uses: actions/download-artifact@v8
        with:
          name: pr4xis-cli
          path: target/release
      - name: Make pr4xis-cli executable
        run: chmod +x target/release/pr4xis
      - name: Materialise external data (no-op on data-cache hit)
        run: ./target/release/pr4xis update
      # Parse-once: compile each registered USC title into its portable COMPACT
      # `.cprx.gz` ONCE, up front, so the corpus loader content-gates + deserialises
      # the archive (~ms total) instead of re-parsing ~250 MB of USLM XML in every
      # nextest process (process-per-test). `--compact` emits + verifies ONLY the
      # runtime fast-load cache `loaded()` reads (the only on-disk cache nextest
      # touches), and verifies the portable `[compact_archive_signatures]` pins for
      # all titles incl. the giants — it skips the heavy, toolchain-coupled rkyv
      # envelopes (the `decompile` artifacts, which no test reads). Cached on
      # praxis.lock so a warm run restores the archives and skips the emit entirely.
      - name: Cache compiled .prx archives
        id: prx-cache
        uses: actions/cache@v5
        with:
          path: .prx-cache
          key: prx-cache-${{ hashFiles('praxis.lock') }}
      - name: Compile compact .prx archives (parse-once fast load)
        if: steps.prx-cache.outputs.cache-hit != 'true'
        run: ./target/release/pr4xis compile --compact
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: target/
      - name: Run nextest from archive
        run: cargo nextest run --archive-file target/nextest-archive.tar.zst --workspace-remap . --profile ci
      - name: Upload test results to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && !cancelled()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci/junit.xml
          report_type: test_results

  # Browser-side wasm coverage + Firefox WebDriver E2E. Sequenced
  # after `build` and uses the same `release` cache slice — every
  # host-target binary this job needs (`pr4xis-cli` for the data
  # update, `pr4xis-domains` for `emit_prx`, `pr4xis-web` for the E2E
  # server, `pr4xis-e2e` for the WebDriver client) is already
  # compiled in `target/release/` from `build`. wasm-only work
  # (wasm-pack build + wasm-pack test for the wasm32 target) is the
  # only Rust compilation that actually happens here.
  wasm:
    name: WASM tests + E2E
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - name: Cache WordNet XML
        uses: actions/cache@v5
        with:
          path: crates/domains/data/wordnet/english-wordnet-2025.xml
          key: wordnet-english-2025-v1
      - name: Cache fetched external data
        uses: actions/cache@v5
        with:
          path: |
            crates/domains/data/legal/uscode
            crates/domains/data/markup-schemas/xsts
            crates/domains/data/markup-schemas/xmlconf
          key: praxis-data-${{ hashFiles('praxis.lock') }}
      - uses: actions/download-artifact@v8
        with:
          name: pr4xis-cli
          path: target/release
      - name: Make pr4xis-cli executable
        run: chmod +x target/release/pr4xis
      - name: Materialise external data (no-op on data-cache hit)
        run: ./target/release/pr4xis update
      # This job runs the heavy-corpus suite below, whose `usc_loaded()` reads
      # the content-addressed compact archives (~1.4s for the whole USC corpus)
      # and otherwise falls back to parsing ~85 MB of USLM XML. Only `.prx-
      # cache/usc-defines-compact/*.defines.cprx.gz` is committed; the compact
      # corpus archives are generated. Same cache key and same emit the `test`
      # job uses, so whichever of the two runs first populates it for both.
      - name: Cache compiled .prx archives
        id: prx-cache
        uses: actions/cache@v5
        with:
          path: .prx-cache
          key: prx-cache-${{ hashFiles('praxis.lock') }}
      - name: Compile compact .prx archives (parse-once fast load)
        if: steps.prx-cache.outputs.cache-hit != 'true'
        run: ./target/release/pr4xis compile --compact
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: wasm-pack build (release, for E2E)
        run: |
          cd crates/wasm
          wasm-pack build --target web --release
      - name: wasm-bindgen tests (headless Firefox, release)
        run: |
          cd crates/wasm
          wasm-pack test --release --headless --firefox
      # pr4xis-wasm is workspace-excluded (wasm32 lib), so its NATIVE
      # `mod acceptance` #[test]s (browser-loads-a-prx with/without the
      # corpus + fail-closed against a wrong/tampered root) never run
      # under `cargo test --workspace`. Run them explicitly on the host
      # target — mirrors the dev-ci `wasm native acceptance tests` step
      # exactly (local == CI).
      - name: wasm native acceptance tests (release)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --manifest-path crates/wasm/Cargo.toml --release
      # praxis-corpus-tests is workspace-excluded so the default nextest run
      # never re-parses the multi-hundred-MB USC titles per process-isolated
      # test. It runs under `cargo test` (one process → a LazyLock fixture parses
      # each giant once) on the host, with the giants materialised above.
      #
      # local == CI is ENFORCED, not asserted: this runs the same script
      # dev-ci runs. It previously ran the crate unfiltered while claiming to
      # mirror dev-ci, which pulled in the two deliberately-red suites
      # (`caregiver_questions_generated`, 4,075 of 4,219 red by design, and
      # `chat_faithfully_realizes_the_loaded_corpus`) — so this job failed on
      # every push and `pages`, which needs it, never deployed.
      # `praxis-corpus-tests` is workspace-EXCLUDED, so `--manifest-path` builds
      # it into `crates/praxis-corpus-tests/target/` by default — which
      # `Swatinem/rust-cache` does not cache (it takes `./target`, and its
      # `workspaces:` input is unset), so this step recompiled the crate's whole
      # release dependency graph on every run. `devenv.nix` already sets this
      # variable locally; setting it here is what makes the "local == CI" claim
      # above true for the build as well as the test list. Sharing a target dir
      # is not feature unification — that follows workspace membership, which is
      # unchanged; differing feature sets simply carry differing fingerprints.
      - name: heavy-corpus tests (release)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: bash scripts/heavy-corpus-tests.sh
      - name: Emit .prx.gz ontology artifacts (for /ontologies/ click-to-load)
        run: |
          mkdir -p crates/wasm/ontologies
          cargo run -p pr4xis-domains --features "fetch codegen" --release --example emit_prx -- crates/wasm/ontologies
      - name: Run Rust WebDriver E2E
        run: |
          cargo run -p pr4xis-web --release 3000 &
          WEB=$!
          geckodriver --port 4444 &
          GECKO=$!
          for _ in $(seq 1 90); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 1; done
          for _ in $(seq 1 30); do curl -sf http://localhost:4444/status >/dev/null && break; sleep 1; done
          set +e
          ( cd crates/e2e && cargo run --release )
          code=$?
          kill "$WEB" "$GECKO" 2>/dev/null || true
          exit "$code"

  # Cheap parallel checks that don't need a Rust compile.
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  no-ignored-doctests:
    name: No ignored doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Forbid ```ignore in code/docs
        run: |
          if command grep -rn '```ignore' crates/ docs/ --include='*.rs' --include='*.md' ; then
            echo "::error::\`\`\`ignore is forbidden — every doctest must be machine-verified. Use \`\`\`text for pseudo-syntax illustrations, \`\`\`no_run / \`\`\`compile_fail when appropriate. See memory:feedback_no_unvalidated_doc_code."
            exit 1
          fi

  # ── The release invariant — fail fast at PR time, never wedge master ──────
  # release-plz computes each crate's next version from its crates.io baseline.
  # Its tag-vs-registry safety check ABORTS the Release-PR for the ENTIRE
  # workspace if any crate it would publish has a git release tag but is absent
  # from crates.io (HTTP 404):
  #     "package X not found in the registry, but the git tag X-vN exists.
  #      Consider running cargo publish manually to publish this package."
  # That forbidden state — `publish=true` + tagged + 404 — has wedged master
  # repeatedly (it is exactly what `release=true` tag-without-publish for
  # pr4xis-domains set up, then #219's gate removal exposed). The invariant:
  # every workspace member is EITHER published to crates.io (a registry row at
  # >= its highest tag) OR marked `publish = false` in release-plz.toml (which
  # release-plz exempts from the check). This job enforces it at PR time so the
  # forbidden state can never reach master.
  publish-invariant:
    name: Publish invariant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags, to compare against the registry
      - name: No publish=true crate may be tagged ahead of its crates.io version
        run: |
          set -uo pipefail
          # crates.io's API REQUIRES a User-Agent (it 403s without one), so every
          # query carries this identifying header.
          UA="pr4xis-ci-publish-invariant (https://github.com/i-am-logger/pr4xis)"
          # Crates release-plz.toml marks publish = false (apps / examples) are
          # EXEMPT — release-plz never publishes them, so a tag without a
          # registry entry is harmless for them.
          exempt=$(awk '
            /^\[\[package\]\]/ { name = "" }
            match($0, /^name[[:space:]]*=[[:space:]]*"([^"]+)"/, a) { name = a[1] }
            /^publish[[:space:]]*=[[:space:]]*false/ { if (name) print name }
          ' release-plz.toml | sort -u)

          # crates.io max_version for a crate, resilient to transient API errors.
          # Echoes the version (200), "404" (definitively absent), or "ERROR"
          # (no definitive answer after retries → the caller FAILS CLOSED rather
          # than treat a crates.io outage / 5xx / timeout as a pass).
          registry_version() {
            local crate=$1 i code
            for i in 1 2 3 4; do
              code=$(curl -s -A "$UA" -o /tmp/ci_crate.json -w '%{http_code}' \
                "https://crates.io/api/v1/crates/${crate}" 2>/dev/null || echo 000)
              case "$code" in
                200) jq -r '.crate.max_version' /tmp/ci_crate.json; return 0 ;;
                404) echo "404"; return 0 ;;
                *)   sleep $((i * 3)) ;;  # 000/5xx/timeout — retry with backoff
              esac
            done
            echo "ERROR"
          }

          fail=0
          # Walk every workspace member dir → its package name.
          for dir in $(awk '/members[[:space:]]*=[[:space:]]*\[/{f=1;next} /\]/{f=0} f{gsub(/[",[:space:]]/,"");if($0!="")print}' Cargo.toml); do
            name=$(awk -F'"' '/^name[[:space:]]*=/{print $2; exit}' "$dir/Cargo.toml")
            [ -z "$name" ] && continue
            # Exempt (publish=false in release-plz.toml) → skip.
            if printf '%s\n' "$exempt" | grep -qx "$name"; then continue; fi
            # A member's own Cargo.toml publish=false → also exempt.
            if awk '/^\[package\]/{p=1} p&&/^publish[[:space:]]*=[[:space:]]*false/{found=1} END{exit !found}' "$dir/Cargo.toml"; then continue; fi
            # Highest release tag for this crate, if any (nothing tagged → nothing
            # release-plz will diff against; not yet the forbidden state).
            tag=$(git tag --list "${name}-v*" | sort -V | tail -1)
            [ -z "$tag" ] && continue
            tagver=${tag#"${name}-v"}
            rv=$(registry_version "$name")
            if [ "$rv" = "404" ]; then
              echo "::error::Publish invariant: '${name}' is tagged (${tag}) but absent from crates.io (404). release-plz will ABORT the Release-PR for the whole workspace. Fix: publish it once (\`cargo publish -p ${name}\`) before it is tagged, OR mark it \`publish = false\` in release-plz.toml."
              fail=1
            elif [ "$rv" = "ERROR" ]; then
              echo "::error::Publish invariant: could not verify crates.io for '${name}' after retries (transient API error). Failing closed — re-run the job; if crates.io is genuinely down, retry when it recovers."
              fail=1
            else
              # The full invariant: crates.io max_version must be >= the highest
              # tag. A registry BEHIND its tag is the same release-plz baseline
              # inconsistency as a 404.
              lower=$(printf '%s\n%s\n' "$rv" "$tagver" | sort -V | head -1)
              if [ "$lower" = "$rv" ] && [ "$rv" != "$tagver" ]; then
                echo "::error::Publish invariant: '${name}' crates.io max version (${rv}) is BEHIND its highest tag (${tagver}). release-plz's next-version baseline is inconsistent. Publish ${name} ${tagver} (or higher) to crates.io."
                fail=1
              fi
            fi
          done
          exit $fail


  # Deploy the docs site (chatbot / decks / the `.prx.gz` ontologies under
  # /ontologies/) on EVERY green master push — NOT gated on a release. It used to
  # be `needs: [release-plz-release]` + `if: releases_created == 'true'`, so the
  # public site only refreshed when a version was cut and went stale between
  # releases (and skipped entirely on a no-release push, e.g. when the workspace
  # is already up to date). Decoupled: it deploys whenever the build/test/wasm/
  # lint gates pass on master, the same success gate the release jobs use.
  pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: [lint-docs, test, wasm, format, no-ignored-doctests, caregiver-pdf]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.lint-docs.result == 'success' &&
      needs.test.result == 'success' &&
      needs.wasm.result == 'success' &&
      needs.format.result == 'success' &&
      needs.no-ignored-doctests.result == 'success' &&
      needs.caregiver-pdf.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # `release`, not a wasm-only pool: this job runs host-target Rust too
          # (`cargo run -p pr4xis-cli --release -- update`, the `emit_prx`
          # artifact step) before it builds any wasm, and `wasm`/`build` already
          # save wasm32 and host artefacts into this one slice.
          shared-key: release
      - name: Cache WordNet XML
        uses: actions/cache@v5
        with:
          path: crates/domains/data/wordnet/english-wordnet-2025.xml
          key: wordnet-english-2025-v1
      # `pr4xis update` materialises EVERY registered source, not just WordNet,
      # so without this the USC titles are re-downloaded on every deploy. Same
      # key the `build`/`lint-docs`/`wasm` jobs use, so this restores what they
      # already fetched and the update step below becomes a no-op.
      - name: Cache fetched external data
        uses: actions/cache@v5
        with:
          path: |
            crates/domains/data/legal/uscode
            crates/domains/data/markup-schemas/xsts
            crates/domains/data/markup-schemas/xmlconf
          key: praxis-data-${{ hashFiles('praxis.lock') }}
      - name: Fetch external data (no-op on data-cache hit)
        run: cargo run -p pr4xis-cli --release --quiet -- update
      # Emit a `.prx.gz` per registered OWL vocabulary directly into the
      # pages tree. The emitter walks the registry, reads each bundled
      # in-repo `.owl`, and round-trip-validates every artifact through the
      # fail-closed load gate (embedded source hash must match praxis.lock).
      - name: Emit .prx.gz ontology artifacts
        run: |
          mkdir -p pages/ontologies
          cargo run -p pr4xis-domains --features "fetch codegen" --release --example emit_prx -- pages/ontologies
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM
        run: |
          cd crates/wasm
          wasm-pack build --target web --release
      - name: Build presentation
        run: npx @marp-team/marp-cli docs/presentations/overview.md --html -o docs/presentations/index.html
      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      # `docs/SUMMARY.md` already has a full nav (Learn/Use/Understand/
      # Reference/Why/Research/Presentations/Papers) — `mdbook test docs/`
      # exercises it for doctested ```rust blocks, but nothing ever built
      # it to HTML and published it. Every page here becomes an
      # independently indexable, linkable URL under /docs/, instead of
      # only being reachable as raw markdown through the GitHub UI.
      - name: Build docs site (mdbook)
        run: mdbook build docs --dest-dir "$(pwd)/pages/docs"
      # Built by the caregiver-pdf job (this job's own `needs`), not
      # regenerated here — avoids installing pandoc/typst a second time.
      - uses: actions/download-artifact@v8
        with:
          name: caregiver-challenge-pdfs
          path: pages/caregiver-challenge
      - name: Assemble pages
        run: |
          mkdir -p pages/pkg pages/decks/technical pages/sources pages/ontologies
          cp docs/chat/index.html pages/index.html
          cp docs/worker.js pages/worker.js
          cp docs/caregiver-corpus-status.json pages/caregiver-corpus-status.json
          # One app: docs/chat/index.html carries the generic Chat + Engine
          # tabs and the ACL Caregiver AI Challenge tab (#caregiver,
          # #caregiver/tracks/1|2, #caregiver/ask|evidence|method), all on ONE
          # booted engine. dashboard.js is the caregiver tab's controller,
          # mounted by index.html with the shared engine.
          cp docs/chat/dashboard.js pages/dashboard.js
          cp docs/chat/chat-ui.js pages/chat-ui.js
          cp docs/chat/tokens.css pages/tokens.css
          cp docs/smart40_validation_log_dump.json pages/smart40_validation_log_dump.json
          # Bench data artifacts — copied only once their generator tests have
          # produced them (guarded so a not-yet-generated artifact is a
          # graceful on-page "not yet generated" state, not a CI failure).
          for f in caregiver-corpus-slim.json adversarial-corpus.json smart40-protocol.json; do
            [ -f "docs/$f" ] && cp "docs/$f" "pages/$f" || true
          done
          cp -r crates/wasm/pkg/* pages/pkg/
          # On-demand sources staged by the wasm build: the authoritative USLM
          # XML, the pre-projected rkyv archives the "Load (fast)" route needs,
          # and the OWL vocabularies. ALL THREE KINDS, which this step used to
          # get wrong: it copied only `*.xml`, so every one of the nine `.rprx`
          # archives and all six `.owl` files 404'd on the hosted demo — every
          # fast-load button dead — while a comment here claimed they "404
          # gracefully". Title 42 was the worst case: its XML is 113 MB and is
          # correctly excluded by the size guard, so with its 35 MB archive also
          # missing the single most important title in this corpus could not be
          # loaded on pr4xis.dev by any route at all.
          #
          # The 95M guard stays — GitHub Pages rejects files over 100 MB. It
          # excludes only Title 42's raw XML; every archive is well under it
          # (largest is Title 42's at 35 MB), so the fast route now covers
          # exactly the title the raw route cannot.
          find crates/wasm/sources \( -name '*.xml' -o -name '*.rprx' -o -name '*.owl' \) \
            -size -95M -exec cp {} pages/sources/ \;
          cp docs/presentations/index.html pages/decks/technical/index.html
          cp docs/praxis-logo-dark.jpg pages/praxis-logo-dark.jpg
          cp docs/praxis-logo-light.jpg pages/praxis-logo-light.jpg
          cp docs/praxis-logo-video-dark.mp4 pages/praxis-logo-video-dark.mp4
          cp docs/praxis-logo-video-light.mp4 pages/praxis-logo-video-light.mp4
          # EVERY STAGED SOURCE THE SIZE GUARD ADMITS MUST REACH THE SITE.
          #
          # The wasm build stages what the catalog offers, and the page draws a
          # Load button per row; a file staged but not assembled here is a
          # button that 404s, and the demo silently loses a capability it
          # claims to have. That is exactly what happened — nine `.rprx`
          # archives and six `.owl` vocabularies were staged and offered, none
          # was deployed, and nothing caught it because a missing file is
          # invisible until somebody clicks.
          #
          # The invariant is asserted over the STAGED TREE, not over the
          # generated manifests: `target/` accumulates build directories, and
          # a glob across them picks up stale manifests advertising routes
          # that no longer exist (confirmed — they name `.cprx` URLs the page
          # has never offered). Staged-vs-deployed cannot be fooled that way,
          # and it fails precisely on the mistake that caused this: someone
          # narrowing the copy pattern above.
          missing=0
          for f in crates/wasm/sources/* crates/wasm/ontologies/*; do
            [[ -f "$f" ]] || continue
            # Skip what the guard deliberately excludes: only Title 42's raw
            # XML, at 113 MB over the 100 MB Pages limit. Its 35 MB archive
            # ships, so the title is reachable by the fast route.
            [[ $(stat -c%s "$f") -ge 99614720 ]] && continue
            case "$f" in
              crates/wasm/ontologies/*) dest="pages/ontologies/$(basename "$f")" ;;
              *)                        dest="pages/sources/$(basename "$f")" ;;
            esac
            [[ -f "$dest" ]] || { echo "::error::staged but not deployed: $f — its Load button will 404"; missing=1; }
          done
          if [[ $missing -ne 0 ]]; then
            echo "::error::the engine offers sources the assembled site does not carry"
            exit 1
          fi
          echo "every staged source under the size guard is present in pages/"
      # GitHub Pages serves neither a default robots.txt nor a sitemap —
      # generated FROM the assembled `pages/` tree (not hand-listed) so it
      # can't drift stale the way README's hand-counted numbers did.
      # Excludes mdbook's own utility pages (404/print/toc, not real
      # content) and `docs/chat/` (mdbook's static passthrough of the
      # homepage source — a duplicate of `/`, not a page in its own right).
      - name: Generate robots.txt + sitemap.xml
        run: |
          site="https://pr4xis.dev"
          printf 'User-agent: *\nAllow: /\nSitemap: %s/sitemap.xml\n' "$site" > pages/robots.txt
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            find pages -name '*.html' \
              -not -path 'pages/docs/chat/*' \
              -not -name '404.html' \
              -not -name 'print.html' \
              -not -name 'toc.html' \
              | sort \
              | while read -r f; do
                  rel="${f#pages/}"
                  if [ "$rel" = "index.html" ]; then
                    loc="$site/"
                  elif [ "$(basename "$rel")" = "index.html" ]; then
                    loc="$site/${rel%index.html}"
                  else
                    loc="$site/$rel"
                  fi
                  echo "  <url><loc>${loc}</loc></url>"
                done
            echo '</urlset>'
          } > pages/sitemap.xml
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      # NOTE: the `.prx.gz` ontology artifacts are served from Pages
      # `/ontologies/` (emitted above into the pages tree), NOT attached to the
      # GitHub release. release-plz creates releases with `git_release_enable`,
      # which are IMMUTABLE — `gh release upload --clobber` against an immutable
      # release fails `HTTP 422: Cannot upload assets to an immutable release`,
      # which reddened every release run that touched pr4xis-domains
      # (v0.24.0 / 0.25.0 / .1 / .3 / .4). The release-asset copy was redundant
      # with the Pages copy, so it is dropped: Pages is the single artifact home.

  # release-plz replaces the old release-please + katyo/publish-crates
  # pair. Reads the current repo state, queries crates.io for each
  # published-crate's last released version, and either opens a Release
  # PR (via the `release-pr` command) or publishes + tags + creates a
  # GitHub release (via the `release` command).
  #
  # cargo-semver-checks runs per-package via `semver_check = true` in
  # release-plz.toml, so a misbumped version on a breaking change is
  # rejected at PR-create time.
  release-plz-release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint-docs, test, wasm, format, no-ignored-doctests]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.lint-docs.result == 'success' &&
      needs.test.result == 'success' &&
      needs.wasm.result == 'success' &&
      needs.format.result == 'success' &&
      needs.no-ignored-doctests.result == 'success'
    permissions:
      contents: write
      pull-requests: read
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      releases: ${{ steps.release-plz.outputs.releases }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5.130
        id: release-plz
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    name: Release-PR
    runs-on: ubuntu-latest
    # MUST run AFTER release-plz-release. That job publishes + creates the new
    # version tags; this one computes the NEXT bump from the latest tag. Run in
    # parallel (the old setup), the fast release-pr job finished before the slow
    # publish job created the new tag, so it diffed from the PREVIOUS tag,
    # re-listed the just-released commits, and opened a redundant `chore: release`
    # PR every cycle — a self-feeding loop (v0.25.2 → v0.25.3 → …). Sequencing
    # breaks it: by the time release-pr runs, the just-released version is tagged,
    # so there are no unreleased commits left to propose. The `if` also requires
    # Release to have SUCCEEDED — a failed publish leaves no new tag, which would
    # re-trigger the same loop, so skip release-pr in that case. (On an ordinary
    # feature merge Release succeeds as a no-op, so this never blocks the first PR.)
    needs: [lint-docs, test, wasm, format, no-ignored-doctests, release-plz-release]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.lint-docs.result == 'success' &&
      needs.test.result == 'success' &&
      needs.wasm.result == 'success' &&
      needs.format.result == 'success' &&
      needs.no-ignored-doctests.result == 'success' &&
      needs.release-plz-release.result == 'success'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5.130
        id: release-plz
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # release-plz has no hook/plugin for updating files outside Cargo.toml +
      # CHANGELOG.md (verified against its config reference — no `hook`,
      # `pre_release`, `post_release`, or `extra_files` key exists), so
      # CITATION.cff drifts from the real version unless kept in sync here.
      # Runs every time this job runs (not just on first PR creation) because
      # release-plz force-pushes its own branch fresh on each master push,
      # which would silently drop a CITATION.cff commit made on an earlier
      # run — re-applying it every time is what makes this idempotent.
      - name: Sync CITATION.cff into the Release PR
        if: steps.release-plz.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.release-plz.outputs.pr }}
        run: |
          set -euo pipefail
          branch=$(jq -r '.head_branch' <<<"$PR_JSON")
          version=$(jq -r '.releases[0].version' <<<"$PR_JSON")
          gh auth setup-git
          git fetch origin "$branch"
          git checkout "$branch"
          sed -i "s/^version: .*/version: ${version}/" CITATION.cff
          sed -i "s/^date-released: .*/date-released: \"$(date -u +%Y-%m-%d)\"/" CITATION.cff
          if ! git diff --quiet -- CITATION.cff; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CITATION.cff
            git commit -m "chore: sync CITATION.cff to ${version}"
            git push origin "HEAD:${branch}"
          fi
