name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # The escape hatch for the release gate on `pages` (see that job): a
  # docs/site change that is not a release can still publish, but only
  # because a human explicitly said so.
  #
  # `type: choice` with QUOTED "yes"/"no", deliberately. An unquoted yes/no is
  # a YAML 1.1 boolean, and a `type: boolean` input is a real Boolean in the
  # `inputs` context but a string in `github.event.inputs` — exactly the
  # string-vs-Boolean confusion the `== 'true'` note on `pages` exists to
  # avoid.
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Deploy the docs site from this run (no release required)"
        type: choice
        options: ["no", "yes"]
        default: "no"

concurrency:
  group: ci-${{ github.ref }}
  # PR / feature branches: a superseded push is pure waste — cancel it.
  # master: NEVER. It is the only ref that can publish crates or deploy Pages.
  #
  # `release-plz release` publishes AND tags AND creates a GitHub release per
  # package, in dependency order. Measured in run 30458522847: the release for
  # pr4xis-derive-v0.29.0 was created at 14:51:06Z and "published
  # pr4xis-derive 0.29.0" logged at 14:51:08Z. A cancel landing inside that
  # publish->tag seam leaves a crate published to an IMMUTABLE registry with no
  # tag, no GitHub release and no changelog entry. `publish-invariant` does not
  # catch it — that gate fires on a crate tagged AHEAD of the registry; this is
  # the opposite direction, and it is silent.
  #
  # Secondly, `actions/cache` declares `post-if: success()`, so every cache
  # this workflow writes is silently discarded whenever a follow-up push
  # cancels a master run — the same mechanism that made run 30420270297's
  # 182-minute wasm job save nothing at all.
  #
  # A job-level `cancel-in-progress: false` cannot substitute for this:
  # release-plz-pr already sets exactly that, and in run 30420270297 its
  # conclusion is `cancelled` regardless. A run-level cancel takes every job
  # with it.
  #
  # Master runs QUEUE instead (GitHub keeps at most one pending run per group),
  # so this cannot produce two concurrent `release-plz release` invocations.
  # Cost, accepted: back-to-back master merges serialise, worst case one extra
  # pipeline of latency, and a middle commit in a burst can be cancelled while
  # still pending — the next run covers the resulting tree. Free in runner
  # minutes on a public repo.
  #
  # REQUIRES the per-job `timeout-minutes` added in the preceding commit.
  # Without them nothing terminates a hung master run before GitHub's 6h cap —
  # a push used to do that job.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

# ── CI architecture ────────────────────────────────────────────────
# All Rust work here is `--release`; `[profile.dev]` does not appear in
# CI. Every host-target job uses the same `Swatinem/rust-cache@v2`
# shared-key ("release") so the DEPENDENCY graph compiles once across
# the workflow and every downstream job restores the same slice. The
# wasm-target jobs (`wasm-browser`, `pages`) share it too rather than
# using a separate pool: both run host-target Rust before any wasm work.
#
# That claim used to be false. `scripts/constitution-gate.sh` ran
# `cargo test --lib` with no `--release`, compiling four crates under
# [profile.dev] into a slice shared with nothing. It now reads the
# nextest archive instead and compiles nothing at all — see `test`.
#
# ── What the shared cache does and does NOT do ─────────────────────
# It caches DEPENDENCIES ONLY. `Swatinem/rust-cache` deliberately
# evicts workspace crates before saving (`cache-workspace-crates`
# defaults false), so `pr4xis*` rlibs are never in the slice. Measured
# on a warm restore: `cargo build --release --workspace --all-targets`
# still spends ~404 CPU-seconds over 41 dirty units — 100% workspace,
# 0% dependencies.
#
# So a "full match: true" restore is already optimal and there is no
# cache tuning left to find: the wall time is compiling OUR OWN code.
# Do not set `cache-workspace-crates: true` chasing it. Two reasons it
# cannot work: the save is suppressed on the ~88% of runs that
# full-match (so workspace rlibs would freeze at first-write and go
# fingerprint-invalid at the next commit), and more fundamentally
# cargo fingerprints path packages against source MTIMES — a fresh
# `actions/checkout` stamps every file newer than any restored
# artifact, so workspace units are dirty on arrival regardless.
#
# Job graph. Arrows are effective ordering; every gate is ALSO named
# explicitly in each downstream `if:`, which is not redundant — a job listed
# in `needs:` but absent from the `if:` conjuncts is NOT gated, because each
# `if:` opens with a status function that defeats the implicit success()
# check. Both edits, every time.
#
#   build ──┬─► lint-docs ─────┐
#           ├─► test ──────────┤   runs the archive + the constitution
#           │                      completeness gate over it; also the
#           │                      designated .prx-cache saver
#           ├─► corpus ────────┤   host-target heavy-corpus suite
#           ├─► wasm-browser ──┤   the ONLY wasm32 lane; ALSO the sole
#           │      ▲               producer of the site tree — it builds,
#           │      │               browser-tests, emits .prx.gz, runs the E2E,
#           │      │               then assembles and uploads the
#           │  caregiver-pdf       `github-pages` artifact from the exact
#           │                      bytes it just tested.
#   format ────────────────────┤
#   no-ignored-doctests ───────┤
#   demonstrator-gates ────────┴─► release-plz-release ─┬─► release-plz-pr
#                                                       └─► pages (deploy only)
#
#   publish-invariant   (standalone tripwire; no `needs:`, gates nothing)
#
# format / no-ignored-doctests / demonstrator-gates / caregiver-pdf /
# publish-invariant declare no `needs:` — none of them compiles anything — so
# all five start at t=0. caregiver-pdf is not INDEPENDENT, though: wasm-browser
# consumes its PDF artifact rather than installing pandoc/typst twice.
#
# `pages` deploys ONLY on a real release (releases_created == 'true') or an
# explicit workflow_dispatch. `release-plz-pr` MUST run after
# release-plz-release; see the anti-loop comment on that job.
#
# Coverage runs in its own workflow (.github/workflows/coverage.yml)
# — on `release: published` (filtered to the canonical `pr4xis-v*`
# tag) plus workflow_dispatch, NOT a nightly cron — because it uses a
# different cache slice (LLVM coverage instrumentation = different
# rustc fingerprints) and shouldn't block PR merges.
#
# Build job builds (all host target, all `RUSTFLAGS=-D warnings`):
#   - pr4xis-cli                       — uploaded as artifact for downstream
#   - workspace libs + bins (release)  — populates the `release` cache slice
#   - test binaries via `cargo         — uploaded as artifact, `test` runs
#     nextest archive`                   directly from it (no recompile)
#
# Downstream jobs share `shared-key: release-lto-off`, so they restore build's
# DEPENDENCY slice (see the caching note above — workspace crates are
# never in it). Of the three, only `test` is genuinely compile-free:
# it runs the prebuilt nextest archive. `lint-docs` recompiles the
# workspace under clippy/rustdoc, and `wasm-browser` recompiles the workspace
# crates it touches for BOTH targets — the slice holds zero wasm32
# artefacts, because `build` never installs the wasm32 target, so
# every `wasm-pack build` starts cold on the wasm32 side.
#
# Release pipeline (replaces the old release-please + katyo pair):
#   release-plz-pr      — opens / updates a Release PR with version
#                          bumps + per-crate CHANGELOG entries derived
#                          from conventional commits. Runs on every push
#                          to master, but ONLY AFTER release-plz-release
#                          has succeeded — running the two in parallel
#                          is what produced a self-feeding release loop
#                          (v0.25.2 -> .3 -> …). See that job's comment.
#   release-plz-release — on master, detects merged Release PRs (or
#                          any commit whose Cargo.toml version is ahead
#                          of crates.io) and publishes + tags + makes
#                          GitHub releases. cargo-semver-checks gates
#                          version-vs-API consistency per crate.
# ───────────────────────────────────────────────────────────────────

jobs:
  # Build pr4xis-cli once + fetch external data. Uploads the binary
  # as an artifact every downstream Rust job reuses; populates the
  # `release` Swatinem cache slice they all restore from.
  build:
    name: Build (host + test archive + data)
    runs-on: ubuntu-latest
    # Sized ~2.5x the observed max (9.5-29.1m across 20 non-hung runs — the
    # widest cold/warm swing in the workflow, since this job populates the
    # 492 MiB `release` slice). Every job here inherited GitHub's 6-HOUR
    # default until now: run 30420270297's wasm job sat at 182 minutes and
    # only stopped because a human pushed a new commit.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          submodules: recursive
      # BEFORE the output-cache lookup, because its `cachekey` output is the
      # exact rustc version and that MUST be in the key — identical sources
      # under a different rustc produce a different binary. The toolchain is
      # `@stable` with no rust-toolchain file in the repo, so the version
      # floats and this is the only thing that pins it.
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
        with:
          components: clippy, rustfmt
      # ── Output cache: the whole point of this job is two artifacts ─────────
      # `build` exists to produce `target/release/pr4xis` and the nextest
      # archive. Both are pure functions of the inputs hashed below, so when
      # those inputs are unchanged the outputs are byte-identical and there is
      # nothing to compute.
      #
      # This is the ONLY caching that helps here, and the reason is measured.
      # `Swatinem/rust-cache` caches DEPENDENCIES ONLY (it evicts workspace
      # crates before saving), so it reports "full match: true" and contributes
      # 0s: on a warm restore the workspace still costs 419 unit-seconds, of
      # which 237.8s is a single rustc call (pr4xis-domains lib test) and 64.4s
      # is pr4xis-wasm's build script EXECUTING. And cargo cannot be talked out
      # of that work, because it fingerprints path packages by MTIME and
      # `actions/checkout` stamps every file with the current time — verified
      # locally: `touch` a file with an identical sha256 and cargo recompiles
      # it. `cache-workspace-crates: true` therefore cannot work either;
      # restored artifacts would be invalidated on arrival.
      #
      # sccache was measured and rejected: on a rebuild with all 1465 tracked
      # files touched it achieved a 100% hit rate and saved 4% (245s -> 236s),
      # because the units it can cache are the cheap ones and build-script
      # execution is not a compiler call at all.
      #
      # STALENESS IS THE ONLY REAL RISK HERE. A key that misses an input serves
      # a stale binary and CI goes green WITHOUT TESTING THE CHANGE — strictly
      # worse than a slow build. So the key covers every input that can change
      # either artifact:
      #   crates/**             EVERY tracked file under crates/, not just
      #                         *.rs. This is deliberate and load-bearing: a
      #                         great deal of non-Rust content is embedded at
      #                         COMPILE time via include_bytes!/include_str!
      #                         — pr4xis-runtime/src/morphism_kinds.prx,
      #                         pr4xis-derive/src/relations_transitive_kinds.txt,
      #                         domains/data/adobe/glyphlist.prx, the USLM and
      #                         xml-infoset schema .prx, the statute_shape .txt
      #                         fixtures, and the caregiver/adversarial corpus
      #                         .json fixtures. Hashing only *.rs would let any
      #                         of those change while this key stayed the same,
      #                         i.e. exactly the stale-artifact false pass this
      #                         cache must never produce.
      #                         Deterministic despite the broad glob: it is
      #                         evaluated immediately after checkout, BEFORE the
      #                         WordNet and praxis-data caches restore fetched
      #                         data into crates/domains/data/, so only tracked
      #                         files exist at that moment.
      #   Cargo.toml, locks     dependency versions + feature resolution
      #                         (per-crate Cargo.toml is covered by crates/**)
      #   toolchain cachekey    the exact rustc
      #   .config/nextest.toml  archive metadata + profile
      #   praxis.lock           the FETCHED data (USC titles etc.) by content
      #                         pin — build.rs reads it and the archive embeds
      #                         2 build-script output directories, so the
      #                         fetched XML is genuinely an input to the archive
      #   .prx-cache/…          the committed defines overlays build.rs reads
      #   ci.yml                RUSTFLAGS and the build commands live here
      #
      # Including ci.yml means a CI-only change misses this cache. That is
      # correct, not a shortcoming: the workflow file is the specification of
      # the check, so a change to it must be executed at least once.
      # RESTORE-ONLY, with an explicit save at the END of this job. Not
      # `actions/cache@v5`, and the reason is an ordering trap: post steps run
      # in REVERSE order of their main steps, so a combined cache action placed
      # here would save AFTER `Swatinem/rust-cache`'s post step — and that step
      # `rmExcept`s workspace artifacts out of `target/` to keep its slice
      # deps-only. It would delete `target/release/pr4xis` and we would cache a
      # missing file. Restore here, save explicitly below, both as MAIN steps.
      - name: Restore build outputs (skip compiling if inputs are unchanged)
        id: build-out
        uses: actions/cache/restore@v5
        with:
          path: |
            target/release/pr4xis
            target/nextest-archive.tar.zst
          key: >-
            build-out-v1-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{
            hashFiles('crates/**', 'Cargo.toml', 'Cargo.lock', '.config/nextest.toml',
            'praxis.lock', '.prx-cache/usc-defines-compact/**',
            '.github/workflows/ci.yml') }}
      # Deliberately NO `restore-keys`. A partial-key hit would restore
      # artifacts built from DIFFERENT sources while reporting cache-hit=false,
      # and the steps below would then upload whichever files happened to be
      # on disk. Exact match or nothing.
      - name: Confirm restored outputs are complete
        if: steps.build-out.outputs.cache-hit == 'true'
        run: |
          # Fail closed: a truncated or partial restore must not be uploaded as
          # if it were a real build. Better to error than to hand downstream
          # jobs a half-written archive.
          for f in target/release/pr4xis target/nextest-archive.tar.zst; do
            [ -s "$f" ] || { echo "::error::cache reported a hit but $f is missing or empty"; exit 1; }
          done
          chmod +x target/release/pr4xis
          echo "restored $(du -sh target/nextest-archive.tar.zst | cut -f1) archive + cli — skipping the compile"
      - uses: Swatinem/rust-cache@v2
        if: steps.build-out.outputs.cache-hit != 'true'
        with:
          shared-key: release-lto-off
      - uses: taiki-e/install-action@cargo-nextest
        if: steps.build-out.outputs.cache-hit != 'true'
      - name: Cache WordNet XML
        uses: actions/cache@v5
        with:
          path: crates/domains/data/wordnet/english-wordnet-2025.xml
          key: wordnet-english-2025-v1
      # `crates/domains/data/ontologies/*.owl` is FETCHED, not tracked
      # (.gitignore:95 ignores *.owl here; only the six .prx.gz are committed),
      # and it was in NO cache block. crates/wasm/build.rs:387 `continue`s on a
      # missing .owl, so once the fetch is skipped on a cache hit, an uncached
      # .owl tree makes the raw-OWL staging silently disappear. Key bumped to
      # v2 because the pre-existing entry does not contain these files and
      # cache keys are immutable.
      - name: Cache fetched external data (USC titles + conformance suites)
        uses: actions/cache@v5
        with:
          path: |
            crates/domains/data/legal/uscode
            crates/domains/data/markup-schemas/xsts
            crates/domains/data/markup-schemas/xmlconf
            crates/domains/data/ontologies/*.owl
          key: praxis-data-v2-${{ hashFiles('praxis.lock') }}
      # Build pr4xis-cli + the full workspace + all test binaries in
      # one pass. Downstream `lint-docs` and `test` then run against the
      # populated `release` cache slice with no further compilation —
      # see `nextest archive` step below.
      #
      # Matching `-D warnings` is essential — without it, the cache
      # slice this job writes has different rustc fingerprints than the
      # slice `lint-docs` / `test` / `wasm-browser` expect, and they would
      # recompile from scratch on restore. Same flags everywhere keeps
      # `shared-key: release-lto-off` actually shared. The key carries `-lto-off`
      # because `[profile.release] lto = "off"` is in EVERY unit's fingerprint,
      # dependencies included, so the pre-LTO-off slice cannot be reused.
      # ~115s of this step's ~126s is PROVABLY THROWN AWAY, and it is still here
      # because the obvious fix does not work. Written down so the next attempt
      # starts from the measurement rather than the intuition.
      #
      # The waste: `-p pr4xis-cli` resolves pr4xis-domains with serde_json
      # `default+std`, while `--workspace --all-targets` resolves it with
      # `alloc+default+std` — `alloc` arrives only via `wasm-bindgen-test`, a
      # DEV-dependency of crates/wasm. One feature apart is a different rlib
      # fingerprint, so the archive step below rebuilds the domains rlib from
      # scratch regardless of what this step just built. (Verified compile-free
      # through `--unit-graph`.) It cannot be fixed by widening the selector
      # either: matching that feature set requires dev-dependencies, i.e.
      # `--all-targets`, which is the archive build itself.
      #
      # Why the step cannot simply be skipped on a data-cache hit: `pr4xis
      # update` IS the fetcher, the archive build needs its output (crates/wasm/
      # build.rs reads the fetched USC XML), and the fetch is NOT a no-op on a
      # warm cache. Measured on master run 30502233952: 75 sources report
      # `[fetched]` against 190 `[ok]`, because the data cache covers 5 paths
      # while praxis.lock registers ~20 fetchable trees (glyphlist, agid,
      # mods/xhtml/lmf/xsd schemas, the OWL vocabularies, …). Skip the fetch and
      # those 75 are simply absent — and build.rs:29/:387 are FAIL-OPEN, so the
      # result is silent degradation, not an error.
      #
      # The unblocking work, in order: cache every fetched tree praxis.lock
      # registers so `pr4xis update` becomes a genuine no-op, THEN gate this
      # step and the fetch on a data-cache hit. crates/cli/tests/cli_smoke.rs
      # already exists, so `cargo nextest archive` now carries
      # target/release/pr4xis (21 binaries / 3 non-test, up from 19 / 2) — that
      # half is done and the artifact upload no longer depends on this step.
      # KNOWN WASTE, deliberately still here — see the note below before trying
      # to delete it again.
      - name: Build pr4xis-cli (release)
        if: steps.build-out.outputs.cache-hit != 'true'
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build -p pr4xis-cli --release
      # UNCONDITIONAL, even on an output-cache hit. Two reasons: the fetch is
      # what warms the `praxis-data` key for every downstream job, and it must
      # happen BEFORE the archive build below, because pr4xis-wasm's build
      # script reads the fetched USC XML and the archive embeds its output. On
      # a hit this runs against the restored binary and is a no-op against a
      # warm data cache.
      #
      # It is also the designated warmer of that key: if `build` skipped it,
      # four downstream jobs would race to fetch and save the same immutable
      # key, which is the failure this workflow already hit once with
      # `.prx-cache`.
      - name: Fetch external data
        timeout-minutes: 20
        run: ./target/release/pr4xis update
      # `cargo nextest archive` compiles every workspace test binary
      # (and the workspace libs they depend on) into a single
      # self-contained tarball. The `test` job downloads this archive
      # and runs the tests directly without recompiling — eliminates
      # the largest single source of CI wall time.
      #
      # This is the expensive step the output cache exists to skip: 419
      # unit-seconds, 57% of it one rustc call for pr4xis-domains' lib test
      # binary.
      - name: Build nextest archive
        if: steps.build-out.outputs.cache-hit != 'true'
        timeout-minutes: 35
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo nextest archive --workspace --profile ci --release --archive-file target/nextest-archive.tar.zst
      # NOTE: the constitution completeness gate and the caregiver demonstrator
      # gates used to run HERE, costing 805s + ~15s at the head of the pipeline.
      # Neither produces anything a downstream job consumes — the gate's only
      # output is a shell exit code, and the node gates read committed files —
      # so both were pure gating that delayed lint-docs/test/wasm for work none
      # of them needed. The constitution gate now runs inside `test`, straight
      # off the archive built below; the node gates are `demonstrator-gates`.
      - uses: actions/upload-artifact@v7
        with:
          name: pr4xis-cli
          path: target/release/pr4xis
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: nextest-archive
          path: target/nextest-archive.tar.zst
          retention-days: 1
          # Already zstd-compressed; re-deflating it at the default level 6
          # spends CPU to no effect. (The pr4xis-cli upload above keeps the
          # default — that one is an uncompressed ELF and does benefit.)
          compression-level: 0
      # The save half of the restore above, as a MAIN step so it runs before
      # any post step can prune `target/` (see the restore's comment). It sits
      # after the uploads so a save failure cannot cost downstream jobs their
      # artifacts. Skipped on a hit: the key is already populated and cache
      # keys are immutable, so re-saving would just log a warning.
      - name: Save build outputs
        if: steps.build-out.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            target/release/pr4xis
            target/nextest-archive.tar.zst
          key: ${{ steps.build-out.outputs.cache-primary-key }}

  # All host-target lint + doc + doctest passes against the same warm
  # `target/release/` tree. One workspace compile, four cheap incremental
  # passes on top.
  lint-docs:
    name: Lint & Docs
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-lto-off
      - name: Cache WordNet XML
        uses: actions/cache@v5
        with:
          path: crates/domains/data/wordnet/english-wordnet-2025.xml
          key: wordnet-english-2025-v1
      # `crates/domains/data/ontologies/*.owl` is FETCHED, not tracked
      # (.gitignore:95 ignores *.owl here; only the six .prx.gz are committed),
      # and it was in NO cache block. crates/wasm/build.rs:387 `continue`s on a
      # missing .owl, so once the fetch is skipped on a cache hit, an uncached
      # .owl tree makes the raw-OWL staging silently disappear. Key bumped to
      # v2 because the pre-existing entry does not contain these files and
      # cache keys are immutable.
      - name: Cache fetched external data
        uses: actions/cache@v5
        with:
          path: |
            crates/domains/data/legal/uscode
            crates/domains/data/markup-schemas/xsts
            crates/domains/data/markup-schemas/xmlconf
            crates/domains/data/ontologies/*.owl
          key: praxis-data-v2-${{ hashFiles('praxis.lock') }}
      # peaceiris/actions-mdbook@v2's newest release tag still declares
      # `node20`, so it cannot be upgraded past the Node-20 deprecation —
      # only replaced. Pinned to 0.5.4, the version `mdbook-version: latest`
      # resolved to in run 30438018664, so this is version-neutral.
      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - uses: actions/download-artifact@v8
        with:
          name: pr4xis-cli
          path: target/release
      - name: Make pr4xis-cli executable
        run: chmod +x target/release/pr4xis
      - name: Materialise external data (no-op on data-cache hit)
        timeout-minutes: 20
        run: ./target/release/pr4xis update
      - name: Clippy (release)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo clippy --workspace --all-targets --release -- -D warnings
      - name: Docs (release)
        env:
          RUSTDOCFLAGS: "-D warnings -D rustdoc::broken_intra_doc_links -D rustdoc::invalid_html_tags"
        run: cargo doc --workspace --no-deps --release
      - name: Doc Tests (release)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --doc --workspace --release
      - name: mdBook Test
        run: mdbook test docs/

  # Regenerates the ACL Caregiver AI Challenge narrative PDFs and gates on
  # ACL's real 15-page narrative-body limit (Cover Page is capped
  # separately at 1 page and excluded from this count) — this exact class
  # of problem (a narrative silently drifting over the limit after an
  # edit) was caught by hand once already; this job is what should catch
  # it automatically next time. Independent of the Rust build (no cargo
  # dependency), so it runs on every push/PR rather than only master.
  caregiver-pdf:
    name: Caregiver PDF page limit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      # Ubuntu 24.04's apt pandoc is 3.1.3 -- the `typst` output writer this
      # pipeline depends on wasn't added until pandoc 3.1.9. Pin a version
      # confirmed to have it (matches the 3.7.0.2 tested locally via nix)
      # rather than take whatever apt happens to ship.
      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: "3.7.0.2"
      - name: Install Liberation fonts + poppler-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-liberation poppler-utils
      - name: Install typst
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/v0.15.0/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin typst-x86_64-unknown-linux-musl/typst
          typst --version
      - name: Build + page-limit check
        env:
          TYPST_FONT_PATHS: /usr/share/fonts/truetype/liberation
        run: |
          dir="docs/caregiver-challenge"
          pdfdir="$dir/pdf"
          mkdir -p "$pdfdir/build"
          over_limit=0
          for md in "$dir"/*.md; do
            name="$(basename "${md%.md}")"
            pandoc -f markdown+raw_tex --lua-filter="$pdfdir/pandoc-typst-fixups.lua" \
              "$md" --to typst -o "$pdfdir/build/$name.typ"
            cp "$pdfdir/build/$name.typ" "$pdfdir/build/fragment.typ"
            # /Title PDF metadata (a standard 508/PDF-UA checker item). The
            # SAME per-document titles devenv.nix's dev-caregiver-pdf passes;
            # without them every CI-built PDF got main.typ's generic fallback,
            # so the reproducible artifact and the submitted file disagreed on
            # the first property an accessibility checker reads.
            case "$name" in
              track1-phase1-narrative) doctitle="pr4xis Caregiver Answer Engine - ACL Caregiver AI Challenge Track 1 Phase 1 Narrative" ;;
              track2-phase1-narrative) doctitle="pr4xis HCBS/EVV Compliance Navigator - ACL Caregiver AI Challenge Track 2 Phase 1 Narrative" ;;
              track1-phase1-appendix) doctitle="pr4xis Caregiver Answer Engine - ACL Caregiver AI Challenge Track 1 Appendix" ;;
              track2-phase1-appendix) doctitle="pr4xis HCBS/EVV Compliance Navigator - ACL Caregiver AI Challenge Track 2 Appendix" ;;
              smart40-validation-log) doctitle="Smart 40 Validation Log - ACL Caregiver AI Challenge Phase 1 Data Output Logs" ;;
              *) doctitle="$name" ;;
            esac
            typst compile --pdf-standard ua-1 --input "build-date=$(date +%Y-%m-%d)" --input "doc-title=$doctitle" "$pdfdir/main.typ" "$pdfdir/build/$name.pdf"
            pages="$(pdfinfo "$pdfdir/build/$name.pdf" | awk '/^Pages:/{print $2}')"
            echo "$name: $pages total pages"
            if [[ "$name" == *-phase1-narrative ]]; then
              narrative_pages=$((pages - 1))
              if [[ $narrative_pages -gt 15 ]]; then
                echo "::error::$name narrative body is $narrative_pages pages, over ACL's 15-page limit (cover page excluded)"
                over_limit=1
              fi
            fi
            # ACL caps appendices at 10 pages. Ungated, one added sentence
            # silently breaks compliance -- and both appendices sit at exactly
            # 10 today, so the margin is zero.
            if [[ "$name" == *-phase1-appendix ]] && [[ $pages -gt 10 ]]; then
              echo "::error::$name is $pages pages, over ACL's 10-page appendix limit"
              over_limit=1
            fi
          done
          exit $over_limit
      - uses: actions/upload-artifact@v7
        with:
          name: caregiver-challenge-pdfs
          path: docs/caregiver-challenge/pdf/build/*.pdf

  # Runs the workspace test suite from the prebuilt nextest archive
  # that `build` uploads — no Rust compilation happens here. The
  # archive contains every test binary; this job just extracts and
  # executes. Saves ~10 minutes of compile time per CI run.
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [build]
    # Cannot flap on cache variance — this job compiles nothing; it extracts
    # and runs the archive `build` uploaded.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-nextest
      - name: Cache WordNet XML
        uses: actions/cache@v5
        with:
          path: crates/domains/data/wordnet/english-wordnet-2025.xml
          key: wordnet-english-2025-v1
      # `crates/domains/data/ontologies/*.owl` is FETCHED, not tracked
      # (.gitignore:95 ignores *.owl here; only the six .prx.gz are committed),
      # and it was in NO cache block. crates/wasm/build.rs:387 `continue`s on a
      # missing .owl, so once the fetch is skipped on a cache hit, an uncached
      # .owl tree makes the raw-OWL staging silently disappear. Key bumped to
      # v2 because the pre-existing entry does not contain these files and
      # cache keys are immutable.
      - name: Cache fetched external data
        uses: actions/cache@v5
        with:
          path: |
            crates/domains/data/legal/uscode
            crates/domains/data/markup-schemas/xsts
            crates/domains/data/markup-schemas/xmlconf
            crates/domains/data/ontologies/*.owl
          key: praxis-data-v2-${{ hashFiles('praxis.lock') }}
      - uses: actions/download-artifact@v8
        with:
          name: pr4xis-cli
          path: target/release
      - name: Make pr4xis-cli executable
        run: chmod +x target/release/pr4xis
      - name: Materialise external data (no-op on data-cache hit)
        timeout-minutes: 20
        run: ./target/release/pr4xis update
      # Parse-once: compile each registered USC title into its portable COMPACT
      # `.cprx.gz` ONCE, up front, so the corpus loader content-gates + deserialises
      # the archive (~ms total) instead of re-parsing ~250 MB of USLM XML in every
      # nextest process (process-per-test). `--compact` emits + verifies ONLY the
      # runtime fast-load cache `loaded()` reads (the only on-disk cache nextest
      # touches), and verifies the portable `[compact_archive_signatures]` pins for
      # all titles incl. the giants — it skips the heavy, toolchain-coupled rkyv
      # envelopes (the `decompile` artifacts, which no test reads). Cached on
      # praxis.lock so a warm run restores the archives and skips the emit entirely.
      # THIS JOB IS THE DESIGNATED SAVER of this key — the only one using the
      # read/write `actions/cache`. `corpus` deliberately uses the
      # restore-only sub-action, because both jobs `needs: [build]` and start
      # together: on a cold key they would both miss, both compile, and both
      # race to save, and cache keys are immutable so one save is always
      # refused. Measured in run 30438018664: the wasm job missed the key and
      # this job saved it 7 minutes later. If the saver ever moves, move the
      # read/write action with it.
      - name: Cache compiled .prx archives
        id: prx-cache
        uses: actions/cache@v5
        with:
          path: .prx-cache
          key: prx-cache-${{ hashFiles('praxis.lock') }}
      - name: Compile compact .prx archives (parse-once fast load)
        if: steps.prx-cache.outputs.cache-hit != 'true'
        run: ./target/release/pr4xis compile --compact
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: target/
      - name: Run nextest from archive
        run: cargo nextest run --archive-file target/nextest-archive.tar.zst --workspace-remap . --profile ci
      # Constitution COMPLETENESS gate: every real test declares a guarantee
      # (untagged=0) and every registered tag maps to a real test (phantom=0).
      # Inherently a TWO-PROCESS diff — libtest's inventory is only enumerable
      # from outside the binary (rust-lang#50297 keeps the in-process inventory
      # unstable) — so the shell gate IS the minimal machine-checkable form,
      # not a workaround. The in-process constitution_coverage meta-test
      # asserts only PARTITION coverage; without this, untagged tests pass CI
      # silently.
      #
      # Runs HERE, from the archive this job already downloaded, rather than in
      # its own job: everything it consumes is inside the tarball, so it costs
      # seconds instead of the 805s dev-profile compile of four crates it used
      # to spend at the head of the pipeline.
      #
      # It also ENFORCES MORE than it used to. Compiling from source resolved a
      # narrower feature union than `--workspace` does, so feature-gated code
      # was exempt from untagged=0 — all 59 tests of pr4xis's `codegen` module,
      # pr4xis-domains' fetch-gated tests, pr4xis-runtime's emit-gated tests.
      # Verified against this archive: pr4xis 437, pr4xis-runtime 116,
      # pr4xis-chat 113, pr4xis-domains 8037 — untagged=0 and phantom=0 on all
      # four, so widening the gate needed no backfill.
      - name: Constitution completeness gate (from the archive)
        timeout-minutes: 10
        run: |
          A=target/nextest-archive.tar.zst
          bash scripts/constitution-gate.sh pr4xis --enforce --archive "$A"
          bash scripts/constitution-gate.sh pr4xis-runtime --enforce --archive "$A"
          bash scripts/constitution-gate.sh pr4xis-chat --enforce --archive "$A"
          bash scripts/constitution-gate.sh pr4xis-domains --enforce --archive "$A"
      - name: Upload test results to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && !cancelled()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci/junit.xml
          report_type: test_results

  # Browser-side wasm coverage + Firefox WebDriver E2E. Sequenced after
  # `build` and restores the same `release` DEPENDENCY slice.
  #
  # It does NOT inherit compiled host binaries: rust-cache never saves
  # workspace crates (see the caching note in the header), so
  # `pr4xis-domains` for `emit_prx`, `pr4xis-web` for the E2E server and
  # `pr4xis-e2e` for the WebDriver client are all rebuilt here. Only
  # `pr4xis-cli` arrives prebuilt, as a downloaded artifact. The wasm32
  # side is cold every run — `build` installs no wasm32 target, so the
  # shared slice contains zero wasm32 artefacts.
  wasm-browser:
    name: WASM browser tests + E2E + site
    runs-on: ubuntu-latest
    # `caregiver-pdf` because the site tree embeds its PDF artifact. This
    # couples the release chain to that job: a red caregiver-pdf now defers a
    # publish rather than only skipping the deploy. That is deliberate — it
    # makes "released" imply "deployable". No wedge results: no tag is
    # created, so the next master push publishes the pending version.
    needs: [build, caregiver-pdf]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-lto-off
      - name: Cache WordNet XML
        uses: actions/cache@v5
        with:
          path: crates/domains/data/wordnet/english-wordnet-2025.xml
          key: wordnet-english-2025-v1
      # `crates/domains/data/ontologies/*.owl` is FETCHED, not tracked
      # (.gitignore:95 ignores *.owl here; only the six .prx.gz are committed),
      # and it was in NO cache block. crates/wasm/build.rs:387 `continue`s on a
      # missing .owl, so once the fetch is skipped on a cache hit, an uncached
      # .owl tree makes the raw-OWL staging silently disappear. Key bumped to
      # v2 because the pre-existing entry does not contain these files and
      # cache keys are immutable.
      - name: Cache fetched external data
        uses: actions/cache@v5
        with:
          path: |
            crates/domains/data/legal/uscode
            crates/domains/data/markup-schemas/xsts
            crates/domains/data/markup-schemas/xmlconf
            crates/domains/data/ontologies/*.owl
          key: praxis-data-v2-${{ hashFiles('praxis.lock') }}
      - uses: actions/download-artifact@v8
        with:
          name: pr4xis-cli
          path: target/release
      - name: Make pr4xis-cli executable
        run: chmod +x target/release/pr4xis
      - name: Materialise external data (no-op on data-cache hit)
        timeout-minutes: 20
        run: ./target/release/pr4xis update
      # NOTE: no `.prx-cache` steps here, deliberately. This lane needs only
      # `.prx-cache/usc-defines-compact/` — 9 files, all git-committed — which
      # `crates/wasm/build.rs:568` reads via
      # `load_usc_defines_overlay_from_disk`. It parses the USLM XML itself
      # and writes its own `.rprx` into `crates/wasm/sources`. The GENERATED
      # `usc-compact/` archives are read only by the heavy-corpus suite, which
      # now lives in the `corpus` job — so compiling them here was pure cost.
      # Was `curl … | sh`. GitHub's default shell is `bash -e {0}` — no
      # pipefail — so a failed curl fed an empty script to `sh`, which exits
      # 0: the step went GREEN having installed nothing, and the next step
      # died with a confusing `wasm-pack: command not found`. The installer
      # was also unpinned and re-resolved every run.
      #
      # Pinned, not `latest`: rust-cache restores `~/.cargo/bin` (cache-bin
      # defaults true) BEFORE this step, and install-action skips when a
      # satisfying binary is already present — so `latest` would make the
      # build depend on whatever binary the cache happens to hold. 0.13.1 is
      # what CI has actually been running (run 30438018664).
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - name: wasm-pack build (release, for E2E)
        timeout-minutes: 20
        run: |
          cd crates/wasm
          wasm-pack build --target web --release
      - name: wasm-bindgen tests (headless Firefox, release)
        timeout-minutes: 15
        run: |
          cd crates/wasm
          wasm-pack test --release --headless --firefox
      # NOTE: `wasm native acceptance tests` and `heavy-corpus tests` used to
      # run here. Both are pure HOST-target `cargo test` — nothing about them
      # needs the wasm32 lane — so they were serialising ~855s behind the
      # wasm-pack build for no reason. heavy-corpus is now the `corpus` job,
      # in parallel with this one.
      #
      # The native acceptance tests are gone entirely rather than relocated:
      # `crates/wasm` IS a workspace member (Cargo.toml:31, contradicting the
      # old "workspace-excluded" justification), so all 33 of them are already
      # in the `--workspace` nextest archive and already run in `test`. Verified
      # set-equal, not inferred — `cargo test --manifest-path crates/wasm` and
      # the archive list the same 33 names, so this step was running them twice.
      #
      # `emit_prx` STAYS here: crates/web serves `/ontologies/` from
      # crates/wasm/ontologies (crates/web/src/main.rs:85-99) and the E2E below
      # drives two OWL .prx.gz click-to-loads (crates/e2e/src/main.rs:165-171),
      # so this lane genuinely consumes it.
      - name: Emit .prx.gz ontology artifacts (for /ontologies/ click-to-load)
        timeout-minutes: 15
        # -D warnings to match the flags `build` compiled the workspace with.
        # Cargo's fingerprint includes rustflags, so an unflagged invocation
        # here rebuilds the whole third-party graph instead of reusing it.
        # STEP-level, never job- or workflow-level: Swatinem/rust-cache hashes
        # env vars whose names start with RUST into its cache key at job
        # setup, so a job-level RUSTFLAGS in a subset of jobs would
        # permanently fork the 492 MiB shared slice. Step-level is invisible
        # to it, which is exactly why every job still full-matches.
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          mkdir -p crates/wasm/ontologies
          cargo run -p pr4xis-domains --features "fetch codegen" --release --example emit_prx -- crates/wasm/ontologies
      - name: Run Rust WebDriver E2E
        timeout-minutes: 20
        # Same fingerprint alignment as the emit step above — this compiles
        # pr4xis-web on the host.
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo run -p pr4xis-web --release 3000 &
          WEB=$!
          geckodriver --port 4444 &
          GECKO=$!
          # Both readiness loops used to fall through silently: neither tested
          # whether it broke early or exhausted, so an absent service was
          # indistinguishable from a ready one. NOT a tightening — a server
          # arriving after the budget was never rescued anyway (`client.goto`
          # runs once and is never retried), so the run simply failed ~180s
          # later on the eager-residency wait with a neterror DOM dump. This
          # just attributes the failure where it happens.
          ready() { # $1=url  $2=tries  $3=label
            for _ in $(seq 1 "$2"); do
              curl -sf --max-time 5 "$1" >/dev/null && return 0
              sleep 1
            done
            echo "::error::$3 never became ready at $1 after $2s"
            return 1
          }
          ready http://localhost:3000/       90 "pr4xis-web"  || { kill "$WEB" "$GECKO" 2>/dev/null; exit 1; }
          ready http://localhost:4444/status 30 "geckodriver" || { kill "$WEB" "$GECKO" 2>/dev/null; exit 1; }
          set +e
          ( cd crates/e2e && cargo run --release )
          code=$?
          kill "$WEB" "$GECKO" 2>/dev/null || true
          exit "$code"
      - name: Build presentation
        timeout-minutes: 10
        run: npx @marp-team/marp-cli docs/presentations/overview.md --html -o docs/presentations/index.html
      # peaceiris/actions-mdbook@v2's newest release tag still declares
      # `node20`, so it cannot be upgraded past the Node-20 deprecation —
      # only replaced. Pinned to 0.5.4, the version `mdbook-version: latest`
      # resolved to in run 30438018664, so this is version-neutral.
      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      # `docs/SUMMARY.md` already has a full nav (Learn/Use/Understand/
      # Reference/Why/Research/Presentations/Papers) — `mdbook test docs/`
      # exercises it for doctested ```rust blocks, but nothing ever built
      # it to HTML and published it. Every page here becomes an
      # independently indexable, linkable URL under /docs/, instead of
      # only being reachable as raw markdown through the GitHub UI.
      - name: Build docs site (mdbook)
        run: mdbook build docs --dest-dir "$(pwd)/pages/docs"
      # Built by the caregiver-pdf job (this job's own `needs`), not
      # regenerated here — avoids installing pandoc/typst a second time.
      # `path:` lands under the assembled tree, so the PDFs ship with the site.
      - uses: actions/download-artifact@v8
        with:
          name: caregiver-challenge-pdfs
          path: pages/caregiver-challenge
      - name: Assemble pages
        run: |
          mkdir -p pages/pkg pages/decks/technical pages/sources pages/ontologies
          # MANDATORY. The `emit_prx` step above writes into
          # crates/wasm/ontologies (pr4xis-web serves it at /ontologies/ for
          # the E2E, and devenv.nix is paired with that path); the deleted
          # `pages` job used to re-emit the same artifacts straight into
          # pages/ontologies instead. Without this copy the staged-vs-deployed
          # loop below fails on all six .prx.gz.
          #
          # It also makes the ontologies half of that loop LIVE for the first
          # time: crates/wasm/ontologies/ is gitignored, so it did not exist in
          # the old `pages` job, the glob never resolved, and `[[ -f ]] ||
          # continue` silently skipped every ontology. The check has been half
          # dead since it was introduced.
          cp crates/wasm/ontologies/* pages/ontologies/
          cp docs/chat/index.html pages/index.html
          cp docs/worker.js pages/worker.js
          cp docs/caregiver-corpus-status.json pages/caregiver-corpus-status.json
          # One app: docs/chat/index.html carries the generic Chat + Engine
          # tabs and the ACL Caregiver AI Challenge tab (#caregiver,
          # #caregiver/tracks/1|2, #caregiver/ask|evidence|method), all on ONE
          # booted engine. dashboard.js is the caregiver tab's controller,
          # mounted by index.html with the shared engine.
          cp docs/chat/dashboard.js pages/dashboard.js
          cp docs/chat/chat-ui.js pages/chat-ui.js
          cp docs/chat/tokens.css pages/tokens.css
          cp docs/smart40_validation_log_dump.json pages/smart40_validation_log_dump.json
          # Bench data artifacts — copied only once their generator tests have
          # produced them (guarded so a not-yet-generated artifact is a
          # graceful on-page "not yet generated" state, not a CI failure).
          for f in caregiver-corpus-slim.json adversarial-corpus.json smart40-protocol.json; do
            [ -f "docs/$f" ] && cp "docs/$f" "pages/$f" || true
          done
          cp -r crates/wasm/pkg/* pages/pkg/
          # On-demand sources staged by the wasm build: the authoritative USLM
          # XML, the pre-projected rkyv archives the "Load (fast)" route needs,
          # and the OWL vocabularies. ALL THREE KINDS, which this step used to
          # get wrong: it copied only `*.xml`, so every one of the nine `.rprx`
          # archives and all six `.owl` files 404'd on the hosted demo — every
          # fast-load button dead — while a comment here claimed they "404
          # gracefully". Title 42 was the worst case: its XML is 113 MB and is
          # correctly excluded by the size guard, so with its 35 MB archive also
          # missing the single most important title in this corpus could not be
          # loaded on pr4xis.dev by any route at all.
          #
          # The 95M guard stays — GitHub Pages rejects files over 100 MB. It
          # excludes only Title 42's raw XML; every archive is well under it
          # (largest is Title 42's at 35 MB), so the fast route now covers
          # exactly the title the raw route cannot.
          find crates/wasm/sources \( -name '*.xml' -o -name '*.rprx' -o -name '*.owl' \) \
            -size -95M -exec cp {} pages/sources/ \;
          cp docs/presentations/index.html pages/decks/technical/index.html
          cp docs/praxis-logo-dark.jpg pages/praxis-logo-dark.jpg
          cp docs/praxis-logo-light.jpg pages/praxis-logo-light.jpg
          cp docs/praxis-logo-video-dark.mp4 pages/praxis-logo-video-dark.mp4
          cp docs/praxis-logo-video-light.mp4 pages/praxis-logo-video-light.mp4
          # EVERY STAGED SOURCE THE SIZE GUARD ADMITS MUST REACH THE SITE.
          #
          # The wasm build stages what the catalog offers, and the page draws a
          # Load button per row; a file staged but not assembled here is a
          # button that 404s, and the demo silently loses a capability it
          # claims to have. That is exactly what happened — nine `.rprx`
          # archives and six `.owl` vocabularies were staged and offered, none
          # was deployed, and nothing caught it because a missing file is
          # invisible until somebody clicks.
          #
          # The invariant is asserted over the STAGED TREE, not over the
          # generated manifests: `target/` accumulates build directories, and
          # a glob across them picks up stale manifests advertising routes
          # that no longer exist (confirmed — they name `.cprx` URLs the page
          # has never offered). Staged-vs-deployed cannot be fooled that way,
          # and it fails precisely on the mistake that caused this: someone
          # narrowing the copy pattern above.
          missing=0
          for f in crates/wasm/sources/* crates/wasm/ontologies/*; do
            [[ -f "$f" ]] || continue
            # Skip what the guard deliberately excludes: only Title 42's raw
            # XML, at 113 MB over the 100 MB Pages limit. Its 35 MB archive
            # ships, so the title is reachable by the fast route.
            [[ $(stat -c%s "$f") -ge 99614720 ]] && continue
            case "$f" in
              crates/wasm/ontologies/*) dest="pages/ontologies/$(basename "$f")" ;;
              *)                        dest="pages/sources/$(basename "$f")" ;;
            esac
            [[ -f "$dest" ]] || { echo "::error::staged but not deployed: $f — its Load button will 404"; missing=1; }
          done
          if [[ $missing -ne 0 ]]; then
            echo "::error::the engine offers sources the assembled site does not carry"
            exit 1
          fi
          echo "every staged source under the size guard is present in pages/"
      # GitHub Pages serves neither a default robots.txt nor a sitemap —
      # generated FROM the assembled `pages/` tree (not hand-listed) so it
      # can't drift stale the way README's hand-counted numbers did.
      # Excludes mdbook's own utility pages (404/print/toc, not real
      # content) and `docs/chat/` (mdbook's static passthrough of the
      # homepage source — a duplicate of `/`, not a page in its own right).
      - name: Generate robots.txt + sitemap.xml
        run: |
          site="https://pr4xis.dev"
          printf 'User-agent: *\nAllow: /\nSitemap: %s/sitemap.xml\n' "$site" > pages/robots.txt
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            find pages -name '*.html' \
              -not -path 'pages/docs/chat/*' \
              -not -name '404.html' \
              -not -name 'print.html' \
              -not -name 'toc.html' \
              | sort \
              | while read -r f; do
                  rel="${f#pages/}"
                  if [ "$rel" = "index.html" ]; then
                    loc="$site/"
                  elif [ "$(basename "$rel")" = "index.html" ]; then
                    loc="$site/${rel%index.html}"
                  else
                    loc="$site/$rel"
                  fi
                  echo "  <url><loc>${loc}</loc></url>"
                done
            echo '</urlset>'
          } > pages/sitemap.xml
      # Skipped on PRs: a fork PR gets a read-only token and the upload would
      # fail inside a job whose failure now blocks the release chain. The
      # Assemble step above still runs on PRs — which is the point, since the
      # staged-vs-deployed invariant it enforces has until now only ever been
      # checked AFTER merge.
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: pages

  # praxis-corpus-tests is workspace-excluded so the default nextest run never
  # re-parses the multi-hundred-MB USC titles per process-isolated test. It
  # runs under `cargo test` (one process → a LazyLock fixture parses each giant
  # once) on the host.
  #
  # local == CI is ENFORCED, not asserted: this runs the same script dev-ci
  # runs. It previously ran the crate unfiltered while claiming to mirror
  # dev-ci, which pulled in the two deliberately-red suites
  # (`caregiver_questions_generated`, 4,075 of 4,219 red by design, and
  # `chat_faithfully_realizes_the_loaded_corpus`).
  #
  # `praxis-corpus-tests` is workspace-EXCLUDED, so `--manifest-path` would
  # build it into `crates/praxis-corpus-tests/target/` by default — which
  # Swatinem/rust-cache does not cache (it takes `./target`, and its
  # `workspaces:` input is unset), so it recompiled the crate's whole release
  # dependency graph every run. CARGO_TARGET_DIR is what makes the "local ==
  # CI" claim true for the build as well as the test list. Sharing a target
  # dir is not feature unification — that follows workspace membership, which
  # is unchanged; differing feature sets simply carry differing fingerprints.
  #
  # Its own job (was a step in `wasm`): pure host-target work that was
  # serialising ~627s behind an unrelated wasm-pack build.
  corpus:
    name: Heavy corpus
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
          submodules: recursive
      # Host target only — no wasm32, this lane compiles nothing for the web.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-lto-off
      - name: Cache WordNet XML
        uses: actions/cache@v5
        with:
          path: crates/domains/data/wordnet/english-wordnet-2025.xml
          key: wordnet-english-2025-v1
      # `crates/domains/data/ontologies/*.owl` is FETCHED, not tracked
      # (.gitignore:95 ignores *.owl here; only the six .prx.gz are committed),
      # and it was in NO cache block. crates/wasm/build.rs:387 `continue`s on a
      # missing .owl, so once the fetch is skipped on a cache hit, an uncached
      # .owl tree makes the raw-OWL staging silently disappear. Key bumped to
      # v2 because the pre-existing entry does not contain these files and
      # cache keys are immutable.
      - name: Cache fetched external data
        uses: actions/cache@v5
        with:
          path: |
            crates/domains/data/legal/uscode
            crates/domains/data/markup-schemas/xsts
            crates/domains/data/markup-schemas/xmlconf
            crates/domains/data/ontologies/*.owl
          key: praxis-data-v2-${{ hashFiles('praxis.lock') }}
      - uses: actions/download-artifact@v8
        with:
          name: pr4xis-cli
          path: target/release
      - name: Make pr4xis-cli executable
        run: chmod +x target/release/pr4xis
      - name: Materialise external data (no-op on data-cache hit)
        timeout-minutes: 20
        run: ./target/release/pr4xis update
      # RESTORE-ONLY, and that is the whole point. `test` is the DESIGNATED
      # SAVER of this key. Both jobs `needs: [build]`, so they start together:
      # when the key is cold they would both miss, both do the work, and both
      # try to save — and cache keys are immutable, so the loser's save is
      # refused. `actions/cache/restore` has no post step, so it cannot
      # contend, while still emitting `cache-hit`.
      #
      # No `restore-keys` fallback, deliberately: a restore-key hit still sets
      # `cache-hit == 'false'`, so the compile below would run anyway over a
      # directory seeded with STALE archives — fail-open, where this design is
      # fail-closed. The key is already correct: praxis.lock carries
      # [compact_archive_signatures], so any change to the emitted bytes must
      # re-pin the lock, which rotates the key.
      - name: Restore compiled .prx archives
        id: prx-cache
        uses: actions/cache/restore@v5
        with:
          path: .prx-cache
          key: prx-cache-${{ hashFiles('praxis.lock') }}
      # Kept even though `test` normally populates the key: on the happy path
      # this is skipped at 0s, and without it any non-fatal cache-save failure
      # would drop this job into per-process re-parsing of ~250 MB of USLM XML.
      - name: Compile compact .prx archives (parse-once fast load)
        if: steps.prx-cache.outputs.cache-hit != 'true'
        run: ./target/release/pr4xis compile --compact
      # NO job-level RUSTFLAGS: scripts/heavy-corpus-tests.sh sets
      # `RUSTFLAGS="-D warnings"` itself (lines 88, 99), and a job-level value
      # would be hashed into the rust-cache key, forking the shared slice.
      #
      # THE hang site: this ran 2h52m in run 30420270297 and stopped only
      # because a push cancelled the run. Observed 5.6 -> 11.2m and TRENDING
      # UP as the corpus grows — the one cap here with a shrinking margin.
      - name: heavy-corpus tests (release)
        timeout-minutes: 25
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: bash scripts/heavy-corpus-tests.sh

  # The caregiver demonstrator is the artifact a judge actually opens, and no
  # Rust test can see an HTML id or a hash route. These gates are the
  # mechanical form of two failures that really happened: a blank page from a
  # binding to an element that had been removed, and figures on the page
  # drifting from the corpus they claim to be computed from.
  #
  # No `needs:` — all three scripts read only committed files (index.html,
  # dashboard.js, chat-ui.js, crates/wasm/build.rs, docs/*.json), so this
  # cannot depend on `build` and now starts at t=0 instead of after it.
  demonstrator-gates:
    name: Caregiver demonstrator gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Caregiver demonstrator gates (DOM contract + program ladder)
        run: |
          node docs/chat/dom-contract.test.mjs
          node docs/chat/program-ladder.test.mjs
          node docs/chat/abstain-load-gate.test.mjs

  # Cheap parallel checks that don't need a Rust compile.
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  no-ignored-doctests:
    name: No ignored doctests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Forbid ```ignore in code/docs
        run: |
          if command grep -rn '```ignore' crates/ docs/ --include='*.rs' --include='*.md' ; then
            echo "::error::\`\`\`ignore is forbidden — every doctest must be machine-verified. Use \`\`\`text for pseudo-syntax illustrations, \`\`\`no_run / \`\`\`compile_fail when appropriate. See memory:feedback_no_unvalidated_doc_code."
            exit 1
          fi

  # ── The release invariant — fail fast at PR time, never wedge master ──────
  # release-plz computes each crate's next version from its crates.io baseline.
  # Its tag-vs-registry safety check ABORTS the Release-PR for the ENTIRE
  # workspace if any crate it would publish has a git release tag but is absent
  # from crates.io (HTTP 404):
  #     "package X not found in the registry, but the git tag X-vN exists.
  #      Consider running cargo publish manually to publish this package."
  # That forbidden state — `publish=true` + tagged + 404 — has wedged master
  # repeatedly (it is exactly what `release=true` tag-without-publish for
  # pr4xis-domains set up, then #219's gate removal exposed). The invariant:
  # every workspace member is EITHER published to crates.io (a registry row at
  # >= its highest tag) OR marked `publish = false` in release-plz.toml (which
  # release-plz exempts from the check). This job enforces it at PR time so the
  # forbidden state can never reach master.
  publish-invariant:
    name: Publish invariant
    runs-on: ubuntu-latest
    # Normally ~20s, but the retry budget below is the real bound: 4 attempts
    # x --max-time 30 + backoff (3+6+9+12) = 150s per crate, x5 probed crates
    # = ~750s worst case. 20, not 15, so a genuine crates.io outage reaches
    # the fail-closed path instead of being killed by the job timeout.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags, to compare against the registry
      - name: No publish=true crate may be tagged ahead of its crates.io version
        run: |
          set -uo pipefail
          # crates.io's API REQUIRES a User-Agent (it 403s without one), so every
          # query carries this identifying header.
          UA="pr4xis-ci-publish-invariant (https://github.com/i-am-logger/pr4xis)"
          # Crates release-plz.toml marks publish = false (apps / examples) are
          # EXEMPT — release-plz never publishes them, so a tag without a
          # registry entry is harmless for them.
          exempt=$(awk '
            /^\[\[package\]\]/ { name = "" }
            match($0, /^name[[:space:]]*=[[:space:]]*"([^"]+)"/, a) { name = a[1] }
            /^publish[[:space:]]*=[[:space:]]*false/ { if (name) print name }
          ' release-plz.toml | sort -u)

          # crates.io max_version for a crate, resilient to transient API errors.
          # Echoes the version (200), "404" (definitively absent), or "ERROR"
          # (no definitive answer after retries → the caller FAILS CLOSED rather
          # than treat a crates.io outage / 5xx / timeout as a pass).
          #
          # The retry loop is only fail-closed if each ATTEMPT terminates:
          # unbounded, a stalled socket never reaches the ERROR path at all,
          # and a connect blackhole falls back to curl's 300s default (~20 min
          # per crate). Semantics are unchanged by the bounds — a timed-out
          # curl exits non-zero while %{http_code} emits 000, `|| echo 000`
          # guarantees a non-200/404 value, the `*)` branch retries, and four
          # exhausted attempts still yield ERROR -> fail closed.
          registry_version() {
            local crate=$1 i code
            for i in 1 2 3 4; do
              code=$(curl -s -A "$UA" --connect-timeout 10 --max-time 30 \
                -o /tmp/ci_crate.json -w '%{http_code}' \
                "https://crates.io/api/v1/crates/${crate}" 2>/dev/null || echo 000)
              case "$code" in
                200) jq -r '.crate.max_version' /tmp/ci_crate.json; return 0 ;;
                404) echo "404"; return 0 ;;
                *)   sleep $((i * 3)) ;;  # 000/5xx/timeout — retry with backoff
              esac
            done
            echo "ERROR"
          }

          fail=0
          # Walk every workspace member dir → its package name.
          for dir in $(awk '/members[[:space:]]*=[[:space:]]*\[/{f=1;next} /\]/{f=0} f{gsub(/[",[:space:]]/,"");if($0!="")print}' Cargo.toml); do
            name=$(awk -F'"' '/^name[[:space:]]*=/{print $2; exit}' "$dir/Cargo.toml")
            [ -z "$name" ] && continue
            # Exempt (publish=false in release-plz.toml) → skip.
            if printf '%s\n' "$exempt" | grep -qx "$name"; then continue; fi
            # A member's own Cargo.toml publish=false → also exempt.
            if awk '/^\[package\]/{p=1} p&&/^publish[[:space:]]*=[[:space:]]*false/{found=1} END{exit !found}' "$dir/Cargo.toml"; then continue; fi
            # Highest release tag for this crate, if any (nothing tagged → nothing
            # release-plz will diff against; not yet the forbidden state).
            tag=$(git tag --list "${name}-v*" | sort -V | tail -1)
            [ -z "$tag" ] && continue
            tagver=${tag#"${name}-v"}
            rv=$(registry_version "$name")
            if [ "$rv" = "404" ]; then
              echo "::error::Publish invariant: '${name}' is tagged (${tag}) but absent from crates.io (404). release-plz will ABORT the Release-PR for the whole workspace. Fix: publish it once (\`cargo publish -p ${name}\`) before it is tagged, OR mark it \`publish = false\` in release-plz.toml."
              fail=1
            elif [ "$rv" = "ERROR" ]; then
              echo "::error::Publish invariant: could not verify crates.io for '${name}' after retries (transient API error). Failing closed — re-run the job; if crates.io is genuinely down, retry when it recovers."
              fail=1
            else
              # The full invariant: crates.io max_version must be >= the highest
              # tag. A registry BEHIND its tag is the same release-plz baseline
              # inconsistency as a 404.
              lower=$(printf '%s\n%s\n' "$rv" "$tagver" | sort -V | head -1)
              if [ "$lower" = "$rv" ] && [ "$rv" != "$tagver" ]; then
                echo "::error::Publish invariant: '${name}' crates.io max version (${rv}) is BEHIND its highest tag (${tagver}). release-plz's next-version baseline is inconsistent. Publish ${name} ${tagver} (or higher) to crates.io."
                fail=1
              fi
            fi
          done
          exit $fail


  # Deploy the docs site (chatbot / decks / the `.prx.gz` ontologies under
  # /ontologies/) ONLY when release-plz actually cut a version — or on an
  # explicit `workflow_dispatch` with `deploy_pages: yes`.
  #
  # DEPLOY-ONLY. This job builds nothing: `wasm-browser` assembles and uploads
  # the `github-pages` artifact, and `deploy-pages` picks it up from anywhere
  # in the same run (the standard two-job Pages pattern). It used to rebuild
  # the wasm (260s) and re-emit the .prx.gz (129s) that `wasm-browser` had
  # already built AND TESTED — so the bytes actually deployed were a second,
  # never-tested rebuild. Now the deployed tree is the tested tree.
  #
  # This restores the release gate that was removed when `pages` was decoupled
  # to deploy on every green master push. The cost that decoupling was trying
  # to avoid is real and is re-accepted here deliberately: a master push that
  # cuts no release no longer refreshes pr4xis.dev, so edits to
  # docs/chat/index.html, dashboard.js, the deck and the mdbook reach the site
  # at the next version — or immediately via the dispatch hatch above.
  #
  # `release_always = false` in release-plz.toml means the `release` command
  # publishes only on the merge commit of a release PR, so
  # `releases_created == 'true'` fires exactly on "a new version genuinely
  # shipped" and never on "master moved".
  #
  # `== 'true'` (string), NOT `== true`: $GITHUB_OUTPUT values are always
  # strings, and GitHub's `==` casts across types to Number — Boolean true is
  # 1, the string 'true' is NaN, and NaN matches nothing, so `== true` would
  # be permanently false and the site would never deploy again.
  #
  # The five quality gates are listed explicitly rather than inherited through
  # release-plz-release. They are NOT redundant: on a workflow_dispatch run
  # release-plz-release skips (its own `if` requires a push), so relying on it
  # transitively would let the manual path deploy over a red lint-docs.
  # Fail-closed: a skipped/failed release job leaves the output as '', and
  # '' == 'true' is false.
  pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs:
      [
        lint-docs,
        test,
        wasm-browser,
        corpus,
        format,
        no-ignored-doctests,
        demonstrator-gates,
        caregiver-pdf,
        release-plz-release,
      ]
    timeout-minutes: 30
    # `!cancelled()`, not `always()` and not an implicit `success()`. With no
    # status function GitHub applies implicit `success()`, which would skip
    # this job whenever release-plz-release SKIPS — killing the dispatch path.
    # `always()` would instead deploy from a run cancelled mid-flight, i.e.
    # publish a superseded tree.
    if: |
      !cancelled() &&
      github.ref == 'refs/heads/master' &&
      needs.lint-docs.result == 'success' &&
      needs.test.result == 'success' &&
      needs.wasm-browser.result == 'success' &&
      needs.corpus.result == 'success' &&
      needs.format.result == 'success' &&
      needs.no-ignored-doctests.result == 'success' &&
      needs.demonstrator-gates.result == 'success' &&
      needs.caregiver-pdf.result == 'success' &&
      (
        (github.event_name == 'push' &&
         needs.release-plz-release.result == 'success' &&
         needs.release-plz-release.outputs.releases_created == 'true')
        ||
        (github.event_name == 'workflow_dispatch' &&
         inputs.deploy_pages == 'yes')
      )
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      # NOTE: the `.prx.gz` ontology artifacts are served from Pages
      # `/ontologies/` (assembled by wasm-browser), NOT attached to the
      # GitHub release. release-plz creates releases with `git_release_enable`,
      # which are IMMUTABLE — `gh release upload --clobber` against an immutable
      # release fails `HTTP 422: Cannot upload assets to an immutable release`,
      # which reddened every release run that touched pr4xis-domains
      # (v0.24.0 / 0.25.0 / .1 / .3 / .4). The release-asset copy was redundant
      # with the Pages copy, so it is dropped: Pages is the single artifact home.

  # release-plz replaces the old release-please + katyo/publish-crates
  # pair. Reads the current repo state, queries crates.io for each
  # published-crate's last released version, and either opens a Release
  # PR (via the `release-pr` command) or publishes + tags + creates a
  # GitHub release (via the `release` command).
  #
  # cargo-semver-checks runs per-package via `semver_check = true` in
  # release-plz.toml, so a misbumped version on a breaking change is
  # rejected at PR-create time.
  release-plz-release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      [
        lint-docs,
        test,
        wasm-browser,
        corpus,
        format,
        no-ignored-doctests,
        demonstrator-gates,
      ]
    timeout-minutes: 30
    # `!cancelled()`, not `always()` — see the `pages` job. It matters most
    # here: this job publishes to an IMMUTABLE registry, so running it from a
    # cancelled workflow is the one case that cannot be undone.
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.lint-docs.result == 'success' &&
      needs.test.result == 'success' &&
      needs.wasm-browser.result == 'success' &&
      needs.corpus.result == 'success' &&
      needs.format.result == 'success' &&
      needs.no-ignored-doctests.result == 'success' &&
      needs.demonstrator-gates.result == 'success'
    permissions:
      contents: write
      pull-requests: read
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      releases: ${{ steps.release-plz.outputs.releases }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5.130
        id: release-plz
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    name: Release-PR
    runs-on: ubuntu-latest
    # MUST run AFTER release-plz-release. That job publishes + creates the new
    # version tags; this one computes the NEXT bump from the latest tag. Run in
    # parallel (the old setup), the fast release-pr job finished before the slow
    # publish job created the new tag, so it diffed from the PREVIOUS tag,
    # re-listed the just-released commits, and opened a redundant `chore: release`
    # PR every cycle — a self-feeding loop (v0.25.2 → v0.25.3 → …). Sequencing
    # breaks it: by the time release-pr runs, the just-released version is tagged,
    # so there are no unreleased commits left to propose. The `if` also requires
    # Release to have SUCCEEDED — a failed publish leaves no new tag, which would
    # re-trigger the same loop, so skip release-pr in that case. (On an ordinary
    # feature merge Release succeeds as a no-op, so this never blocks the first PR.)
    needs:
      [
        lint-docs,
        test,
        wasm-browser,
        corpus,
        format,
        no-ignored-doctests,
        demonstrator-gates,
        release-plz-release,
      ]
    timeout-minutes: 20
    # `!cancelled()`, not `always()` — see the `pages` job.
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.lint-docs.result == 'success' &&
      needs.test.result == 'success' &&
      needs.wasm-browser.result == 'success' &&
      needs.corpus.result == 'success' &&
      needs.format.result == 'success' &&
      needs.no-ignored-doctests.result == 'success' &&
      needs.demonstrator-gates.result == 'success' &&
      needs.release-plz-release.result == 'success'
    permissions:
      contents: write
      pull-requests: write
    # Serialises concurrent release-pr jobs against each other within this
    # group. It does NOT — and never did — shield the job from a run-level
    # cancel: in run 30420270297 this job's conclusion is `cancelled` despite
    # the setting below, because cancelling a workflow takes every job with
    # it. The workflow-level `concurrency:` block at the top of this file is
    # what actually protects master.
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5.130
        id: release-plz
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # release-plz has no hook/plugin for updating files outside Cargo.toml +
      # CHANGELOG.md (verified against its config reference — no `hook`,
      # `pre_release`, `post_release`, or `extra_files` key exists), so
      # CITATION.cff drifts from the real version unless kept in sync here.
      # Runs every time this job runs (not just on first PR creation) because
      # release-plz force-pushes its own branch fresh on each master push,
      # which would silently drop a CITATION.cff commit made on an earlier
      # run — re-applying it every time is what makes this idempotent.
      - name: Sync CITATION.cff into the Release PR
        if: steps.release-plz.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.release-plz.outputs.pr }}
        run: |
          set -euo pipefail
          # release-plz emits `{}` — NOT an empty string — when it opened no
          # Release PR, so the `if:` above does not catch that case ('{}' != ''
          # is true) and this step used to run with a null branch:
          #     fatal: couldn't find remote ref null
          # That is a legitimate, expected outcome, not an error. It happens
          # whenever a master push leaves nothing to propose — a push that
          # touches only CI, scripts, docs or a `publish = false` crate, or one
          # where every Cargo.toml version is already ahead of crates.io.
          # The real guard has to be here, where the payload can be inspected.
          branch=$(jq -r '.head_branch // empty' <<<"$PR_JSON")
          version=$(jq -r '.releases[0].version // empty' <<<"$PR_JSON")
          if [ -z "$branch" ] || [ -z "$version" ]; then
            echo "release-plz opened no Release PR this run — nothing to sync."
            exit 0
          fi
          gh auth setup-git
          git fetch origin "$branch"
          git checkout "$branch"
          sed -i "s/^version: .*/version: ${version}/" CITATION.cff
          sed -i "s/^date-released: .*/date-released: \"$(date -u +%Y-%m-%d)\"/" CITATION.cff
          if ! git diff --quiet -- CITATION.cff; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CITATION.cff
            git commit -m "chore: sync CITATION.cff to ${version}"
            git push origin "HEAD:${branch}"
          fi
