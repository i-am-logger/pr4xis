name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            command: cargo fmt --check
          - name: Clippy
            command: cargo clippy -- -D warnings
          - name: Test
            command: cargo test --workspace
            rustflags: "-D warnings"
          - name: Coverage
            command: cargo llvm-cov --workspace --lcov --output-path lcov.info
            master-only: true
          - name: Test Results
            command: cargo nextest run --workspace --profile ci
            master-only: true
          - name: WASM
            command: cargo check --manifest-path crates/wasm/Cargo.toml --target wasm32-unknown-unknown
            wasm-target: true
            needs-wordnet: true
          - name: Docs
            command: cargo doc --workspace --no-deps
            rustdocflags: "-D warnings -D rustdoc::broken_intra_doc_links -D rustdoc::invalid_html_tags"
            needs-wordnet: true
          - name: Doc Tests
            command: cargo test --doc --workspace
            needs-wordnet: true
          - name: No ignored doctests
            command: |
              if command grep -rn '```ignore' crates/ docs/ --include='*.rs' --include='*.md' ; then
                echo "::error::\`\`\`ignore is forbidden — every doctest must be machine-verified. Use \`\`\`text for pseudo-syntax illustrations, \`\`\`no_run / \`\`\`compile_fail when appropriate. See memory:feedback_no_unvalidated_doc_code."
                exit 1
              fi
          - name: mdBook Test
            command: mdbook test docs/
            needs-wordnet: true
            needs-mdbook: true
    steps:
      - uses: actions/checkout@v4
        if: "!matrix.master-only || (github.event_name == 'push' && github.ref == 'refs/heads/master')"
        with:
          lfs: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        if: "!matrix.master-only || (github.event_name == 'push' && github.ref == 'refs/heads/master')"
        with:
          components: clippy, rustfmt, llvm-tools-preview
          targets: ${{ matrix.wasm-target && 'wasm32-unknown-unknown' || '' }}
      - uses: Swatinem/rust-cache@v2
        if: "!matrix.master-only || (github.event_name == 'push' && github.ref == 'refs/heads/master')"
      - uses: taiki-e/install-action@cargo-llvm-cov
        if: matrix.name == 'Coverage' && github.event_name == 'push' && github.ref == 'refs/heads/master'
      - uses: taiki-e/install-action@cargo-nextest
        if: matrix.name == 'Test Results' && github.event_name == 'push' && github.ref == 'refs/heads/master'
      - name: Install mdBook
        if: matrix.needs-mdbook
        run: cargo install mdbook --locked
      - name: Cache WordNet XML
        if: "(matrix.name == 'Test' || matrix.name == 'Coverage' || matrix.name == 'Test Results' || matrix.needs-wordnet) && (!matrix.master-only || (github.event_name == 'push' && github.ref == 'refs/heads/master'))"
        uses: actions/cache@v4
        with:
          path: crates/domains/data/wordnet/english-wordnet-2025.xml
          key: wordnet-english-2025-v1
      - name: Fetch external data via pr4xis update
        if: "(matrix.name == 'Test' || matrix.name == 'Coverage' || matrix.name == 'Test Results' || matrix.needs-wordnet) && (!matrix.master-only || (github.event_name == 'push' && github.ref == 'refs/heads/master'))"
        run: cargo run -p pr4xis-cli --release -- update
      - name: Run ${{ matrix.name }}
        if: "!matrix.master-only || (github.event_name == 'push' && github.ref == 'refs/heads/master')"
        run: ${{ matrix.command }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags || '' }}
          RUSTDOCFLAGS: ${{ matrix.rustdocflags || '' }}
      - name: Upload coverage to Codecov
        if: matrix.name == 'Coverage' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: matrix.name == 'Test Results' && github.event_name == 'push' && github.ref == 'refs/heads/master' && !cancelled()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci/junit.xml
          report_type: test_results

  pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Cache WordNet XML
        uses: actions/cache@v4
        with:
          path: crates/domains/data/wordnet/english-wordnet-2025.xml
          key: wordnet-english-2025-v1
      - name: Fetch WordNet (needed by wasm build.rs codegen step)
        run: cargo run -p pr4xis-cli --release --quiet -- update
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM
        run: |
          cd crates/wasm
          wasm-pack build --target web --release
      - name: Build presentation
        run: npx @marp-team/marp-cli docs/presentations/overview.md --html -o docs/presentations/index.html
      - name: Assemble pages
        run: |
          mkdir -p pages/pkg pages/decks/technical
          cp docs/chat/index.html pages/index.html
          cp -r crates/wasm/pkg/* pages/pkg/
          cp docs/presentations/index.html pages/decks/technical/index.html
          cp docs/praxis-logo-dark.jpg pages/praxis-logo-dark.jpg
          cp docs/praxis-logo-light.jpg pages/praxis-logo-light.jpg
          cp docs/praxis-logo-video-dark.mp4 pages/praxis-logo-video-dark.mp4
          cp docs/praxis-logo-video-light.mp4 pages/praxis-logo-video-light.mp4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release-please:
    name: Release
    runs-on: ubuntu-latest
    needs: [check]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.check.result == 'success'
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          ignore-unpublished-changes: true
          publish-delay: 10000
