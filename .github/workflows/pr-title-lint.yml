name: PR Title Lint

# Every PR title must declare its release intent via a Conventional
# Commits prefix that release-please will act on. Allowed prefixes:
#
#   fix:    — patches a defect (incl. doc bugs and stale comments)
#   feat:   — adds new functionality (non-breaking)
#   feat!:  — adds new functionality with a breaking API change
#
# All other prefixes (docs:, refactor:, chore:, test:, ci:, build:,
# perf:, style:) are deliberately rejected from PR titles. They may
# appear on individual in-branch commits within a PR, but the PR's
# squash-merge title — which becomes the canonical commit on master
# and which release-please reads to compute the version bump — must
# be `fix:` / `feat:` / `feat!:`.
#
# Rationale: every merged PR cuts a release. The bump category is the
# squash-merge prefix. Allowing `docs:` / `refactor:` / `chore:` to
# pass through silently de-couples version from state — readers
# pinning v0.x.y would see docs / behavior that drifted later. See
# `feedback_fix_for_release_worthy` in the project memory.

on:
  pull_request:
    types: [opened, edited, synchronize]
    branches: [master]

permissions:
  pull-requests: read

jobs:
  lint-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title prefix
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          echo "PR title: $PR_TITLE"
          if [[ ! "$PR_TITLE" =~ ^(fix|feat|feat!)(\([^)]+\))?:\  ]]; then
            echo "::error::PR title must start with 'fix:', 'feat:', or 'feat!:' (optionally with scope, e.g. 'fix(deps): …')."
            echo "::error::Got: $PR_TITLE"
            echo "::error::See memory/feedback_fix_for_release_worthy for rationale."
            exit 1
          fi
          echo "PR title prefix is valid."
