[workspace]
resolver = "3"
members = [
    "crates/pr4xis-derive",
    "crates/pr4xis",
    "crates/domains",
    "crates/examples",
    "crates/cli",
    "crates/chat",
    "crates/web",
]
# pr4xis-wasm excluded from default workspace (needs wasm target).
# pr4xis-e2e excluded too — it drives a real browser via WebDriver and
# needs a running web server + geckodriver, so it must not run under
# `cargo test --workspace`. CI invokes it explicitly (see ci.yml `e2e`).
exclude = ["crates/wasm", "crates/e2e"]

# Vendored lopdf with visibility patches that pub-export
# `cmap::ToUnicodeCMap` and the `glyphnames` + `mappings` modules.
# Per ISO 32000-2:2020 §9.10.2 + Adobe Tech Note #5014, downstream
# crates implementing PDF text extraction must be able to name the
# ToUnicodeCMap type to construct `Encoding::UnicodeMapEncoding`.
# The functionality already exists in lopdf (merged PRs #314,
# #328); only the public API surface was missing. Patches are in
# `vendor/lopdf/` — see `vendor/lopdf/PRAXIS_PATCHES.md` for the
# diff to submit upstream. When the upstream PRs land in a
# released version, drop this `[patch.crates-io]` and bump the
# `lopdf = "..."` constraint.
#
# xsd-parser-types: builds from an `i-am-logger/xsd-parser` fork
# branch that carries an opt-in `serde` cargo feature gating
# `Serialize` / `Deserialize` derives on the runtime helper types
# (`xml::Text`, `xml::Mixed<T>`, `xml::AnyElement`,
# `xml::AnyAttributes`) that xsd-parser's
# `Config::with_serde_quick_xml()` codegen references.
[patch.crates-io]
xsd-parser-types = { git = "https://github.com/i-am-logger/xsd-parser.git", branch = "feat-serde-derives-on-helper-types" }
lopdf = { path = "vendor/lopdf" }

[workspace.lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

# Speed up `cargo test` and `cargo run` in the default debug profile by
# building both workspace crates AND external deps with `opt-level = 1`.
# The USC corpus loader (`usc_loaded()`) parses ~85 MB of USLM XML
# through workspace code on first touch; at `opt-level = 0` that takes
# ~20s in debug, which propagates as a parallel-init wait across the
# ~30 statute tests that share the `OnceLock`. opt-level = 1 brings the
# parse to a few seconds while keeping `debug_assertions` and overflow
# checks on. Standard Rust convention; see
# <https://doc.rust-lang.org/cargo/reference/profiles.html>.
#
# Workspace crates explicitly because USLM read code lives in
# `crates/domains`, not in any dep; the deps-only variant
# (`[profile.dev.package."*"]`) doesn't reach it.
[profile.dev]
opt-level = 1
