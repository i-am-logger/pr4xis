[workspace]
resolver = "3"
members = [
    "crates/pr4xis-derive",
    "crates/pr4xis",
    "crates/pr4xis-runtime",
    "crates/domains",
    "crates/examples",
    "crates/cli",
    "crates/chat",
    "crates/web",
]
# pr4xis-wasm excluded from default workspace (its lib builds for the
# wasm32 target). Its NATIVE `mod acceptance` tests (host-target
# #[test]s gated to non-wasm32) therefore do NOT run under
# `cargo test --workspace`; CI + dev-ci run them explicitly via
# `cargo test --manifest-path crates/wasm/Cargo.toml`. The wasm32
# browser tests run separately via `wasm-pack test` (dev-test-wasm).
# pr4xis-e2e excluded too — it drives a real browser via WebDriver and
# needs a running web server + geckodriver, so it must not run under
# `cargo test --workspace`. CI invokes it explicitly (see ci.yml `e2e`).
# praxis-corpus-tests excluded so the default nextest run never re-parses the
# multi-hundred-MB USC titles / WordNet per process-isolated test. It depends on
# pr4xis-domains with `test-internals` (+ `codegen`); keeping it a non-member
# stops that feature from unifying into the normal workspace build. It runs
# under `cargo test` (one process → a LazyLock fixture parses each giant once),
# invoked explicitly via `--manifest-path crates/praxis-corpus-tests/Cargo.toml`.
exclude = ["crates/wasm", "crates/e2e", "crates/praxis-corpus-tests"]

# Single workspace version — every member inherits it via
# `version.workspace = true`, so all praxis crates move in lockstep
# (the Bevy / Tauri / SeaORM convention the config always intended).
# This REPLACES release-plz's `version_group`, which silently stopped
# syncing once the publish=false crates drifted behind the published ones.
#
# 0.24.0 is a one-time RE-BASELINE, set by hand. The publish=false domains
# crate (where ~all praxis work lands) had drifted to 0.22.0 while the
# published crates reached 0.23.1, so release-plz — which reconciles the
# shared version against the higher published baseline — could only ever
# absorb a domains change into a patch (0.23.2), even the breaking
# DeterminerKind rename (FW-B, committed as `feat!`). There is no historical
# commit where domains was 0.23.1 to seed a clean baseline from, so the
# minor bump that this breaking release warrants is set here. After it ships,
# release-plz tags domains at the workspace version (it is now release-plz-
# visible — its publish gate moved to release-plz.toml), domains' baseline is
# finally consistent, and FUTURE breaking domains changes auto-escalate. This
# is the last hand-set version.
[workspace.package]
version = "0.25.1"

[workspace.lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

# Speed up `cargo test` and `cargo run` in the default debug profile by
# building both workspace crates AND external deps with `opt-level = 1`.
# The USC corpus loader (`usc_loaded()`) parses ~85 MB of USLM XML
# through workspace code on first touch; at `opt-level = 0` that takes
# ~20s in debug, which propagates as a parallel-init wait across the
# ~30 statute tests that share the `OnceLock`. opt-level = 1 brings the
# parse to a few seconds while keeping `debug_assertions` and overflow
# checks on. Standard Rust convention; see
# <https://doc.rust-lang.org/cargo/reference/profiles.html>.
#
# Workspace crates explicitly because USLM read code lives in
# `crates/domains`, not in any dep; the deps-only variant
# (`[profile.dev.package."*"]`) doesn't reach it.
[profile.dev]
opt-level = 1
