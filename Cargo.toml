[workspace]
resolver = "3"
members = [
    "crates/pr4xis-derive",
    "crates/pr4xis",
    "crates/domains",
    "crates/examples",
    "crates/cli",
    "crates/chat",
    "crates/web",
]
# pr4xis-wasm excluded from default workspace (needs wasm target)
exclude = ["crates/wasm"]

# Vendored lopdf with visibility patches that pub-export
# `cmap::ToUnicodeCMap` and the `glyphnames` + `mappings` modules.
# Per ISO 32000-2:2020 §9.10.2 + Adobe Tech Note #5014, downstream
# crates implementing PDF text extraction must be able to name the
# ToUnicodeCMap type to construct `Encoding::UnicodeMapEncoding`.
# The functionality already exists in lopdf (merged PRs #314,
# #328); only the public API surface was missing. Patches are in
# `vendor/lopdf/` — see `vendor/lopdf/PRAXIS_PATCHES.md` for the
# diff to submit upstream. When the upstream PRs land in a
# released version, drop this `[patch.crates-io]` and bump the
# `lopdf = "..."` constraint.
[patch.crates-io]
lopdf = { path = "vendor/lopdf" }

[workspace.lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
