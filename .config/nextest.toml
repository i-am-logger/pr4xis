# Slow-test guard. Two profiles, because `[profile.default]` (local
# `dev-test`) compiles in DEBUG while `[profile.ci]` runs
# `cargo nextest run --release`; the strict markers need release
# semantics underneath them.
#
# `[profile.default]` — local debug (relaxed marker):
#   period = 15s          — `SLOW [> 15s]` marker, visible in the
#                           `dev-test` log developers already read.
#   terminate-after = 2   — 30s hard cap.
#
# `[profile.ci]` — release (strict marker):
#   period = 10s          — `SLOW [> 10s]` warning; release-built tests
#                           at this scale should finish well under it.
#   terminate-after = 3   — 30s hard cap; catches genuine regressions.
#
# The compact `.prx` fast-load (#271) has landed: `usc_loaded()` now reads a
# content-addressed compact archive (~1.4s for the whole USC corpus) instead of
# parsing ~85 MB of USLM XML. The heavy-corpus parse-once tests therefore live
# in `crates/praxis-corpus-tests` (run under `cargo test`, NOT nextest), so the
# bulk nextest lane below stays fast.
#
# References: nextest-rs/nextest book §"Slow tests and timeouts"
# (<https://nexte.st/book/slow-tests.html>).
[profile.default.slow-timeout]
period = "15s"
terminate-after = 2

[profile.ci]
fail-fast = false

[profile.ci.slow-timeout]
period = "10s"
terminate-after = 3

[profile.ci.junit]
path = "junit.xml"

# ─────────────────────────────────────────────────────────────────────────────
# Oversize byte-exact proofs (CI-A, #186). The always-run `ci_gate_passes` DEFERS
# the > 16 MB byte-exact sources (WordNet ~86 MB, the giant USC titles 19–113 MB)
# as `OversizeDeferred`; `ci_gate_passes_giants` — and, under
# `--features "fetch codegen"`, `all_sources_source_round_trip_byte_exact` —
# RECONSTRUCT them in full. That work legitimately exceeds the strict per-test cap
# above, so these tests get a relaxed slow-timeout and run SERIALIZED (the
# `usc-giants` group, max-threads = 1) so several > 100 MB reconstructions don't
# run concurrently and exhaust the runner's memory. The fast lane keeps its strict
# cap and still catches every small-source lens regression on every push.
[test-groups.usc-giants]
max-threads = 1

[[profile.default.overrides]]
filter = 'test(ci_gate_passes_giants) | test(all_sources_source_round_trip_byte_exact)'
test-group = "usc-giants"
slow-timeout = { period = "180s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = 'test(ci_gate_passes_giants) | test(all_sources_source_round_trip_byte_exact)'
test-group = "usc-giants"
slow-timeout = { period = "120s", terminate-after = 3 }

# ─────────────────────────────────────────────────────────────────────────────
# Corpus-heavy statute tests (sox_1514a, statute_understanding) load the full USC
# corpus (`usc_loaded`) and resolve WordNet lemmas. The #271 compact fast-load
# dropped `usc_loaded` from a ~15s XML parse to ~1.4s, but at very high core
# counts (a 32-core box) ~30 of these run concurrently and the residual WordNet
# resolution + memory-bandwidth contention can still push a few past the strict
# cap; at a normal CI runner's parallelism they pass comfortably. This headroom
# keeps the suite green at ANY core count (the SLOW marker still surfaces the
# cost). Removable once the consumer tests also load the compact `.prx` so the
# WordNet leg is fast too (the .prx-cache fixture — see docs/understand/test-architecture.md).
[[profile.default.overrides]]
filter = 'test(sox_1514a) | test(statute_understanding)'
slow-timeout = { period = "30s", terminate-after = 2 }

[[profile.ci.overrides]]
filter = 'test(sox_1514a) | test(statute_understanding)'
slow-timeout = { period = "30s", terminate-after = 2 }
