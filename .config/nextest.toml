# Slow-test guard. Two profiles, because `[profile.default]` (local
# `dev-test`) compiles in DEBUG while `[profile.ci]` runs
# `cargo nextest run --release`; the strict markers need release
# semantics underneath them.
#
# `[profile.default]` — local debug (relaxed marker):
#   period = 15s          — `SLOW [> 15s]` marker, visible in the
#                           `dev-test` log developers already read.
#   terminate-after = 2   — 30s hard cap.
#
# `[profile.ci]` — release (strict marker):
#   period = 10s          — `SLOW [> 10s]` warning; release-built tests
#                           at this scale should finish well under it.
#   terminate-after = 3   — 30s hard cap; catches genuine regressions.
#
# The compact `.prx` fast-load (#271) has landed: `usc_loaded()` now reads a
# content-addressed compact archive (~1.4s for the whole USC corpus) instead of
# parsing ~85 MB of USLM XML. The heavy-corpus parse-once tests therefore live
# in `crates/praxis-corpus-tests` (run under `cargo test`, NOT nextest), so the
# bulk nextest lane below stays fast.
#
# References: nextest-rs/nextest book §"Slow tests and timeouts"
# (<https://nexte.st/book/slow-tests.html>).
[profile.default.slow-timeout]
period = "15s"
terminate-after = 2

[profile.ci]
fail-fast = false

[profile.ci.slow-timeout]
period = "10s"
terminate-after = 3

[profile.ci.junit]
path = "junit.xml"

# ─────────────────────────────────────────────────────────────────────────────
# Oversize byte-exact proofs (CI-A, #186). The always-run `ci_gate_passes` DEFERS
# the > 16 MB byte-exact sources (WordNet ~86 MB, the giant USC titles 19–113 MB)
# as `OversizeDeferred`; `ci_gate_passes_giants` — and, under
# `--features "fetch codegen"`, `all_sources_source_round_trip_byte_exact` —
# RECONSTRUCT them in full. That work legitimately exceeds the strict per-test cap
# above, so these tests get a relaxed slow-timeout and run SERIALIZED (the
# `usc-giants` group, max-threads = 1) so several > 100 MB reconstructions don't
# run concurrently and exhaust the runner's memory. The fast lane keeps its strict
# cap and still catches every small-source lens regression on every push.
[test-groups.usc-giants]
max-threads = 1

[[profile.default.overrides]]
filter = 'test(ci_gate_passes_giants) | test(all_sources_source_round_trip_byte_exact)'
test-group = "usc-giants"
slow-timeout = { period = "180s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = 'test(ci_gate_passes_giants) | test(all_sources_source_round_trip_byte_exact)'
test-group = "usc-giants"
slow-timeout = { period = "120s", terminate-after = 3 }

# ─────────────────────────────────────────────────────────────────────────────
# Corpus-heavy statute tests (sox_1514a, statute_understanding) materialize the
# full USC corpus (`usc_loaded`) AND the full English WordNet (`english_loaded`
# via `cached_english`), then run the per-term lexical-adjunction resolution over
# every registered statute. Both corpora now load from the content-addressed
# compact `.prx` cache in ~ms each when it is populated (CI emits it before the
# run — see .github/workflows/ci.yml; `dev-ci` likewise), so the cost here is no
# longer XML parsing but the lemma-resolution graph work itself. At very high core
# counts (a 32-core box) ~30 of these run concurrently and memory-bandwidth
# contention can still push a few past the strict cap; at a normal CI runner's
# parallelism they pass comfortably. (A bare `dev-test` that has not populated the
# `.prx-cache` falls back to the full XML parse and is slower still.) This headroom
# keeps the suite green at ANY core count, with or without the cache — the SLOW
# marker still surfaces the cost.
[[profile.default.overrides]]
filter = 'test(sox_1514a) | test(statute_understanding)'
slow-timeout = { period = "30s", terminate-after = 2 }

[[profile.ci.overrides]]
filter = 'test(sox_1514a) | test(statute_understanding)'
slow-timeout = { period = "30s", terminate-after = 2 }

# ─────────────────────────────────────────────────────────────────────────────
# `agid_is_the_oracle_for_the_plural_noun_rule_route` — an exhaustive oracle
# sweep over the full AGID inflection dictionary (`agid-infl.txt`, already on
# disk, no network fetch at runtime), checking every "N" (noun) headword's
# plural-formation rule against the loaded pluralization engine. Confirmed by
# direct measurement, twice: 29.044s in complete isolation (zero contention,
# `-E 'test(agid_is_the_oracle_for_the_plural_noun_rule_route)'` alone) — a
# genuinely, consistently slow test sitting right at the strict 30s cap's
# edge, not a resource-contention artifact (ruled out explicitly, unlike the
# sox_1514a/statute_understanding override above, which IS contention-only
# per its own comment). Same relaxed-cap treatment for the same underlying
# reason: legitimately exhaustive per-headword work over a large real corpus.
[[profile.default.overrides]]
filter = 'test(agid_is_the_oracle_for_the_plural_noun_rule_route)'
slow-timeout = { period = "45s", terminate-after = 2 }

[[profile.ci.overrides]]
filter = 'test(agid_is_the_oracle_for_the_plural_noun_rule_route)'
slow-timeout = { period = "45s", terminate-after = 2 }

# ─────────────────────────────────────────────────────────────────────────────
# `ontology_base_is_consistent` — the whole-base consistency proof. Its cost is
# a function of how many ontologies the workspace registers, so it grows with
# the codebase by construction; every ontology added anywhere makes this one
# test do more work.
#
# Measured, both numbers: 11.87s in complete isolation on a many-core
# workstation (`-E 'test(ontology_base_is_consistent)'` alone), against 30.49s
# on a CI runner inside the full 8,835-test suite — where it exceeded the strict
# 30s cap and was killed. So it is BOTH genuinely slow (unlike the
# sox_1514a/statute_understanding override above, which is contention-only) and
# contention-sensitive (unlike agid, which is ~29s isolated). Neither existing
# override's reasoning covers it, hence its own.
#
# `period` stays at 30s deliberately rather than being raised to hide the cost:
# the SLOW marker still fires at the point CI currently reaches, so a real
# regression stays visible in the log. `terminate-after = 3` lifts the hard cap
# to 90s — 3x the observed CI worst case — so a slow runner cannot fail the
# suite for a test that is merely doing its job.
[[profile.default.overrides]]
filter = 'test(ontology_base_is_consistent)'
slow-timeout = { period = "30s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = 'test(ontology_base_is_consistent)'
slow-timeout = { period = "30s", terminate-after = 3 }
