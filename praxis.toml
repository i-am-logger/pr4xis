# TAGGED source: cu-clear/verbnet tag `vn-3.3` (the last GitHub-tagged
# release; VerbNet 3.4's class files exist only on an untagged branch head,
# not used here) is the fetch endpoint; `pr4xis update` clones it and
# `verbnet_class_collection::archive_directory` flattens the `verbnet3.3/`
# class directory into ONE deterministic archive at the `local_path` below
# (one blob, 332 classes), which then rides the generalized raw-source `.prx`
# path under the `VerbClassLexicon` leaf. BUNDLED source-of-truth — same
# reasoning as tinted_schemes: `git archive` from a fixed tag IS
# content-deterministic (confirmed: two independent `git archive vn-3.3`
# runs produced byte-identical output), but GitHub's own tarball-generation
# endpoint is not guaranteed to be, so the checkout is archived locally
# rather than pinning a fetched tarball's hash directly. The raw checkout is
# gitignored after archiving; only the committed content-addressed `.prx`
# ships. Independent of WordNet's own gloss/hypernym construction — the
# classification derives from Levin's syntactic-alternation diagnostics, not
# lexicographic definition — the source the corroboration mechanism
# (`formal::relations` `MemberOf` kind) consults for a genuinely separate
# signal on verb-sense relatedness.
[sources.verbnet]
version     = "3.3"
type        = "VerbClassLexicon"
url         = "https://github.com/cu-clear/verbnet.git"
local_path  = "verbnet/verbnet-3.3.verbnet"
description = "VerbNet 3.3 class hierarchy — Kipper, Korhonen, Ryant & Palmer (2008) A Large-scale Classification of English Verbs, Language Resources and Evaluation 42(1):21-40; Levin (1993) English Verb Classes and Alternations, University of Chicago Press. 332 per-class XML files (`verbnet3.3/`), each declaring `<MEMBER name=\"...\" wn=\"...\">` entries keyed by WordNet sense-key and nested `<SUBCLASSES>`. Provenance: cu-clear/verbnet, tag `vn-3.3` (2020-07-09), the last tagged release (the class files themselves are unchanged by later untagged commits for the classes this project consults). BUNDLED source-of-truth — a git-clone-and-archive is not guaranteed byte-reproducible against the pin (GitHub's tarball packaging can drift even for a fixed tag), so the deterministic `.verbnet` archive (`verbnet_class_collection::archive_directory` over the `verbnet3.3/` class directory) is git-tracked, EXCLUDED from the published crate by the `[package].include` allowlist, and present on a fresh checkout so `pr4xis update` verifies it against the pin instead of re-cloning (re-sync deliberately via `pr4xis update verbnet --lock`). Shipped as the committed content-addressed `.prx`."

# ConceptNet 5.7.0 (Speer, Chin & Havasi 2017) — a THIRD, independent
