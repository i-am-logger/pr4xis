# English orthographic grapheme classes — the vowel/consonant partition of the
# 26 basic-Latin letters, plus `y` as the one genuinely dual letter. Replaces a
# hardcoded `matches!(c, 'a'|'e'|'i'|'o'|'u')` that was DUPLICATED across
# `morphology::english::{generation,irregular}`, with `y`'s dual status
# scattered beside it as ad-hoc `|| c == 'y'` tests: the orthographic rules
# built on it are cited, but the alphabet they range over was encoded rather
# than loaded. NOT derivable from the UCD — Unicode classifies these code
# points only as General_Category=Ll/Lu and says nothing about vowel-hood,
# which is a language-specific orthographic fact.
[sources.english_grapheme_classes]
version     = "1994"
type        = "EnglishGraphemeClasses"
url         = "https://www.routledge.com/A-Survey-of-English-Spelling/Carney/p/book/9780415092708"
local_path  = "grammar/english-grapheme-classes.tsv"
fetchable   = false
description = "English orthographic grapheme classes — the 26 basic-Latin letters partitioned into vowel letters (a e i o u), consonant letters, and the one dual letter (y). Carney, Edward (1994), A Survey of English Spelling (London: Routledge), Ch.1 — the standard descriptive survey of English orthography, which sets out the letter inventory and treats <y> as dual-function. Cross-grounded by Quirk, Greenbaum, Leech & Svartvik (1985), A Comprehensive Grammar of the English Language (London: Longman) §3.21, whose orthographic plural rule is stated over exactly this partition and depends on <y> patterning as a vowel in \"boy\" -> \"boys\". <y> is carried as class Dual rather than forced into one bucket because the two consuming rules need different readings — syllable-peak counting treats it as a vowel (\"rhythm\"), the consonant-before-final-<y> test treats it as not-a-consonant (\"boy\") — which the loaded vocabulary exposes as two named queries instead of a lossy boolean. AUTHORED source-of-truth (not URL-fetchable): git-tracked, excluded from the published crate, shipped as the committed content-addressed `.prx`."

