[sources.conceptnet]
version     = "5.7.0"
type        = "AssociativeConceptTable"
url         = "https://s3.amazonaws.com/conceptnet/downloads/2019/edges/conceptnet-assertions-5.7.0.csv.gz"
local_path  = "conceptnet/conceptnet-5.7.0.assoc"
description = "ConceptNet 5.7.0 commonsense association graph — Speer, R., Chin, J. & Havasi, C. (2017) ConceptNet 5.5: An Open Multilingual Graph of General Knowledge, Proceedings of AAAI 2017. Data licensed CC BY-SA 4.0 (see `conceptnet-LICENSE.txt`). No official English-only or WordNet-linked subset is distributed by the ConceptNet project, and the full assertions CSV (34,074,917 rows, 497,963,447 bytes gzip, verified 2026-07-13) is far too large to bundle whole — so, like VerbNet, this is a BUNDLED source-of-truth: a deterministic, MECHANICAL filter (`cognitive::linguistics::conceptnet::regenerate::regenerate_conceptnet_archive`) keeps only the 932,948 assertions whose start AND end concepts both resolve to a lemma the loaded Open English WordNet 2025 carries — a pure format-conversion (raw relation/start/end/weight fields unchanged), never a reweighting or relation-type curation. Rows: `relation<TAB>start_lemma<TAB>end_lemma<TAB>weight`. Rides the generic `ContentType::Plaintext` raw-source path (no dedicated decoder — same codec as CaseFoldingTable/InflectionLexicon). Git-tracked, EXCLUDED from the published crate by the `[package].include` allowlist, present on a fresh checkout so `pr4xis update` verifies it against the pin instead of re-fetching the 475 MB upstream (re-sync deliberately via `pr4xis update conceptnet --lock`, which requires the external fetch+decompress prep step documented in `regenerate.rs`'s module doc — no generic `pr4xis update` primitive covers 'download, decompress, then run a WordNet-crosswalk filter'). Shipped as the committed content-addressed `.prx`."

# FrameNet 1.7 (Baker, Fillmore & Lowe 1998) — a THIRD independent
# corroboration signal for the two-entity relation path's lone-hit gate,
# alongside VerbNet and ConceptNet. See `formal::relations` `Association`
# (the relation kind every FrameNet frame-relation edge maps onto,
# generically — SKOS `related`, no fine-grained per-relation-type mapping)
# and `cognitive::linguistics::framenet`.
[sources.framenet]
version     = "1.7"
type        = "FrameSemanticTable"
url         = "https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/framenet_v17.zip"
local_path  = "framenet/framenet-1.7.tsv"
description = "FrameNet 1.7 lexical-unit + frame-relation graph — Baker, C. F., Fillmore, C. J. & Lowe, J. B. (1998) The Berkeley FrameNet Project, Proceedings of COLING-ACL 1998; Ruppenhofer, J., Ellsworth, M., Petruck, M. R. L., Johnson, C. R. & Scheffczyk, J. (2016) FrameNet II: Extended Theory and Practice, ICSI. Data licensed CC BY 3.0 Unported (see `framenet-LICENSE.txt`; confirmed via the NLTK redistribution's own package index, author Collin F. Baker). No official small subset is distributed either — the `lu/` directory alone is ~13,574 files / ~84 MB compressed inside the official release (NLTK-mirrored `framenet_v17.zip`, SHA256 `22f6aad6fb799ba4dbed0440714e1118442ad7d7345351de37428581284f471c`, MD5 `aaef1cfdcf37000cf2a5c562407fbddb`, verified 2026-07-13) — so, like ConceptNet, this is a BUNDLED source-of-truth: a deterministic, MECHANICAL extraction (`cognitive::linguistics::framenet::regenerate::regenerate_framenet_archive`) keeps only each lexical unit's root `<lexUnit POS=\"...\" name=\"...\" frame=\"...\">` start-tag attributes (13,336 open-class rows survive; 208 closed-class + 28 malformed are dropped) plus every `frRelation.xml` `<frameRelation subFrameName=\"...\" superFrameName=\"...\">` pairing (2,070 rows) — never the embedded annotated-sentence corpus each LU file also carries, nor the frame-element-level relation mappings. A pure format-conversion, never a reweighting or relation-type curation. Rows: type-tagged `LU<TAB>lemma<TAB>pos<TAB>frame` / `REL<TAB>relation<TAB>sub_frame<TAB>super_frame`. Rides the generic `ContentType::Plaintext` raw-source path (no dedicated decoder — same codec as CaseFoldingTable/AssociativeConceptTable). Git-tracked, EXCLUDED from the published crate by the `[package].include` allowlist, present on a fresh checkout so `pr4xis update` verifies it against the pin instead of re-fetching the 99 MB upstream (re-sync deliberately via `pr4xis update framenet --lock`, which requires the external fetch prep step documented in `regenerate.rs`'s module doc — no generic `pr4xis update` primitive covers 'download, then extract+filter a ZIP archive'). Shipped as the committed content-addressed `.prx`."

# SUMO WordNet↔SUMO mappings (Niles & Pease 2001, 2003) — a FOURTH independent
# corroboration signal for the two-entity relation path's lone-hit gate,
# alongside VerbNet, ConceptNet, and FrameNet. Unlike the other three, SUMO
# carries a NATIVE WordNet reference (each annotated line IS a WN 3.0 synset
# record), so `cognitive::linguistics::sumo` resolves synset identity
# (`oewn-<offset>-<pos>`) LIVE at query time — no precomputed crosswalk.
[sources.sumo]
version     = "2026.07.14"
type        = "SumoWordNetMappingTable"
url         = "https://github.com/ontologyportal/sumo/tree/master/WordNetMappings"
local_path  = "sumo/sumo-wordnetmappings-30.tsv"
fetchable   = false
description = "SUMO WordNet↔SUMO mapping table — Niles, I. & Pease, A. (2001) Towards a Standard Upper Ontology, Proceedings of FOIS 2001, pp. 2-9; Niles, I. & Pease, A. (2003) Linking Lexicons and Ontologies: Mapping WordNet to the Suggested Upper Merged Ontology, Proceedings of IEEE IKE 2003, pp. 412-416. For each Princeton WordNet 3.0 synset, the SUMO upper-ontology term(s) it maps to, each tagged with the relation the source's own legend defines by suffix: `=` equivalence, `+` subsumption, `@` instance, and the complements `:`/`[`/`]` (the synset is explicitly NOT that class). The source `WordNetMappings30-{noun,verb,adj,adv}.txt` files are annotated COPIES of the WordNet 3.0 `data.*` files (each data line a full WNDB record with `&%<term><suffix>` tokens appended), ~22 MB across the four files, so — like FrameNet/ConceptNet — this is a BUNDLED source-of-truth: a deterministic, MECHANICAL extraction+resolution (`cognitive::linguistics::sumo::regenerate::regenerate_sumo_archive`). SUMO's PWN-3.0 synset offsets do NOT match Open English WordNet 2025 (only ~385 of 82,115 noun offsets collide), so — exactly like VerbNet — the regen parses the OEWN XML once, offline, and resolves each synset to a `ConceptId` VALUE (stable across load paths) via the version-stable WordNet SENSE KEY reconstructed from the WNDB member words + `lex_filenum`, baking that value into the committed table so the runtime store needs no WordNet lookup. Verified 2026-07-14 against ontologyportal/sumo `master` commit 152b9abc440477073b5e4e573983b730a619da7b: 116,007 annotated synsets resolve to 91,088 (90,478 via sense key, 610 via offset; 24,919 dropped as unmapped), yielding 91,218 rows over 90,490 distinct concepts. Rows: `concept_value<TAB>term<TAB>relation_code<TAB>oewn_synset_id` — the 4th column (added 2026-07-14) is the real, external OEWN synset id the row's `concept_value` resolves to (carried on every row, not just `EQ`), consumed by `cognitive::linguistics::sumo::sssom` to mint an SSSOM `skos:exactMatch` mapping set over the `EQ` rows (SSSOM: Matentzoglu et al. 2022, Database (Oxford) baac035). Rides the generic `ContentType::Plaintext` raw-source path (no dedicated decoder — same codec as CaseFoldingTable/AssociativeConceptTable/FrameSemanticTable). The SUMO repo publishes no tagged release for these files, so the fetch is pinned by the recorded `master` commit SHA above rather than a git tag; DERIVED/bundled source-of-truth (not a single URL-fetchable file, hence `fetchable = false`): git-tracked, EXCLUDED from the published crate by the `[package].include` allowlist, present on a fresh checkout so `pr4xis update` verifies it against the pin instead of re-fetching (re-sync deliberately via the external fetch step in `regenerate.rs`'s module doc). Data licensed GNU General Public License (GPL) — a THIRD-PARTY license, distinct from and not superseded by this repository's own CC BY-NC-SA 4.0 license (see LICENSE); this file is bundled and redistributed under its own GPL terms (see `sumo-LICENSE.txt`). Shipped as the committed content-addressed `.prx`."

# PropBank predicate argument-structure frames (Palmer, Gildea & Kingsbury
# 2005; Bonial, Bonn, Conger, Hwang & Palmer 2014) — a FIFTH, independent
# corroboration signal for the two-entity relation path's lone-hit gate,
# alongside VerbNet, ConceptNet, FrameNet, and SUMO. Unlike SUMO's native
# WordNet synset reference, PropBank's `<alias>` entries carry NO WordNet
# link at all — FrameNet's precedent, not SUMO's: `cognitive::linguistics::
# propbank` resolves lemma+POS LIVE at query time, never a precomputed
# crosswalk. The signal itself is cross-POS roleset aliasing (a verb sense
# and a noun sense sharing one argument-structure frame's `<roleset>`), never
# a nested class hierarchy the way VerbNet's `<SUBCLASSES>` is.
[sources.propbank]
version     = "3.4.0"
type        = "PredicateArgumentLexicon"
url         = "https://github.com/propbank/propbank-frames.git"
local_path  = "propbank/propbank-3.4.0.propbank"
description = "PropBank 3.4.0 predicate argument-structure frames — Palmer, M., Gildea, D. & Kingsbury, P. (2005) The Proposition Bank: An Annotated Corpus of Semantic Roles, Computational Linguistics 31(1):71-106; Bonial, C., Bonn, J., Conger, K., Hwang, J. & Palmer, M. (2014) PropBank: Semantics of New Predicate Types, LREC 2014. 7,565 per-lemma XML files (`frames/`), each declaring `<frameset><predicate lemma=\"...\"><roleset id=\"...\"><aliases><alias pos=\"...\">...</alias>` entries — the cross-POS argument-structure signal `cognitive::linguistics::propbank` builds `PropBankStore::shares_roleset` from. Provenance: propbank/propbank-frames, tag `v3.4.0`, commit `4087fa9ab5c40907c34ff91a56acc2cab1670145` (independently verified via `gh api repos/propbank/propbank-frames/tags`). BUNDLED source-of-truth — a git-clone-and-archive is not guaranteed byte-reproducible against the pin (GitHub's tarball packaging can drift even for a fixed tag), so the deterministic `.propbank` archive (`propbank_frameset_collection::archive_directory` over the `frames/` directory, excluding the three non-frame entries `.gitignore`/`README.txt`/`frameset.dtd` — 7,565 of 7,568 tree entries, verified via `gh api repos/propbank/propbank-frames/git/trees/<sha>:frames`) is git-tracked, EXCLUDED from the published crate by the `[package].include` allowlist, and present on a fresh checkout so `pr4xis update` verifies it against the pin instead of re-cloning (re-sync deliberately via `pr4xis update propbank --lock`). No native WordNet sense-key or synset reference exists in the source data (confirmed 2026-07-13: zero machine-readable `wn=`/`wordnet` links found across sample lemma files outside free-text `<note>` prose, and the DTD's `rolelink`/`lexlink` cross-resource vocabulary observed in the data is `{AMR, FrameNet, PropBank, VerbNet}`, never `WordNet`), so — unlike VerbNet's/SUMO's precomputed sense-key crosswalk — `PropBankStore` resolves lemma+POS LIVE against the loaded WordNet at query time, FrameNet's own precedent. Data licensed Creative Commons Attribution-ShareAlike 4.0 International (CC BY-SA 4.0, see `propbank-LICENSE.txt`; confirmed via `gh api repos/propbank/propbank-frames` `license.spdx_id: \"CC-BY-SA-4.0\"`). Shipped as the committed content-addressed `.prx`."

# GeoNames countryInfo.txt — the real-world gazetteer `natural::geography`
# loads Country/Capital/Region/`borders` facts from, replacing the prior
# hand-curated 3-country fixture. Unlike VerbNet/ConceptNet/FrameNet/PropBank
# (many-file collections needing a directory-archive codec), this is a
# SINGLE ~31 KB plain-text HTTP-fetchable file — the simplest BUNDLED case,
# same praxis-TSV convention/decoder as the other ControlledVocabulary leaves.
[sources.geonames_countryinfo]
version     = "2026-07-21"
type        = "GazetteerTable"
url         = "http://download.geonames.org/export/dump/countryInfo.txt"
local_path  = "geography/geonames-countryinfo-2026-07-21.geonames"
description = "GeoNames countryInfo.txt — the ISO 3166-1 country/territory gazetteer (Country/Capital/Continent/neighbours), fetched live from download.geonames.org/export/dump/countryInfo.txt on 2026-07-21. ~50 leading `#`-prefixed header comment lines (including a commented `#ISO<TAB>ISO3<TAB>...` column-header line) followed by 252 tab-separated data rows: `ISO<TAB>ISO3<TAB>ISO-Numeric<TAB>fips<TAB>Country<TAB>Capital<TAB>Area(in sq km)<TAB>Population<TAB>Continent<TAB>tld<TAB>CurrencyCode<TAB>CurrencyName<TAB>Phone<TAB>PostalCodeFormat<TAB>PostalCodeRegex<TAB>Languages<TAB>geonameid<TAB>neighbours<TAB>EquivalentFipsCode`. `Country`+`Capital` ground `natural::geography`'s `EveryCountryHasExactlyOneCapital` (some territories — Antarctica, Bouvet Island, Heard Island & McDonald Islands, Tokelau, the U.S. Minor Outlying Islands, Bonaire/Saint Eustatius/Saba — carry an empty `Capital`, loaded as `Option::None`, never a blank string). `Continent` (2-letter code EU/AS/AF/NA/SA/OC/AN) grounds `RegionContainmentIsRcc8ProperPart`. `neighbours` (comma-separated ISO codes, empty for islands) grounds `BordersIsRcc8ExternalConnection`; verified 2026-07-21 that the raw per-row neighbour lists are mutually consistent for 646 of 654 directed pairs — the 8 exceptions are all incident to the two defunct legacy entries `CS` (Serbia and Montenegro, dissolved 2006) and `AN` (Netherlands Antilles, dissolved 2010), whose successor states' own rows no longer list them back — so the loader SYMMETRIZES (unions both directions) rather than trusting one row's list alone. Data licensed Creative Commons Attribution (CC BY) 4.0: GeoNames.org's export terms (<https://www.geonames.org/export/>) require attribution — \"You should give credit to GeoNames when using data or web services with a link or another reference to GeoNames.\" BUNDLED source-of-truth (a single small HTTP-fetchable file, unlike the many-file collections this project archives via a directory codec): git-tracked, EXCLUDED from the published crate by the `[package].include` allowlist, present on a fresh checkout so `pr4xis update` verifies it against the pin instead of re-fetching (re-sync deliberately via `pr4xis update geonames_countryinfo --lock`). Shipped as the committed content-addressed `.prx`."

