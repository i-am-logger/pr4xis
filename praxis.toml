# source for SOX-specific application contexts.
[sources.lawson_v_fmr_llc_2014]
version     = "2014"
type        = "CaseLaw"
url         = "https://supreme.justia.com/cases/federal/us/571/429/"
description = "Lawson v. FMR LLC, 571 U.S. 429 (2014) — SOX 1514A applies to private contractors"

# Murray v. UBS Securities, LLC, 601 U.S. 23 (2024). Clarifies the
