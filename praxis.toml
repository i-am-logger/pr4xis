# praxis.toml — Praxis external-data registry manifest.
#
# Cargo-precedent naming: this file is the manifest; `praxis.lock` (M2)
# pins the expected content hashes per (name, version). Lives at the
# workspace root next to `Cargo.toml`. Downstream applications using
# praxis place their own `praxis.toml` at *their* project root for
# project-specific corpora; praxis itself bundles only universal
# baselines (e.g. English WordNet).
#
# Schema (one `[sources.<name>]` entry per registered corpus):
#
#   version  — free-form publication identifier (calendar year, amendment
#              cycle, etc.). Not semver; legal corpora are publication-date
#              identified.
#   type     — a leaf concept name from the `SourceTaxonomy` ontology
#              (`crates/domains/src/formal/meta/source_taxonomy/`). The
#              parser maps the string to the typed variant; unknown
#              names fail closed at startup.
#   url      — fetch URL (HTTPS). The actual bytes are verified against
#              `praxis.lock`'s pinned sha256 for this (name, version).
#
# Everything else (decoder family, code-path convention, adjunctions to
# other loaded sources) derives from `type` via the taxonomy:
#   - `is_a` chain → decoder family (Lexicon → XML-LMF reader,
#                                    LegalCorpus → text parser)
#   - `is_a` chain → code-path convention
#     (Language → cognitive::linguistics::<name>,
#      Statute  → social::compliance::law::<name>, etc.)
#   - `Adjoins` edges → auto-wired adjunction functors between every
#     pair of loaded instances whose types are adjacent
#
# `pr4xis source add` / `remove` / `list` (M6) mutate this file. Manual
# edits are fine; the runtime registry is `OnceLock`-cached per process,
# so a running process only sees entries present at first load.

[sources.english_wordnet]
version = "2025"
type    = "Language"
url     = "https://github.com/globalwordnet/english-wordnet/releases/download/2025-edition/english-wordnet-2025.xml.gz"

# ---------------------------------------------------------------------------
# Statutes
# ---------------------------------------------------------------------------

# Sarbanes–Oxley Act § 806, codified at 18 U.S.C. § 1514A (2002).
# Whistleblower protection for employees of publicly-traded companies.
#
# `url` points at the authoritative GPO-authenticated PDF on govinfo.gov
# (Bluebook §18 — preferred authenticated digital edition). Praxis can't
# fetch+extract this format yet — the PDF loader is task M4.γ — so for
# now the on-disk canonical text is a hand-transcribed approximation
# under data/canonical_text/, pinned via praxis.lock's [canonical_text.*]
# block with `provenance = "training_reconstructed_<date>"`. When the
# PDF loader lands, `pr4xis update sox_1514a` will fetch this PDF,
# extract text, and replace the hand-transcribed file.
[sources.sox_1514a]
version     = "2002"
type        = "UsFederalStatute"
url         = "https://www.govinfo.gov/content/pkg/USCODE-2018-title18/pdf/USCODE-2018-title18-partI-chap73-sec1514A.pdf"
description = "18 U.S.C. § 1514A — Civil action to protect against retaliation in fraud cases"

# AIR21 — Wendell H. Ford Aviation Investment and Reform Act for the
# 21st Century, codified at 49 U.S.C. § 42121 (added 2000; substantive
# Dodd-Frank amendments 2010). § 42121(b)(2)(B) is the four-clause
# burden-shifting framework that SOX § 1514A(b)(2)(C) imports by
# reference. Same hand-transcribed-pending-PDF-loader shape as sox_1514a.
#
# NOTE: the granule path below is the best-known approximation of the
# 49 USC § 42121 PDF URL — govinfo's section-level granule path for
# title 49 chap 421 wasn't directly verifiable through their JS-rendered
# frontend at authoring time. The URL should be verified and corrected
# (if needed) as part of M4.γ when the PDF loader actually fetches it.
[sources.air21_42121]
version     = "2010"
type        = "UsFederalStatute"
url         = "https://www.govinfo.gov/content/pkg/USCODE-2018-title49/pdf/USCODE-2018-title49-subtitleVII-partA-subpartiii-chap421-sec42121.pdf"
description = "49 U.S.C. § 42121 — Protection of employees providing air safety information; the four-clause burden-shifting framework SOX § 1514A imports by reference"

