description = "Ontology-name → plain-English label projection for the outcome-explanation ('Why?') layer — the lexicalization leg of the NLG realization stage (Reiter & Dale 2000, Building Natural Language Generation Systems, Cambridge University Press, ISBN 9780521620369, https://dl.acm.org/doi/book/10.5555/331700: lexicalization is choosing the surface words for a domain entity). Each row projects a registered OntologyName (praxis.toml [sources.*] key, or the embedded-base name LegalSources) to the human-facing label a reader recognizes, so a snake_case internal identifier never leaks into a user-facing sentence. A name absent from the table projects to the generic fallback 'your loaded documents', so the projection is total. `ontology_name<TAB>label`. AUTHORED source-of-truth (not URL-fetchable): git-tracked, excluded from the published crate, shipped as the committed content-addressed `.prx`."

