# generic min-cost fold (`lambek::supertag_costs`), never a Rust `match` of
# weights.
[sources.ccg_supertag_costs]
version     = "2026"
type        = "SupertagCostTable"
url         = "https://era.ed.ac.uk/handle/1842/320"
local_path  = "grammar/ccg-supertag-costs.tsv"
fetchable   = false
description = "CCG supertag/rule cost table — published CCGbank frequencies as negative-log costs (nats) for the weighted chart (the weighted-CYK shape of Goodman 1999, Semiring Parsing; cost is the final component of the chart's derivation-preference key). Lexical-category unigram counts: Hockenmaier (2003) *Data and Models for Statistical Parsing with Combinatory Categorial Grammar*, PhD thesis, University of Edinburgh, Table 5.5 p. 176 (`#ref` column; section 00 gold standard, 45,422 tokens), <https://era.ed.ac.uk/handle/1842/320>; subject wh-question count from §5.12 p. 186. Type-changing (unary) rule counts: Hockenmaier & Steedman (2005) *CCGbank LDC2005T13 User's Manual*, MS-CIS-05-09, Univ. of Pennsylvania, Table 4.3 p. 86 (sections 02-21, 929,552 tokens), <https://hockenmaier.cs.illinois.edu/Papers/CCGbank/CCGbankManual.pdf>. Normalizers (§8 p. 387) + the hapax default (439 categories occur exactly once, §8.2 p. 389): Hockenmaier & Steedman (2007) CCGbank, Computational Linguistics 33(3):355-396, <https://aclanthology.org/J07-3004/>. Read-off published counts — NOT invented weights, NOT trained parameters. Kind-discriminated rows lex/unary/default; count and total columns verbatim from the sources, the cost column their derived -ln(count/total), machine-rechecked by the loader's oracle test. DERIVED source-of-truth (not URL-fetchable): git-tracked, excluded from the published crate, shipped as the committed content-addressed `.prx`."

