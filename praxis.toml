description = "Natural-language-generation realization-frame table for honest abstention — each row pairs a frame id with a surface template carrying typed slots the realizer fills. Reiter & Dale (2000) Building Natural Language Generation Systems (Cambridge University Press, ISBN 9780521620369, https://dl.acm.org/doi/book/10.5555/331700), the realization stage: a communicative goal is realized by filling a STORED linguistic template, not by concatenating a literal in code. Covers the fifth epistemic cell (vocabulary KNOWN, proposition OPEN) — the honest-abstention surface (Reiter 1978 closed-world assumption) that names both queried concepts as known and the relation as unconfirmed, `frame_id<TAB>template`. AUTHORED source-of-truth (not URL-fetchable): git-tracked, excluded from the published crate, shipped as the committed content-addressed `.prx`."

