[sources.conditional_frames]
version     = "2026"
type        = "RealizationFrameTable"
url         = "https://dl.acm.org/doi/book/10.5555/331700"
local_path  = "grammar/conditional-frames.tsv"
fetchable   = false
description = "Natural-language-generation realization-frame table for the rule-known/fact-missing capability — each row pairs a frame id with a surface template carrying typed slots the realizer fills. Reiter & Dale (2000) Building Natural Language Generation Systems (Cambridge University Press, ISBN 9780521620369, https://dl.acm.org/doi/book/10.5555/331700), the realization stage. Bobrow, Kaplan, Norman, Thompson & Winograd (1977) 'GUS, A Frame-Driven Dialog System', Artificial Intelligence 8(2):155-173: a frame with an unfilled slot triggers a question, not a guess or a refusal. `frame_id<TAB>template`. AUTHORED source-of-truth (not URL-fetchable): git-tracked, excluded from the published crate, shipped as the committed content-addressed `.prx`."

# Outcome-explanation realization frames (the "Why?" layer) — AUTHORED as the
