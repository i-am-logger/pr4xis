[package]
name = "pr4xis-cli"
version = "0.22.0"
edition = "2024"
authors = ["i-am-logger"]
description = "Praxis chatbot CLI — axiomatic intelligence via ontology"
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/i-am-logger/pr4xis"
homepage = "https://github.com/i-am-logger/pr4xis"
# Cascades from `pr4xis-domains` being `publish = false` (cargo refuses
# to publish a crate whose dep tree contains an unpublished member).
publish = false

[[bin]]
name = "pr4xis"
path = "src/main.rs"
# Avoid output filename collision with the `pr4xis` lib at target/doc/pr4xis/.
# See https://github.com/rust-lang/cargo/issues/6313.
doc = false

[dependencies]
pr4xis = { version = "0.23.1", path = "../pr4xis" }
pr4xis-chat = { version = "0.22.0", path = "../chat" }
# `fetch` brings the `.prx` load gate + network substrate; `codegen` brings the
# OWL `read_owl → CodegenData` emit path so `pr4xis compile` can write OWL
# `.prx.gz` archives (alongside USC + WordNet, whose emit needs only `prx`). The
# CLI is a native binary, so `codegen`'s `xsd-parser` (which can't build for
# wasm32) is no constraint here.
pr4xis-domains = { version = "0.22.0", path = "../domains", features = ["fetch", "codegen"] }
# The content-address vocabulary (`ContentAddress`, `HashAlgorithm`,
# `hash_hex`) — the emit leg for lock re-pins and the SHA-256 verify leg the
# `decompile --fips` attestation speaks through.
pr4xis-runtime = { version = "0.23.1", path = "../pr4xis-runtime", features = ["emit"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[lints]
workspace = true

