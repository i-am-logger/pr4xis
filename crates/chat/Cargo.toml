[package]
name = "pr4xis-chat"
version = "0.22.0"
edition = "2024"
authors = ["i-am-logger"]
description = "Praxis chat engine — shared logic for CLI and WASM"
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/i-am-logger/pr4xis"
homepage = "https://github.com/i-am-logger/pr4xis"
# Cascades from `pr4xis-domains` being `publish = false` (cargo refuses
# to publish a crate whose dep tree contains an unpublished member).
publish = false

[dependencies]
pr4xis = { version = "0.22.0", path = "../pr4xis" }
pr4xis-domains = { version = "0.22.0", path = "../domains" }

[lints]
workspace = true

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "chat_benchmarks"
harness = false
