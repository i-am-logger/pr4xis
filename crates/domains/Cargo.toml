[package]
name = "pr4xis-domains"
version.workspace = true
edition = "2024"
authors = ["i-am-logger"]
description = "Applied domains — chess, calculator, elevator, legal, traffic, HTTP, games, math, physics, music, colors"
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/i-am-logger/pr4xis"
homepage = "https://github.com/i-am-logger/pr4xis"
# NOTE: the publish gate lives in release-plz.toml (`[[package]] name =
# "pr4xis-domains", publish = false`), NOT here. A `publish = false` in
# THIS manifest makes release-plz ignore the crate outright — it never
# versions or tags it, so a domains-only change (where nearly all praxis
# work lands) cuts no release at all (the bug that stranded domains at
# tag v0.21.0 while the workspace moved to 0.23.1). With the gate in
# release-plz.toml instead, release-plz versions + tags domains in
# lockstep with the workspace and only skips the `cargo publish` step.
#
# Crates.io publication is still blocked regardless: this crate's
# build-time `include_str!` of workspace files (praxis.toml, data/*)
# fails `cargo publish --verify` until the registered-source story
# (`praxis.toml` + `pr4xis update`) lands as a Rust ontology. So the
# release-plz gate + that technical floor together keep it off crates.io.

[dependencies]
# Runtime dep needs `std` only. The `codegen` feature (and its
# `xsd-parser` transitive, which can't build for wasm32 — `url`'s
# `from_file_path` is gated out there) is build-time + test-only: it's on
# the [build-dependencies] entry below and the [dev-dependencies] entry.
# Keeping it off the normal dep keeps `xsd-parser` out of the WASM graph
# (this crate is a WASM default-feature dependency — see the fetch
# gating notes below).
pr4xis = { path = "../pr4xis", default-features = false, features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1"
sha2 = "0.11"
# BLAKE3 (Aumasson et al. 2020) — the third strong digest the
# `artifact_identity::HashAlgorithm` enum declares, alongside SHA-256/512
# from `sha2`. `default-features = false` drops std + rayon; `pure` forces
# the portable pure-Rust implementation (no `cc`/assembly build script), so
# it builds in restricted environments (pre-commit hooks, wasm32) without a
# C toolchain and stays crates.io-publishable.
blake3 = { version = "1", default-features = false, features = ["pure"] }
hex = "0.4"
anyhow = "1"
hashbrown = "0.17"

# The runtime, with `emit`, so a loaded `.prx` ontology can be projected
# from a compiled praxis `Category` and materialized into a queryable
# `RuntimeOntology`. The `ComposedReasoner`
# (cognitive/linguistics/composed.rs) grounds each loaded RuntimeOntology's
# nodes into the English lexicon via the Lemon functor and answers
# "what is X" from the loaded gloss.
#
# WASM-safe: pr4xis-runtime + its deps (sha2, serde_ipld_dagcbor → cbor4ii,
# cid, ipld-core) all build for wasm32-unknown-unknown (verified: `cargo build
# -p pr4xis-runtime --features emit --target wasm32-unknown-unknown`). No
# feature-gating of the dependency is needed; the consuming `composed` module
# is `std`-gated only because pr4xis-runtime is a std crate (and the WASM build
# enables `std` via the `prx` feature anyway).
pr4xis-runtime = { path = "../pr4xis-runtime", features = ["emit"] }
# Distributed-slice registration substrate. The well-behaved-lens
# harness uses `#[linkme::distributed_slice]` to discover every
# registered lens at link time without a central list. Same crate
# already used inside pr4xis for axiom / functor / adjunction
# registration (Mascarenhas et al., Apache-2.0 / MIT,
# <https://github.com/dtolnay/linkme>).
linkme = "0.3"

# Canonical-form library substrate. Used by the
# `formal::meta::well_behaved_lens` module to canonicalize loaded
# sources prior to signature computation.
#
# - **quick-xml** (Tafryn et al., MIT, <https://github.com/tafia/quick-xml>)
#   — streaming pull parser used by the W3C XML Canonicalization 1.1
#   walker (Boyer & Marcy 2008).
# - **serde_json** (Tolnay, MIT/Apache-2.0,
#   <https://github.com/serde-rs/json>) — JSON value model used by
#   the RFC 8785 JSON Canonicalization Scheme (Rundgren, Jordan &
#   Erdtman 2020) emitter.
# - **unicode-normalization** (unicode-rs, MIT/Apache-2.0,
#   <https://github.com/unicode-rs/unicode-normalization>) —
#   Unicode TR #15 NFKC implementation (Davis & Whistler 2024).
quick-xml = { version = "0.40", features = ["serialize"] }
serde_json = "1"
unicode-normalization = "0.1"

# Network + compression — optional, behind the `fetch` feature. TLS uses
# rustls with the rustls-rustcrypto CryptoProvider; under the workspace's
# active feature set no `ring` / `cc` code path is enabled (`cargo tree
# --workspace -e build,normal --invert ring` is empty). Cargo.lock still
# names `ring` as a gated potential dep of rustls-webpki — the resolver
# declares it, it just doesn't activate the feature that pulls it.
# The fetch feature stays opt-in because flate2 + std-only I/O would
# otherwise pull into the WASM build (WASM depends on this crate with
# default features).
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"], optional = true }
rustls-rustcrypto = { version = "0.0.2-alpha", optional = true }
flate2 = { version = "1", optional = true }

# Zero-copy binary archival of the codegen interchange shape. rkyv
# serializes the owned mirror of `CodegenData<P>` to a content-addressed
# blob the runtime materializes without re-parsing the source format.
# Chosen over FlatBuffers / Cap'n Proto because it derives the schema
# from the Rust type (no IDL) and validates on access via `bytecheck`,
# so a corrupted/truncated blob fails closed. `alloc` feature only
# (this crate links `alloc`). Used by the OWL `.prx.gz` distribution
# envelope (`social::software::markup::xml::owl::prx`); optional and
# pulled in by the `fetch` feature alongside flate2 (the gzip layer),
# so it stays out of the WASM default-feature graph.
# Cite: Hill, D. *rkyv: zero-copy deserialization framework for Rust*,
# v0.8, MIT, <https://github.com/rkyv/rkyv>.
rkyv = { version = "0.8", default-features = false, features = ["alloc", "bytecheck"], optional = true }

[features]
default = ["std"]
# `std` enables I/O-dependent modules (hmi/report generator, hmi/explorer
# HTML writer, data_provisioning fetch, cognitive/linguistics WordNet XML
# loader). The categorical stack (ontologies + functors + axioms) runs
# no_std + alloc; per issue #91, only these 4 I/O surfaces need std.
std = ["pr4xis/std"]
# Build-time / test-only code-generation surface. Turns on `pr4xis`'s
# `codegen` feature so modules like
# `social::software::markup::xml::owl::owl_vocabulary` (OWL vocabulary →
# `pr4xis::codegen::CodegenData`) can reach `pr4xis::codegen`. Off the
# normal (WASM-facing) build because `pr4xis/codegen` pulls `xsd-parser`,
# which can't build for wasm32; build.rs and tests get it via the
# `[build-dependencies]` / `[dev-dependencies]` `codegen` entries.
codegen = ["std", "pr4xis/codegen"]
# `prx` enables the OWL `.prx.gz` *load* path (rkyv archival + RFC 1952
# gzip) without the network substrate. Both deps are pure-Rust and build
# for wasm32: rkyv with `alloc`+`bytecheck` only (no std-only features),
# and flate2's default backend is `miniz_oxide` (pure Rust) — no `libz-sys`
# / `zlib-ng` C backend in the resolved graph. Splitting it out of `fetch`
# lets the WASM runtime load a validated `.prx.gz` while keeping `ureq` /
# `rustls` (which do not compile to wasm32) off that build.
prx = ["std", "dep:rkyv", "dep:flate2"]
fetch = ["prx", "dep:ureq", "dep:rustls", "dep:rustls-rustcrypto"]
# Exposes parse/codec/axiom internals (otherwise `#[cfg(test)]`- or
# crate-private) to the workspace's own heavy-corpus test crate
# (`crates/praxis-corpus-tests`) and benches, so they can load a giant source
# ONCE under `cargo test`/`cargo bench` instead of re-parsing it per
# process-isolated nextest test. NOT a public API surface — it is gated on
# this feature precisely so it never reaches the normal/published build.
test-internals = ["prx"]

[build-dependencies]
# Statute codegen at build time. Reads workspace-root praxis.toml + praxis.lock,
# emits Rust modules under $OUT_DIR/<name>_codegen.rs for every Statute-kind
# source whose lock carries structural data. The crate's runtime tree then
# `include!`s those modules under `social::compliance::law::<name>::`.
pr4xis = { path = "../pr4xis", default-features = false, features = ["codegen"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1"
# BLAKE3 for the build-time mirror of the content-address identity gate
# (`build_helpers/agl.rs`) — same pure-Rust config as the main dependency.
blake3 = { version = "1", default-features = false, features = ["pure"] }

# Lints are inlined here (not inherited from `[workspace.lints]`) so the
# crate parses cleanly when unpacked standalone — e.g. crate2nix vendors
# each member into its own /nix/store path without the workspace root,
# and `cargo publish --verify` does the same in `target/package/`.
[lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_must_use = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[dev-dependencies]
# Tests under cognitive/linguistics + markup/xml/lmf exercise
# `pr4xis::codegen::wordnet::parse_wordnet_xml` directly. `codegen` is
# off the normal dep (it leaks `xsd-parser` into WASM), so unify it back
# in for test builds here.
pr4xis = { path = "../pr4xis", features = ["codegen"] }
# The runtime, with `emit`, so an integration test can project a real domain
# ontology into a `.prx` Archive and round-trip it through the runtime.
pr4xis-runtime = { path = "../pr4xis-runtime", features = ["emit"] }
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.11"
tempfile = "3"

[[bench]]
name = "ontology_benchmarks"
harness = false

# `.prx` two-layer compactness-breakdown measurement (was a `#[cfg(test)]`
# measurement in `uslm::corpus::prx`). Needs `prx` for the graph-faithful emit +
# rkyv layer serialization. Run with `cargo bench -p pr4xis-domains --features prx`.
[[bench]]
name = "prx_compactness"
harness = false
required-features = ["prx"]

# Distribution-artifact emitter (#256). Writes a `.prx.gz` per registered
# OWL vocabulary, round-trip-validating each through the fail-closed load
# gate. The release-gated CI `pages` job runs it into `pages/ontologies/`,
# publishing to both the GitHub release and Pages `/ontologies/`. Needs
# `fetch` (rkyv + gzip + load gate) and `codegen` (the read_owl emit path).
[[example]]
name = "emit_prx"
required-features = ["fetch", "codegen"]

# The ALL-SOURCES SOURCE round-trip (issue #15, STAGE 1): for every registered
# OWL/USC/WordNet source on disk, `hash(decompile(compile(source))) ==
# hash(source)`, plus the completeness-meter declared-vs-achieved cross-check.
# Needs `fetch` (the `.prx` load + decompile op) and `codegen` (the OWL
# `read_owl` emit path; USC + WordNet emit need only `prx`, pulled by `fetch`).
# Run it explicitly with `--features "fetch codegen"`; the same way CI exercises
# the `.prx` emit surface via the `emit_prx` example.
[[test]]
name = "prx_source_round_trip"
required-features = ["fetch", "codegen"]
