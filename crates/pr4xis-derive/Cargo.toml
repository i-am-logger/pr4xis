[package]
name = "pr4xis-derive"
version.workspace = true
edition = "2024"
authors = ["i-am-logger"]
description = "Derive macros for pr4xis ontology traits"
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/i-am-logger/pr4xis"
homepage = "https://pr4xis.dev"
keywords = ["ontology", "category-theory", "neurosymbolic", "pr4xis"]

[lib]
proc-macro = true

# Lints are inlined here (not inherited from `[workspace.lints]`) so the
# crate parses cleanly when unpacked standalone — e.g. crate2nix vendors
# each member into its own /nix/store path without the workspace root,
# and `cargo publish --verify` does the same in `target/package/`.
[lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_must_use = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"
