[package]
name = "pr4xis-runtime"
version.workspace = true
edition = "2024"
authors = ["i-am-logger"]
description = "The pr4xis runtime — load a .prx ontology as data, deserialize into the free category, rebind into the closed world; grounds only the hash primitive."
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/i-am-logger/pr4xis"
homepage = "https://pr4xis.dev"
keywords = ["ontology", "reasoning", "category-theory", "content-addressing", "knowledge-graph"]
categories = ["science", "mathematics", "algorithms"]

[features]
# `emit` bridges a compiled praxis ontology (a `Category`) into an `Archive` —
# the COMPILER half of the chrysalis. It deps `pr4xis` (the category model); the
# runtime KERNEL stays free of any compile-time coupling by default.
emit = ["dep:pr4xis"]

[dependencies]
sha2 = "0.11"
blake3 = { version = "1", default-features = false, features = ["pure"] }
pr4xis = { version = "0.28.0", path = "../pr4xis", optional = true }
serde = { version = "1", features = ["derive"] }
# DAG-CBOR — the deterministic, language-agnostic canonical encoding the content
# address is computed over (IPLD content-addressing requires a single canonical
# form; rkyv's layout is toolchain-bound and stays a local cache, never the
# address). Pure-Rust; builds for wasm32.
serde_ipld_dagcbor = "0.6"
# Zero-copy binary archival — the LOCAL cache/query lens over an `Archive`
# (`lens::archive_lens::ArchiveLens`), NOT the content address (that stays
# DAG-CBOR above). Same version + feature set pr4xis-domains pins for the OWL
# `.prx.gz` envelope, so the workspace stays on one rkyv. `alloc`+`bytecheck`
# only (no std-only features) — core+alloc-clean, builds for wasm32.
# Cite: Koloski, D. *rkyv: zero-copy deserialization framework for Rust*, v0.8,
# MIT, <https://github.com/rkyv/rkyv>.
rkyv = { version = "0.8", default-features = false, features = ["alloc", "bytecheck"] }

# Lints inlined (not inherited from `[workspace.lints]`) so the crate parses
# cleanly when unpacked standalone — crate2nix vendors each member into its own
# /nix/store path without the workspace root, and `cargo publish --verify` does
# the same in `target/package/`. Same convention as the other pr4xis crates.
[lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_must_use = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[dev-dependencies]
proptest = "1.11"
# Test-only activation of the already-optional `pr4xis` dependency above (line
# 22): the `#[pr4xis::praxis_value(...)]` constitution-coverage attribute used
# inside `#[cfg(test)]` modules needs it resolvable, but the crate must stay
# "free of any compile-time coupling by default" (see the `emit` feature
# comment) for anyone depending on this crate as a library. A dev-dependency
# entry activates the optional dep only for `cargo test`, not for downstream
# consumers or plain `cargo build`.
pr4xis = { version = "0.28.0", path = "../pr4xis" }
