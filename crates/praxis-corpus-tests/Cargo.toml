[package]
name = "praxis-corpus-tests"
version = "0.1.0"
edition = "2024"
publish = false
description = "Heavy-corpus producer/round-trip tests for praxis. These parse the multi-hundred-MB USC titles / WordNet corpora that are too large to re-parse per test. Run under `cargo test` (NOT nextest): all `#[test]`s in one test binary are threads in ONE process, so a `LazyLock` fixture parses each giant ONCE and every assertion shares it — the parse-once-immutable principle the .prx itself embodies. Excluded from the default workspace so this heavy lane never runs under `cargo test --workspace` / nextest; CI invokes it explicitly via `--manifest-path`."

[dependencies]
# The fixtures parse USLM with the domains reader and validate with the
# `uslm::axioms` structural validators (exposed by `test-internals`). The
# §1983 codegen-vs-runtime test reaches `pr4xis::codegen::uslm`, so `codegen`
# is on too.
pr4xis-domains = { path = "../domains", features = ["test-internals", "codegen"] }
# Direct access to the build-time codegen parse (`parse_uslm_str`) the
# runtime/codegen-agreement test compares against.
pr4xis = { path = "../pr4xis", features = ["codegen"] }
