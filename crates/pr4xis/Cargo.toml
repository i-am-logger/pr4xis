[package]
name = "pr4xis"
version = "0.15.0"
edition = "2024"
authors = ["i-am-logger"]
description = "Prove your domain is correct — ontology-driven rule enforcement with category theory, logical composition, and runtime state machines"
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/i-am-logger/pr4xis"
homepage = "https://github.com/i-am-logger/pr4xis"
keywords = ["ontology", "category-theory", "enforcement", "state-machine", "formal-methods"]

[features]
default = ["std", "archive"]
std = []
# Binary archival of the codegen interchange shape via rkyv. Needed at
# runtime to materialize a source's ontology from its `.rkyv` blob
# (zero-copy/fast, no re-parse of the original format) and at build time
# to emit those blobs. Implied by `codegen` (build.rs emits archives)
# and present in `default` (runtime loads them). A pure no_std consumer
# that takes neither keeps the archive surface — and rkyv — out entirely.
archive = ["dep:rkyv"]
codegen = ["std", "archive", "dep:quick-xml", "dep:serde", "dep:serde_json", "dep:xsd-parser"]

[dependencies]
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher"] }
linkme = "0.3"
paste = "1"
pr4xis-derive = { version = "0.1.0", path = "../pr4xis-derive" }
quick-xml = { version = "0.40", features = ["serialize"], optional = true }
# Zero-copy binary archival of the codegen interchange shape. rkyv
# serializes `OwnedCodegenData` to a content-addressed `.rkyv` blob that
# the runtime materializes without re-parsing the source format. Chosen
# over FlatBuffers / Cap'n Proto because it derives the schema from the
# Rust type (no IDL) and validates on access via `bytecheck`. no_std
# build: `alloc` feature only (pr4xis always links `alloc`).
rkyv = { version = "0.8", default-features = false, features = ["alloc", "bytecheck"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# XSD code-generation substrate. Cited: Bergmann, S. *xsd-parser:
# Rust code generator for XML schema files*, v1.5.2, MIT-licensed,
# <https://github.com/Bergmann89/xsd-parser>. Lifts the
# W3C-recommended XSD 1.1 grammar (Gao, Sperberg-McQueen &
# Thompson 2012) into typed Rust at build time. Used by the
# `codegen::uslm_schema` module to derive USLM ontology types
# from the LRC's USLM-1.0.18.xsd. Optional because the runtime
# never reaches it — only build.rs paths under the `codegen`
# feature do.
xsd-parser = { version = "1.5.2", optional = true }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.6"
