<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pr4xis — Axiomatic Intelligence</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid #21262d;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    header img { height: 40px; }
    header h1 { color: #58a6ff; font-size: 1.4em; font-weight: 600; }
    header span { color: #8b949e; font-size: 0.85em; }
    #status {
      padding: 0.3rem 0.8rem;
      border-radius: 12px;
      font-size: 0.75em;
      font-weight: 600;
      margin-left: auto;
    }
    .loading { background: #d29922; color: #0d1117; }
    .ready { background: #3fb950; color: #0d1117; }
    .error { background: #f85149; color: #0d1117; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 2rem 3rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .message {
      max-width: 80%;
      padding: 0.8rem 1.2rem;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      font-size: 0.95em;
    }
    .user { align-self: flex-end; background: #1f6feb; color: #fff; margin-top: 0.5rem; }
    .user::before { content: '→ '; opacity: 0.6; }
    .system { align-self: flex-start; background: #0d1f0d; border: 1px solid #238636; color: #e6edf3; }
    .system::before { content: '← '; opacity: 0.6; }
    .system.fallback { background: #161b22; border-color: #58a6ff; color: #79c0ff; font-style: italic; }
    .info { align-self: center; color: #8b949e; font-size: 0.8em; font-style: italic; }

    /* Trace: attached below each response, pulls down like accordion */
    .trace-toggle {
      align-self: flex-start; background: none; border: none; color: #484f58;
      font-size: 0.7em; cursor: pointer; padding: 0.2rem 0; margin-left: 0.5rem;
    }
    .trace-toggle:hover { color: #7ee787; }
    .trace-toggle.open { color: #7ee787; }
    .trace-panel {
      max-width: 100%; display: none; border-top: 1px solid #21262d; margin-top: 0.5em;
      font-family: monospace; font-size: 0.72em; color: #8b949e;
      white-space: pre-wrap; word-break: break-all; padding: 0.5rem 0;
    }
    .trace-panel.open { display: block; }
    .trace-panel .step { color: #8b949e; margin-left: 0.5em; }
    .trace-panel .step::before { content: '├─ '; color: #30363d; }
    .trace-panel .step:last-child::before { content: '└─ '; color: #30363d; }

    #input-area { padding: 1rem 2rem; border-top: 1px solid #21262d; display: flex; gap: 0.8rem; }
    #input {
      flex: 1; padding: 0.7rem 1rem; background: #161b22; border: 1px solid #30363d;
      border-radius: 8px; color: #c9d1d9; font-size: 1em; font-family: inherit; outline: none;
    }
    #input:focus { border-color: #58a6ff; }
    #input::placeholder { color: #484f58; }

    /* Tab bar */
    .tabs { display: flex; border-bottom: 1px solid #21262d; }
    .tab {
      padding: 0.6rem 1.5rem; background: none; border: none; border-bottom: 2px solid transparent;
      color: #8b949e; font-size: 0.9em; cursor: pointer; font-weight: 600;
    }
    .tab:hover { color: #c9d1d9; }
    .tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }
    .tab-content { display: none; flex: 1; overflow-y: auto; flex-direction: column; }
    .tab-content.active { display: flex; }

    /* pr4xis self-model page */
    #about { padding: 2rem 3rem; gap: 1rem; overflow-y: auto; }
    @media (max-width: 768px) { #about { padding: 1rem; } }
    .dash-summary {
      display: flex; gap: 1.5rem; flex-wrap: wrap; padding-bottom: 1rem; border-bottom: 1px solid #21262d;
    }
    .dash-stat { text-align: center; min-width: 90px; }
    .dash-stat .value { font-size: 2em; font-weight: 700; color: #58a6ff; }
    .dash-stat .label { font-size: 0.7em; color: #8b949e; text-transform: uppercase; }
    .section-title {
      font-size: 0.8em; font-weight: 700; color: #7ee787; text-transform: uppercase;
      letter-spacing: 0.06em; margin: 1.2rem 0 0.6rem;
    }
    .filter-box {
      width: 100%; padding: 0.5rem 1rem; background: #161b22; border: 1px solid #30363d;
      border-radius: 8px; color: #c9d1d9; font-size: 0.9em; outline: none; margin-bottom: 0.6rem;
    }
    .filter-box:focus { border-color: #58a6ff; }

    /* Flat source catalog — a responsive grid of cards, no nesting */
    .source-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.6rem;
    }
    .source-card {
      background: #161b22; border: 1px solid #21262d; border-radius: 10px;
      padding: 0.8rem 1rem; display: flex; flex-direction: column; gap: 0.35rem;
    }
    .source-card.loaded { border-color: #238636; }
    .source-card.available { opacity: 0.62; }
    .source-card .row { display: flex; align-items: center; gap: 0.5rem; }
    .source-card .name { font-weight: 600; color: #c9d1d9; font-size: 0.92em; }
    .source-card .kind { color: #8b949e; font-size: 0.72em; font-family: monospace; }
    .source-card .cite { color: #6e7681; font-size: 0.7em; font-style: italic; line-height: 1.35; }
    .source-card .counts { color: #8b949e; font-size: 0.72em; }
    .badge {
      display: inline-block; padding: 0.12rem 0.5rem; border-radius: 10px;
      font-size: 0.62em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .badge-loaded { background: #23863633; color: #3fb950; border: 1px solid #238636; }
    .badge-available { background: #6e768122; color: #8b949e; border: 1px solid #30363d; }
    .badge-staging { background: #1f6feb22; color: #58a6ff; border: 1px solid #1f6feb33; }
    .load-btn {
      margin-left: auto; padding: 0.3rem 0.9rem; background: #1f6feb; color: #fff; border: none;
      border-radius: 8px; font-size: 0.75em; font-weight: 600; cursor: pointer;
    }
    .load-btn:hover { background: #388bfd; }
    .load-btn:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }

    /* Substrate ontologies — flat filterable list, no DOLCE/domain tree */
    .ont-card {
      background: #161b22; border: 1px solid #21262d; border-radius: 8px;
      padding: 0.55rem 0.9rem; display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap;
    }
    .ont-card .name { font-weight: 600; color: #c9d1d9; font-size: 0.85em; }
    .ont-card .domain { color: #484f58; font-size: 0.68em; font-family: monospace; }
    .ont-card .counts { color: #8b949e; font-size: 0.7em; margin-left: auto; }
    .ont-list { display: flex; flex-direction: column; gap: 0.3rem; }

    #send {
      padding: 0.7rem 1.5rem; background: #238636; color: #fff; border: none; border-radius: 8px;
      font-size: 1em; cursor: pointer; font-weight: 600;
    }
    #send:hover { background: #2ea043; }
    #send:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <img src="./praxis-logo-dark.jpg" alt="Pr4xis" onerror="this.style.display='none'">
    <h1>Pr4xis</h1>
    <span>Axiomatic intelligence — runs entirely in your browser</span>
    <div id="status" class="loading">Loading...</div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="about">pr4xis</button>
    <button class="tab" data-tab="chat-tab">Chat</button>
  </div>

  <div id="chat-tab" class="tab-content">
    <div id="chat">
      <div class="message info">Loading…</div>
    </div>
  </div>

  <div id="about" class="tab-content active">
    <div class="message info">Loading self-model…</div>
  </div>

  <div id="input-area" style="display:none">
    <input type="text" id="input" placeholder="Ask something... (try: is a dog a mammal?)" disabled>
    <button id="send" disabled>Send</button>
  </div>

  <script type="module">
    import init, { Pr4xis } from './pkg/pr4xis_wasm.js';

    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const status = document.getElementById('status');

    let pr4xis = null;

    function addMessage(text, cls) {
      const div = document.createElement('div');
      div.className = `message ${cls}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    // Generic pipeline trace: render each step in order, colored by its
    // status field. No hardcoded ontology names — the trace is whatever
    // the engine reports.
    function addTraceAccordion(trace) {
      const btn = document.createElement('button');
      btn.className = 'trace-toggle';
      btn.textContent = '▶ pipeline';

      const panel = document.createElement('div');
      panel.className = 'trace-panel';

      for (const part of trace.split(' | ')) {
        const fields = part.split(':');
        const row = document.createElement('div');
        row.className = 'step';
        if (fields.length >= 4) {
          const st = fields[0].trim();
          const ontology = fields[1].trim();
          const action = fields[2].trim();
          const detail = fields.slice(3).join(':').trim();
          const color = st === 'warn' ? '#d29922' : st === 'err' ? '#f85149' : '#8b949e';
          const mk = (t, weight) => { const s = document.createElement('span'); s.style.color = color; if (weight) s.style.fontWeight = weight; s.textContent = t; return s; };
          row.appendChild(mk(ontology, '600'));
          row.appendChild(mk(` → ${action}: `));
          row.appendChild(mk(detail));
        } else {
          row.textContent = part;
        }
        panel.appendChild(row);
      }

      btn.addEventListener('click', () => {
        const isOpen = panel.classList.toggle('open');
        btn.classList.toggle('open', isOpen);
        btn.textContent = isOpen ? '▼ pipeline' : '▶ pipeline';
        if (isOpen) requestAnimationFrame(() => panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }));
      });

      return { btn, panel };
    }

    async function initialize() {
      try {
        await init();
        pr4xis = new Pr4xis();
        status.textContent = `${pr4xis.concept_count().toLocaleString()} concepts`;
        status.className = 'ready';
        addMessage(
          `pr4xis — axiomatic intelligence\n` +
          `  ${pr4xis.concept_count().toLocaleString()} concepts, ${pr4xis.word_count().toLocaleString()} words\n` +
          `  running entirely in your browser — no server`,
          'info'
        );
        await renderDashboard();
        input.disabled = false;
        send.disabled = false;
        input.focus();
      } catch (e) {
        status.textContent = 'Error';
        status.className = 'error';
        status.title = String(e);
        const errMsg = `Failed to load: ${e}\n\n${e.stack || ''}`;
        addMessage(errMsg, 'info');
        document.getElementById('about').innerHTML =
          `<div class="message info" style="white-space:pre-wrap;color:#f85149;">${errMsg}</div>`;
        console.error('pr4xis init error:', e);
      }
    }

    function handleSend() {
      const text = input.value.trim();
      if (!text || !pr4xis) return;
      addMessage(text, 'user');
      input.value = '';
      const t0 = performance.now();
      const raw = pr4xis.chat(text);
      const elapsed = performance.now() - t0;
      try {
        const result = JSON.parse(raw);
        const dur = elapsed < 1 ? `${(elapsed * 1000).toFixed(0)}µs` : `${elapsed.toFixed(1)}ms`;
        const msgDiv = addMessage(result.response, result.from_ontology === false ? 'system fallback' : 'system');
        if (result.trace) {
          const { btn, panel } = addTraceAccordion(result.trace);
          msgDiv.appendChild(btn);
          msgDiv.appendChild(panel);
        }
        const statsEl = document.createElement('div');
        statsEl.style.cssText = 'margin-top:0.5em; font-size:0.7em; color:#484f58; border-top:1px solid #21262d; padding-top:0.3em;';
        const ontCount = Array.isArray(result.ontologies) ? result.ontologies.length : '?';
        statsEl.textContent = `${ontCount} ontologies · ${dur} · in-browser`;
        msgDiv.appendChild(statsEl);
      } catch {
        addMessage(raw, 'system');
      }
      input.focus();
    }

    // Tab switching
    const inputArea = document.getElementById('input-area');
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab).classList.add('active');
        inputArea.style.display = tab.dataset.tab === 'chat-tab' ? '' : 'none';
      });
    });

    // Fetch a source's rkyv archive and hand it to the runtime
    // (Nelson-Narens control: Available → Loaded).
    async function loadSource(name, url, btn) {
      btn.disabled = true;
      btn.textContent = 'Loading…';
      try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`fetch ${url}: ${resp.status}`);
        const bytes = new Uint8Array(await resp.arrayBuffer());
        pr4xis.load_source(name, bytes);   // throws on a bad archive (bytecheck)
        await renderDashboard();           // re-observe: the source is now Loaded
      } catch (e) {
        btn.disabled = false;
        btn.textContent = 'Retry';
        console.error('load_source failed:', e);
        status.title = String(e);
      }
    }

    // The self-model page: a flat catalog of every registered source
    // (Loaded vs Available) + the substrate ontologies. Rendered purely
    // from what the runtime reports — no source-specific knowledge here.
    async function renderDashboard() {
      const dash = document.getElementById('about');
      let data, archives;
      try {
        data = JSON.parse(pr4xis.self_describe());
        archives = JSON.parse(pr4xis.available_archives()).archives || [];
      } catch (e) {
        dash.innerHTML = `<div class="message info" style="color:#f85149;">self_describe parse error: ${e}</div>`;
        return;
      }
      const archiveUrl = new Map(archives.map(a => [a.name, a.url]));
      const sources = data.sources || [];
      const ontologies = data.ontologies || [];

      dash.innerHTML = '';

      // Hero
      const hero = document.createElement('div');
      hero.style.cssText = 'display:flex; align-items:center; gap:1rem; padding-bottom:1rem;';
      hero.innerHTML =
        '<img src="./praxis-logo-dark.jpg" alt="pr4xis" style="height:64px; border-radius:8px;" onerror="this.style.display=\'none\'">' +
        '<div>' +
          '<div style="font-size:1.8em; font-weight:700; color:#58a6ff;">pr4xis</div>' +
          `<div style="color:#8b949e; font-size:0.9em;">Axiomatic intelligence — self-model · ${data.awareness || ''} — running entirely in your browser</div>` +
          '<a href="https://github.com/i-am-logger/pr4xis" target="_blank" rel="noopener" style="color:#58a6ff; font-size:0.8em; text-decoration:none;">github.com/i-am-logger/pr4xis</a>' +
        '</div>';
      dash.appendChild(hero);

      // Summary stats — all derived from the self-model
      let wasmSize = '?';
      try {
        const resp = await fetch('./pkg/pr4xis_wasm_bg.wasm', { method: 'HEAD' });
        const b = parseInt(resp.headers.get('content-length') || '0', 10);
        if (b > 0) wasmSize = (b / (1024 * 1024)).toFixed(1) + ' MB';
      } catch { /* offline */ }
      const summary = document.createElement('div');
      summary.className = 'dash-summary';
      [
        { value: `${data.loaded_source_count ?? 0}/${data.source_count ?? sources.length}`, label: 'sources loaded' },
        { value: (data.total_concepts ?? 0).toLocaleString(), label: 'entities' },
        { value: (data.total_morphisms ?? 0).toLocaleString(), label: 'morphisms' },
        { value: ontologies.length, label: 'ontologies' },
        { value: wasmSize, label: 'wasm binary' },
        { value: data.version || '', label: 'version' },
      ].forEach(({ value, label }) => {
        const stat = document.createElement('div');
        stat.className = 'dash-stat';
        stat.innerHTML = `<div class="value">${value}</div><div class="label">${label}</div>`;
        summary.appendChild(stat);
      });
      dash.appendChild(summary);

      // ---- Sources catalog (the knowledge boundary) ----
      const srcTitle = document.createElement('div');
      srcTitle.className = 'section-title';
      srcTitle.textContent = 'Sources — loaded · available to load';
      dash.appendChild(srcTitle);

      const srcFilter = document.createElement('input');
      srcFilter.className = 'filter-box';
      srcFilter.placeholder = 'Filter sources…';
      dash.appendChild(srcFilter);

      const grid = document.createElement('div');
      grid.className = 'source-grid';
      dash.appendChild(grid);

      // Loaded first, then available; stable by name within each.
      const ordered = [...sources].sort((a, b) =>
        (a.status === b.status ? a.name.localeCompare(b.name) : (a.status === 'loaded' ? -1 : 1)));

      for (const s of ordered) {
        const loaded = s.status === 'loaded';
        const card = document.createElement('div');
        card.className = `source-card ${loaded ? 'loaded' : 'available'}`;

        const top = document.createElement('div');
        top.className = 'row';
        const nm = document.createElement('span');
        nm.className = 'name';
        nm.textContent = s.name;
        top.appendChild(nm);
        const badge = document.createElement('span');
        badge.className = `badge ${loaded ? 'badge-loaded' : 'badge-available'}`;
        badge.textContent = s.status;
        top.appendChild(badge);
        if (loaded && s.staging) {
          const sb = document.createElement('span');
          sb.className = 'badge badge-staging';
          sb.textContent = s.staging;
          top.appendChild(sb);
        }
        // Load action only where an archive actually exists to fetch.
        if (!loaded && archiveUrl.has(s.name)) {
          const btn = document.createElement('button');
          btn.className = 'load-btn';
          btn.textContent = 'Load';
          btn.addEventListener('click', () => loadSource(s.name, archiveUrl.get(s.name), btn));
          top.appendChild(btn);
        }
        card.appendChild(top);

        const kind = document.createElement('div');
        kind.className = 'kind';
        kind.textContent = `${s.kind || ''}${s.version ? ' · ' + s.version : ''}`;
        card.appendChild(kind);

        if (loaded && (s.concepts || s.morphisms)) {
          const counts = document.createElement('div');
          counts.className = 'counts';
          counts.textContent = `${(s.concepts || 0).toLocaleString()} entities · ${(s.morphisms || 0).toLocaleString()} morphisms`;
          card.appendChild(counts);
        }

        if (s.source) {
          const cite = document.createElement('div');
          cite.className = 'cite';
          cite.textContent = s.source;
          card.appendChild(cite);
        }
        grid.appendChild(card);
      }

      srcFilter.addEventListener('input', () => {
        const q = srcFilter.value.toLowerCase();
        grid.querySelectorAll('.source-card').forEach(c =>
          c.style.display = c.textContent.toLowerCase().includes(q) ? '' : 'none');
      });

      // ---- Substrate ontologies (flat, filterable) ----
      if (ontologies.length) {
        const ontTitle = document.createElement('div');
        ontTitle.className = 'section-title';
        ontTitle.textContent = `Reasoning substrate — ${ontologies.length} ontologies`;
        dash.appendChild(ontTitle);

        const ontFilter = document.createElement('input');
        ontFilter.className = 'filter-box';
        ontFilter.placeholder = 'Filter ontologies…';
        dash.appendChild(ontFilter);

        const list = document.createElement('div');
        list.className = 'ont-list';
        dash.appendChild(list);

        for (const o of [...ontologies].sort((a, b) => a.name.localeCompare(b.name))) {
          const card = document.createElement('div');
          card.className = 'ont-card';
          const concepts = Array.isArray(o.concepts) ? o.concepts.length : (o.concepts || 0);
          card.innerHTML =
            `<span class="name">${o.name}</span>` +
            `<span class="domain">${o.domain || ''}</span>` +
            `<span class="counts">${concepts.toLocaleString()} entities · ${(o.morphisms || 0).toLocaleString()} morphisms</span>`;
          list.appendChild(card);
        }
        ontFilter.addEventListener('input', () => {
          const q = ontFilter.value.toLowerCase();
          list.querySelectorAll('.ont-card').forEach(c =>
            c.style.display = c.textContent.toLowerCase().includes(q) ? '' : 'none');
        });
      }
    }

    send.addEventListener('click', handleSend);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSend(); });

    initialize();
  </script>
</body>
</html>
