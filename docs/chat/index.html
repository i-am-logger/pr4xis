<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pr4xis — Axiomatic Intelligence</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid #21262d;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    header img { height: 40px; }
    header h1 { color: #58a6ff; font-size: 1.4em; font-weight: 600; }
    header span { color: #8b949e; font-size: 0.85em; }
    #status {
      padding: 0.3rem 0.8rem;
      border-radius: 12px;
      font-size: 0.75em;
      font-weight: 600;
      margin-left: auto;
    }
    .loading { background: #d29922; color: #0d1117; }
    .ready { background: #3fb950; color: #0d1117; }
    .error { background: #f85149; color: #0d1117; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 2rem 3rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .message {
      max-width: 80%;
      padding: 0.8rem 1.2rem;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      font-size: 0.95em;
    }
    .user { align-self: flex-end; background: #1f6feb; color: #fff; margin-top: 0.5rem; }
    .user::before { content: '→ '; opacity: 0.6; }
    .system { align-self: flex-start; background: #0d1f0d; border: 1px solid #238636; color: #e6edf3; }
    .system::before { content: '← '; opacity: 0.6; }
    .system.fallback { background: #161b22; border-color: #58a6ff; color: #79c0ff; font-style: italic; }
    .system.abstained { background: #1c1812; border-color: #d29922; color: #e3b341; }
    .info { align-self: center; color: #8b949e; font-size: 0.8em; font-style: italic; }

    /* Abstention affordance: when the engine can't answer, it names what to load. */
    .abstain-actions { display: flex; align-items: center; gap: 0.4em; flex-wrap: wrap; margin-top: 0.5em; font-size: 0.85em; }
    .abstain-actions .terms { color: #8b949e; }
    .abstain-load {
      background: none; border: 1px solid #d29922; color: #e3b341; border-radius: 6px;
      padding: 0.2rem 0.7rem; font-size: 0.95em; cursor: pointer;
    }
    .abstain-load:hover { background: #d2992222; }

    /* Trace: attached below each response, pulls down like accordion */
    .trace-toggle {
      align-self: flex-start; background: none; border: none; color: #484f58;
      font-size: 0.7em; cursor: pointer; padding: 0.2rem 0; margin-left: 0.5rem;
    }
    .trace-toggle:hover { color: #7ee787; }
    .trace-toggle.open { color: #7ee787; }
    .trace-panel {
      max-width: 100%; display: none; border-top: 1px solid #21262d; margin-top: 0.5em;
      font-family: monospace; font-size: 0.72em; color: #8b949e;
      white-space: pre-wrap; word-break: break-all; padding: 0.5rem 0;
    }
    .trace-panel.open { display: block; }
    .trace-panel .step { color: #8b949e; margin-left: 0.5em; }
    .trace-panel .step::before { content: '├─ '; color: #30363d; }
    .trace-panel .step:last-child::before { content: '└─ '; color: #30363d; }

    #input-area { padding: 1rem 2rem; border-top: 1px solid #21262d; display: flex; gap: 0.8rem; }
    #input {
      flex: 1; padding: 0.7rem 1rem; background: #161b22; border: 1px solid #30363d;
      border-radius: 8px; color: #c9d1d9; font-size: 1em; font-family: inherit; outline: none;
    }
    #input:focus { border-color: #58a6ff; }
    #input::placeholder { color: #484f58; }

    /* Tab bar */
    .tabs { display: flex; border-bottom: 1px solid #21262d; }
    .tab {
      padding: 0.6rem 1.5rem; background: none; border: none; border-bottom: 2px solid transparent;
      color: #8b949e; font-size: 0.9em; cursor: pointer; font-weight: 600;
    }
    .tab:hover { color: #c9d1d9; }
    .tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }
    .tab-content { display: none; flex: 1; overflow-y: auto; flex-direction: column; }
    .tab-content.active { display: flex; }

    /* pr4xis self-model page */
    #about { padding: 2rem 3rem; gap: 1rem; overflow-y: auto; }
    @media (max-width: 768px) { #about { padding: 1rem; } }
    .dash-summary {
      display: flex; gap: 1.5rem; flex-wrap: wrap; padding-bottom: 1rem; border-bottom: 1px solid #21262d;
    }
    .dash-stat { text-align: center; min-width: 90px; }
    .dash-stat .value { font-size: 2em; font-weight: 700; color: #58a6ff; }
    .dash-stat .label { font-size: 0.7em; color: #8b949e; text-transform: uppercase; }
    .section-title {
      font-size: 0.8em; font-weight: 700; color: #7ee787; text-transform: uppercase;
      letter-spacing: 0.06em; margin: 1.2rem 0 0.6rem;
    }
    .filter-box {
      width: 100%; padding: 0.5rem 1rem; background: #161b22; border: 1px solid #30363d;
      border-radius: 8px; color: #c9d1d9; font-size: 0.9em; outline: none; margin-bottom: 0.6rem;
    }
    .filter-box:focus { border-color: #58a6ff; }

    /* Flat source catalog — a responsive grid of cards, no nesting */
    .source-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.6rem;
    }
    .source-card {
      background: #161b22; border: 1px solid #21262d; border-radius: 10px;
      padding: 0.8rem 1rem; display: flex; flex-direction: column; gap: 0.35rem;
    }
    .source-card.loaded { border-color: #238636; }
    .source-card.available { opacity: 0.62; }
    .source-card .row { display: flex; align-items: center; gap: 0.5rem; }
    .source-card .name { font-weight: 600; color: #c9d1d9; font-size: 0.92em; }
    .source-card .kind { color: #8b949e; font-size: 0.72em; font-family: monospace; }
    .source-card .cite { color: #6e7681; font-size: 0.7em; font-style: italic; line-height: 1.35; }
    .source-card .counts { color: #8b949e; font-size: 0.72em; }
    .badge {
      display: inline-block; padding: 0.12rem 0.5rem; border-radius: 10px;
      font-size: 0.62em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .badge-loaded { background: #23863633; color: #3fb950; border: 1px solid #238636; }
    .badge-available { background: #6e768122; color: #8b949e; border: 1px solid #30363d; }
    .badge-staging { background: #1f6feb22; color: #58a6ff; border: 1px solid #1f6feb33; }
    .load-btn {
      margin-left: auto; padding: 0.3rem 0.9rem; background: #1f6feb; color: #fff; border: none;
      border-radius: 8px; font-size: 0.75em; font-weight: 600; cursor: pointer;
      transition: background 0.15s;
    }
    .load-btn:hover { background: #388bfd; }
    .load-btn:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }

    /* Two-phase load progress (download → materialize) */
    .progress { margin-top: 0.5rem; display: flex; flex-direction: column; gap: 0.3rem; }
    .progress-head {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 0.68em; color: #8b949e;
    }
    .progress-phase { font-weight: 600; color: #58a6ff; }
    .progress-track {
      height: 6px; background: #0d1117; border: 1px solid #21262d; border-radius: 6px; overflow: hidden;
    }
    /* Determinate (download): smooth gradient fill that grows by % */
    .progress-fill {
      height: 100%; width: 0%; border-radius: 6px;
      background: linear-gradient(90deg, #1f6feb, #58a6ff);
      transition: width 0.18s ease-out;
    }
    /* Indeterminate (parsing): a sweep that slides while the parser runs */
    .progress-fill.indeterminate {
      width: 40%; background: linear-gradient(90deg, transparent, #58a6ff, transparent);
      animation: sweep 1.1s ease-in-out infinite;
    }
    @keyframes sweep {
      0% { margin-left: -40%; } 100% { margin-left: 100%; }
    }
    .progress.done .progress-fill {
      background: linear-gradient(90deg, #238636, #3fb950); width: 100% !important;
      animation: none; margin-left: 0;
    }
    .progress-err { color: #f85149; }

    /* Substrate ontologies — flat filterable list, no DOLCE/domain tree */
    .ont-card {
      background: #161b22; border: 1px solid #21262d; border-radius: 8px;
      padding: 0.55rem 0.9rem; display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap;
    }
    .ont-card .name { font-weight: 600; color: #c9d1d9; font-size: 0.85em; }
    .ont-card .domain { color: #484f58; font-size: 0.68em; font-family: monospace; }
    .ont-card .counts { color: #8b949e; font-size: 0.7em; margin-left: auto; }
    .ont-list { display: flex; flex-direction: column; gap: 0.3rem; }

    #send {
      padding: 0.7rem 1.5rem; background: #238636; color: #fff; border: none; border-radius: 8px;
      font-size: 1em; cursor: pointer; font-weight: 600;
    }
    #send:hover { background: #2ea043; }
    #send:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <img src="./praxis-logo-dark.jpg" alt="Pr4xis" onerror="this.style.display='none'">
    <h1>Pr4xis</h1>
    <span>Axiomatic intelligence — runs entirely in your browser</span>
    <div id="status" class="loading">Loading...</div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="about">pr4xis</button>
    <button class="tab" data-tab="chat-tab">Chat</button>
  </div>

  <div id="chat-tab" class="tab-content">
    <div id="chat">
      <div class="message info">Loading…</div>
    </div>
  </div>

  <div id="about" class="tab-content active">
    <div class="message info">Loading self-model…</div>
  </div>

  <div id="input-area" style="display:none">
    <input type="text" id="input" placeholder="Ask something... (try: is a dog a mammal?)" disabled>
    <button id="send" disabled>Send</button>
  </div>

  <script type="module">
    // pr4xis runs entirely in a Web Worker, so downloading + parsing a
    // large statute never freezes the UI. The main thread is pure
    // presentation; every engine call is an async message.
    const worker = new Worker('./worker.js', { type: 'module' });
    let nextRpcId = 1;
    const pending = new Map();
    worker.onmessage = (e) => {
      const m = e.data;
      const p = pending.get(m.id);
      if (!p) return;
      if (m.status === 'progress') { if (p.onProgress) p.onProgress(m); return; }
      pending.delete(m.id);
      if (m.status === 'ok') p.resolve(m.payload);
      else p.reject(new Error(m.payload));
    };
    worker.onerror = (e) => console.error('worker error:', e.message || e);
    function call(type, args, onProgress) {
      const id = nextRpcId++;
      return new Promise((resolve, reject) => {
        pending.set(id, { resolve, reject, onProgress });
        worker.postMessage({ id, type, args: args || {} });
      });
    }

    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const status = document.getElementById('status');

    let pr4xisMeta = { concept_count: 0, word_count: 0 };

    function addMessage(text, cls) {
      const div = document.createElement('div');
      div.className = `message ${cls}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    // Generic pipeline trace: render each step in order, colored by its
    // status field. No hardcoded ontology names — the trace is whatever
    // the engine reports.
    function addTraceAccordion(trace) {
      const btn = document.createElement('button');
      btn.className = 'trace-toggle';
      btn.textContent = '▶ pipeline';

      const panel = document.createElement('div');
      panel.className = 'trace-panel';

      for (const part of trace.split(' | ')) {
        const fields = part.split(':');
        const row = document.createElement('div');
        row.className = 'step';
        if (fields.length >= 4) {
          const st = fields[0].trim();
          const ontology = fields[1].trim();
          const action = fields[2].trim();
          const detail = fields.slice(3).join(':').trim();
          const color = st === 'warn' ? '#d29922' : st === 'err' ? '#f85149' : '#8b949e';
          const mk = (t, weight) => { const s = document.createElement('span'); s.style.color = color; if (weight) s.style.fontWeight = weight; s.textContent = t; return s; };
          row.appendChild(mk(ontology, '600'));
          row.appendChild(mk(` → ${action}: `));
          row.appendChild(mk(detail));
        } else {
          row.textContent = part;
        }
        panel.appendChild(row);
      }

      btn.addEventListener('click', () => {
        const isOpen = panel.classList.toggle('open');
        btn.classList.toggle('open', isOpen);
        btn.textContent = isOpen ? '▼ pipeline' : '▶ pipeline';
        if (isOpen) requestAnimationFrame(() => panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }));
      });

      return { btn, panel };
    }

    async function initialize() {
      try {
        pr4xisMeta = await call('init');
        status.textContent = `${pr4xisMeta.concept_count.toLocaleString()} concepts`;
        status.className = 'ready';
        addMessage(
          `pr4xis — axiomatic intelligence\n` +
          `  ${pr4xisMeta.concept_count.toLocaleString()} concepts, ${pr4xisMeta.word_count.toLocaleString()} words\n` +
          `  running in a Web Worker — no server, UI stays responsive`,
          'info'
        );
        await renderDashboard();
        input.disabled = false;
        send.disabled = false;
        input.focus();
      } catch (e) {
        status.textContent = 'Error';
        status.className = 'error';
        status.title = String(e);
        const errMsg = `Failed to load: ${e}\n\n${e.stack || ''}`;
        addMessage(errMsg, 'info');
        document.getElementById('about').innerHTML =
          `<div class="message info" style="white-space:pre-wrap;color:#f85149;">${errMsg}</div>`;
        console.error('pr4xis init error:', e);
      }
    }

    async function handleSend() {
      const text = input.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      input.value = '';
      const t0 = performance.now();
      let raw;
      try {
        raw = await call('chat', { input: text });
      } catch (e) {
        addMessage(`error: ${e}`, 'info');
        return;
      }
      const elapsed = performance.now() - t0;
      try {
        const result = JSON.parse(raw);
        const dur = elapsed < 1 ? `${(elapsed * 1000).toFixed(0)}µs` : `${elapsed.toFixed(1)}ms`;
        const msgDiv = addMessage(result.response, result.from_ontology === false ? 'system fallback' : 'system');
        if (result.trace) {
          const { btn, panel } = addTraceAccordion(result.trace);
          msgDiv.appendChild(btn);
          msgDiv.appendChild(panel);
        }
        // Abstention (doc §4.1): the engine couldn't answer and NAMES the
        // surfaces it doesn't know — turn that into "load it?" rather than a
        // dead end. The typed outcome crosses the wire; we don't sniff the text.
        if (result.outcome === 'abstained' && Array.isArray(result.unresolved) && result.unresolved.length) {
          msgDiv.classList.add('abstained');
          const terms = result.unresolved;
          const actions = document.createElement('div');
          actions.className = 'abstain-actions';
          const label = document.createElement('span');
          label.className = 'terms';
          label.textContent = `not loaded: ${terms.join(', ')}`;
          const loadBtn = document.createElement('button');
          loadBtn.className = 'abstain-load';
          loadBtn.textContent = 'load a source →';
          loadBtn.addEventListener('click', () => {
            document.querySelector('.tab[data-tab="about"]').click();
            const f = document.getElementById('src-filter');
            if (f) {
              f.value = terms[0];
              f.dispatchEvent(new Event('input'));
              // don't strand the user on an empty grid if the term matched no source
              const grid = f.parentElement.querySelector('.source-grid');
              const anyVisible = grid && [...grid.children].some(c => c.style.display !== 'none');
              if (!anyVisible) { f.value = ''; f.dispatchEvent(new Event('input')); }
              f.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          });
          actions.appendChild(label);
          actions.appendChild(loadBtn);
          msgDiv.appendChild(actions);
        }

        const statsEl = document.createElement('div');
        statsEl.style.cssText = 'margin-top:0.5em; font-size:0.7em; color:#484f58; border-top:1px solid #21262d; padding-top:0.3em;';
        const ontCount = Array.isArray(result.ontologies) ? result.ontologies.length : '?';
        statsEl.textContent = `${ontCount} ontologies · ${dur} · in-browser`;
        msgDiv.appendChild(statsEl);
      } catch {
        addMessage(raw, 'system');
      }
      input.focus();
    }

    // Tab switching
    const inputArea = document.getElementById('input-area');
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab).classList.add('active');
        inputArea.style.display = tab.dataset.tab === 'chat-tab' ? '' : 'none';
      });
    });

    const fmtMB = b => (b / (1024 * 1024)).toFixed(b < 1024 * 1024 ? 2 : 1) + ' MB';

    // Download a source's authoritative USLM XML (streaming, with a real
    // progress bar), then parse it into a live UsCode (Nelson-Narens
    // control: Available → Loaded). Two visible phases: Downloading →
    // Materializing.
    async function loadSource(name, url, totalHint, card, topRow) {
      const btn = topRow.querySelector('.load-btn');
      if (btn) btn.remove();

      const prog = document.createElement('div');
      prog.className = 'progress';
      prog.innerHTML =
        '<div class="progress-head"><span class="progress-phase">Downloading…</span>' +
        '<span class="progress-detail"></span></div>' +
        '<div class="progress-track"><div class="progress-fill"></div></div>';
      card.appendChild(prog);
      const phase = prog.querySelector('.progress-phase');
      const detail = prog.querySelector('.progress-detail');
      const fill = prog.querySelector('.progress-fill');

      try {
        // The worker downloads + parses; we just render the progress it
        // posts. The parse runs off the main thread, so the bar keeps
        // animating and the page stays responsive even for a big title.
        await call('load', { name, url, totalHint }, (m) => {
          if (m.phase === 'download') {
            const total = m.total || totalHint || 0;
            if (total) {
              const pct = Math.min(100, Math.round((m.received / total) * 100));
              fill.style.width = pct + '%';
              detail.textContent = `${fmtMB(m.received)} / ${fmtMB(total)} · ${pct}%`;
            } else {
              detail.textContent = fmtMB(m.received);
            }
          } else if (m.phase === 'parse') {
            phase.textContent = 'Materializing…';
            detail.textContent = `${fmtMB(m.received)} · parsing into a live ontology`;
            fill.classList.add('indeterminate');
            fill.style.width = '';
          }
        });

        prog.classList.add('done');
        phase.textContent = 'Loaded';
        detail.textContent = '';
        await new Promise(r => setTimeout(r, 280));
        await renderDashboard();          // re-observe: the source is now Loaded
      } catch (e) {
        prog.classList.add('progress-err');
        phase.textContent = 'Failed';
        detail.classList.add('progress-err');
        detail.textContent = String(e).slice(0, 90);
        console.error('load_source failed:', e);
        const retry = document.createElement('button');
        retry.className = 'load-btn';
        retry.textContent = 'Retry';
        retry.addEventListener('click', () => { prog.remove(); loadSource(name, url, totalHint, card, topRow); });
        topRow.appendChild(retry);
      }
    }

    // Load a registered OWL vocabulary via one of its two routes — the
    // hash-validated `.prx.gz` distribution envelope or the authoritative
    // `.owl` source. The two paths share UI; only the worker RPC differs.
    // `kind` is 'prx' or 'source' — drives the RPC and the response decoder
    // (binary ArrayBuffer for .prx.gz; text for .owl).
    async function loadOntology(kind, meta, card, topRow) {
      const rpc = kind === 'prx' ? 'load_prx' : 'load_owl_source';
      const url = kind === 'prx' ? meta.prx_url : meta.source_url;
      const phaseLabel = kind === 'prx' ? 'Loading .prx' : 'Loading source';
      // Take both ontology buttons offline for the duration of the load —
      // the worker holds one ontology by name, so a second concurrent
      // load on the same row would race the install.
      for (const b of topRow.querySelectorAll('.load-btn')) b.remove();

      const prog = document.createElement('div');
      prog.className = 'progress';
      prog.innerHTML =
        `<div class="progress-head"><span class="progress-phase">${phaseLabel}…</span>` +
        '<span class="progress-detail"></span></div>' +
        '<div class="progress-track"><div class="progress-fill"></div></div>';
      card.appendChild(prog);
      const phase = prog.querySelector('.progress-phase');
      const detail = prog.querySelector('.progress-detail');
      const fill = prog.querySelector('.progress-fill');

      try {
        await call(rpc, { name: meta.name, version: meta.version, url }, (m) => {
          if (m.phase === 'download') {
            const total = m.total || 0;
            if (total) {
              const pct = Math.min(100, Math.round((m.received / total) * 100));
              fill.style.width = pct + '%';
              detail.textContent = `${fmtMB(m.received)} / ${fmtMB(total)} · ${pct}%`;
            } else {
              detail.textContent = fmtMB(m.received);
            }
          } else if (m.phase === 'parse') {
            phase.textContent = 'Materializing…';
            detail.textContent = `${fmtMB(m.received)} · parsing into a live ontology`;
            fill.classList.add('indeterminate');
            fill.style.width = '';
          }
        });

        prog.classList.add('done');
        phase.textContent = 'Loaded';
        detail.textContent = '';
        await new Promise(r => setTimeout(r, 280));
        await renderDashboard();
      } catch (e) {
        // Surface the wasm error verbatim (fail-closed: a tampered .prx.gz
        // is rejected by `load_prx`'s embedded source-hash gate; this is
        // where the gate's verdict reaches the operator).
        prog.classList.add('progress-err');
        phase.textContent = 'Failed';
        detail.classList.add('progress-err');
        detail.textContent = String(e).slice(0, 140);
        console.error(`${rpc} failed:`, e);
        const retry = document.createElement('button');
        retry.className = 'load-btn';
        retry.textContent = 'Retry';
        retry.addEventListener('click', () => { prog.remove(); loadOntology(kind, meta, card, topRow); });
        topRow.appendChild(retry);
      }
    }

    // Load the built-in new-format `.prx` (no network). The wasm load gate
    // re-derives the archive's Merkle root and refuses on mismatch; on success
    // the chat reasons over the loaded ontology. One visible phase
    // (Materializing) — the bytes already ship in the wasm, nothing downloads.
    async function loadEmbeddedPrx(card, topRow, btn) {
      btn.remove();
      const prog = document.createElement('div');
      prog.className = 'progress';
      prog.innerHTML =
        '<div class="progress-head"><span class="progress-phase">Materializing…</span>' +
        '<span class="progress-detail">verifying root · folding the closure</span></div>' +
        '<div class="progress-track"><div class="progress-fill indeterminate"></div></div>';
      card.appendChild(prog);
      const phase = prog.querySelector('.progress-phase');
      const detail = prog.querySelector('.progress-detail');
      try {
        const loadedName = await call('load_embedded_demo_prx');
        prog.classList.add('done');
        phase.textContent = 'Loaded';
        detail.textContent = `${loadedName} — ask the chat "what is a correctservice"`;
        await new Promise(r => setTimeout(r, 280));
        await renderDashboard();   // re-observe: the .prx is now loaded
      } catch (e) {
        // Fail-closed: a refused root surfaces here verbatim.
        prog.classList.add('progress-err');
        phase.textContent = 'Refused';
        detail.classList.add('progress-err');
        detail.textContent = String(e).slice(0, 140);
        console.error('load_embedded_demo_prx failed:', e);
        topRow.appendChild(btn);
      }
    }

    // The self-model page: a flat catalog of every registered source
    // (Loaded vs Available) + the substrate ontologies. Rendered purely
    // from what the runtime reports — no source-specific knowledge here.
    async function renderDashboard() {
      const dash = document.getElementById('about');
      let data, sources_avail, ontologies_avail;
      try {
        data = JSON.parse(await call('self_describe'));
        sources_avail = JSON.parse(await call('available_sources')).sources || [];
        ontologies_avail = JSON.parse(await call('available_ontologies')).ontologies || [];
      } catch (e) {
        dash.innerHTML = `<div class="message info" style="color:#f85149;">self_describe parse error: ${e}</div>`;
        return;
      }
      const sourceByName = new Map(sources_avail.map(a => [a.name, a]));
      const ontologyByName = new Map(ontologies_avail.map(o => [o.name, o]));
      // Sources catalog: USC titles etc. OWL vocabularies appear in the
      // catalog too (registered SourceTaxonomy=OntologyVocabulary) — they
      // get their own dual-load section below, so suppress them here to
      // avoid duplicating the row.
      const sources = (data.sources || []).filter(s => s.kind !== 'OntologyVocabulary');
      const ontologyCatalog = (data.sources || []).filter(s => s.kind === 'OntologyVocabulary');
      const ontologies = data.ontologies || [];

      // Per-ontology capabilities (doc §4.7), keyed by ontology name — what
      // each loaded source can actually ANSWER, so a green "loaded" badge stops
      // standing in for capability it may not have.
      const capByName = new Map((data.capabilities || []).map(c => [c.ontology, c]));
      function capabilityEl(name) {
        const cap = capByName.get(name);
        if (!cap) return null;
        const parts = [];
        if (cap.gloss) parts.push('glosses');
        if (Array.isArray(cap.relation_kinds)) parts.push(...cap.relation_kinds.map(k => k.toLowerCase()));
        if (!parts.length) return null;
        const el = document.createElement('div');
        el.className = 'counts';
        el.innerHTML = `<span style="color:#7ee787;">answers:</span> ${parts.join(' · ')}`;
        return el;
      }

      dash.innerHTML = '';

      // Hero
      const hero = document.createElement('div');
      hero.style.cssText = 'display:flex; align-items:center; gap:1rem; padding-bottom:1rem;';
      hero.innerHTML =
        '<img src="./praxis-logo-dark.jpg" alt="pr4xis" style="height:64px; border-radius:8px;" onerror="this.style.display=\'none\'">' +
        '<div>' +
          '<div style="font-size:1.8em; font-weight:700; color:#58a6ff;">pr4xis</div>' +
          `<div style="color:#8b949e; font-size:0.9em;">Axiomatic intelligence — self-model · ${data.awareness || ''} — running entirely in your browser</div>` +
          '<a href="https://github.com/i-am-logger/pr4xis" target="_blank" rel="noopener" style="color:#58a6ff; font-size:0.8em; text-decoration:none;">github.com/i-am-logger/pr4xis</a>' +
        '</div>';
      dash.appendChild(hero);

      // Summary stats — all derived from the self-model
      let wasmSize = '?';
      try {
        const resp = await fetch('./pkg/pr4xis_wasm_bg.wasm', { method: 'HEAD' });
        const b = parseInt(resp.headers.get('content-length') || '0', 10);
        if (b > 0) wasmSize = (b / (1024 * 1024)).toFixed(1) + ' MB';
      } catch { /* offline */ }
      const summary = document.createElement('div');
      summary.className = 'dash-summary';
      [
        { value: `${data.loaded_source_count ?? 0}/${data.source_count ?? sources.length}`, label: 'sources loaded' },
        { value: (data.total_concepts ?? 0).toLocaleString(), label: 'entities' },
        { value: (data.total_morphisms ?? 0).toLocaleString(), label: 'morphisms' },
        { value: ontologies.length, label: 'ontologies' },
        { value: wasmSize, label: 'wasm binary' },
        { value: data.version || '', label: 'version' },
      ].forEach(({ value, label }) => {
        const stat = document.createElement('div');
        stat.className = 'dash-stat';
        stat.innerHTML = `<div class="value">${value}</div><div class="label">${label}</div>`;
        summary.appendChild(stat);
      });
      dash.appendChild(summary);

      // ---- Memory: what it has loaded, in order (doc §2.4) ----
      // The temporal dimension of the self-model — an append-only, content-
      // addressed record of every load/replace, plus a fingerprint of the
      // current knowledge state that changes the moment a load does.
      const history = Array.isArray(data.history) ? data.history : [];
      if (history.length) {
        const memTitle = document.createElement('div');
        memTitle.className = 'section-title';
        memTitle.textContent = 'Memory — what it has loaded, in order';
        dash.appendChild(memTitle);

        const memList = document.createElement('div');
        memList.className = 'ont-list';
        for (const ev of history) {
          const card = document.createElement('div');
          card.className = 'ont-card';
          const isReplace = ev.event === 'replace';
          const verb = isReplace ? 'replaced' : 'loaded';
          const root = (ev.root || '').slice(0, 12);
          const displaced = isReplace && ev.displaced ? ` · displaced ${ev.displaced.slice(0, 12)}…` : '';
          card.innerHTML =
            `<span class="name" style="color:${isReplace ? '#d29922' : '#3fb950'};">${verb}</span>` +
            `<span class="name">${ev.ontology}</span>` +
            `<span class="domain">root ${root}…${displaced}</span>`;
          memList.appendChild(card);
        }
        dash.appendChild(memList);

        if (data.state_cid) {
          const cid = document.createElement('div');
          cid.className = 'cite';
          cid.style.cssText = 'margin-top:0.4rem; font-family:monospace;';
          cid.textContent = `state fingerprint · ${data.state_cid.slice(0, 24)}…`;
          dash.appendChild(cid);
        }
      }

      // ---- Built-in .prx (new content-addressed Archive) ----
      // The wasm ships ONE new-format `.prx` — a real compiled domain ontology
      // (Avizienis et al. 2004 Dependability) projected to a content-addressed
      // Archive at build time. Loading it is a one-click, no-network action: the
      // wasm re-derives the archive's Merkle root and refuses on mismatch
      // (fail-closed). Once loaded, the chat answers "what is a <concept>" from
      // the loaded gloss. A fetched/uploaded `.prx` would take the SAME path.
      try {
        const demo = JSON.parse(await call('embedded_demo_prx'));
        const demoTitle = document.createElement('div');
        demoTitle.className = 'section-title';
        demoTitle.textContent = 'Built-in .prx — load it, then ask the chat';
        dash.appendChild(demoTitle);

        const card = document.createElement('div');
        card.className = `source-card ${demo.loaded ? 'loaded' : 'available'}`;
        card.dataset.embeddedPrx = demo.name;
        const top = document.createElement('div');
        top.className = 'row';
        const nm = document.createElement('span');
        nm.className = 'name';
        nm.textContent = demo.name;
        top.appendChild(nm);
        const badge = document.createElement('span');
        badge.className = `badge ${demo.loaded ? 'badge-loaded' : 'badge-available'}`;
        badge.textContent = demo.loaded ? 'loaded' : 'embedded';
        top.appendChild(badge);
        if (!demo.loaded) {
          const btn = document.createElement('button');
          btn.className = 'load-btn';
          btn.dataset.loadEmbeddedPrx = demo.name;
          btn.textContent = 'Load .prx';
          btn.title = `content-addressed Archive · root ${demo.root.slice(0, 12)}… · ${demo.bytes} bytes (embedded, no network)`;
          btn.addEventListener('click', () => loadEmbeddedPrx(card, top, btn));
          top.appendChild(btn);
        }
        card.appendChild(top);

        const kind = document.createElement('div');
        kind.className = 'kind';
        kind.textContent = `new-format .prx · ${demo.bytes} bytes · root ${demo.root.slice(0, 12)}…`;
        card.appendChild(kind);

        const cite = document.createElement('div');
        cite.className = 'cite';
        cite.textContent = demo.loaded
          ? 'Loaded — the chat now answers from this ontology\'s glosses (try "what is a correctservice").'
          : 'Fail-closed: the wasm re-derives the Merkle root and refuses a tampered/wrong archive.';
        card.appendChild(cite);
        dash.appendChild(card);
      } catch (e) {
        console.error('embedded_demo_prx render failed:', e);
      }

      // ---- Sources catalog (the knowledge boundary) ----
      const srcTitle = document.createElement('div');
      srcTitle.className = 'section-title';
      srcTitle.textContent = 'Sources — loaded · available to load';
      dash.appendChild(srcTitle);

      const srcFilter = document.createElement('input');
      srcFilter.className = 'filter-box';
      srcFilter.id = 'src-filter';
      srcFilter.placeholder = 'Filter sources…';
      dash.appendChild(srcFilter);

      const grid = document.createElement('div');
      grid.className = 'source-grid';
      dash.appendChild(grid);

      // Loaded first, then available; stable by name within each.
      const ordered = [...sources].sort((a, b) =>
        (a.availability === b.availability ? a.name.localeCompare(b.name) : (a.availability === 'loaded' ? -1 : 1)));

      for (const s of ordered) {
        const loaded = s.availability === 'loaded';
        const card = document.createElement('div');
        card.className = `source-card ${loaded ? 'loaded' : 'available'}`;
        card.dataset.source = s.name; // stable hook for the Rust E2E

        const top = document.createElement('div');
        top.className = 'row';
        const nm = document.createElement('span');
        nm.className = 'name';
        nm.textContent = s.name;
        top.appendChild(nm);
        const badge = document.createElement('span');
        badge.className = `badge ${loaded ? 'badge-loaded' : 'badge-available'}`;
        badge.textContent = s.availability;
        top.appendChild(badge);
        if (loaded && s.staging) {
          const sb = document.createElement('span');
          sb.className = 'badge badge-staging';
          sb.textContent = s.staging;
          top.appendChild(sb);
        }
        // Load action only where the authoritative document is served.
        if (!loaded && sourceByName.has(s.name)) {
          const meta = sourceByName.get(s.name);
          const btn = document.createElement('button');
          btn.className = 'load-btn';
          btn.dataset.load = s.name; // stable hook for the Rust E2E
          btn.textContent = 'Load';
          btn.addEventListener('click', () => loadSource(s.name, meta.url, meta.bytes, card, top));
          top.appendChild(btn);
        }
        card.appendChild(top);

        const kind = document.createElement('div');
        kind.className = 'kind';
        kind.textContent = `${s.kind || ''}${s.version ? ' · ' + s.version : ''}`;
        card.appendChild(kind);

        if (loaded && (s.concepts || s.morphisms)) {
          const counts = document.createElement('div');
          counts.className = 'counts';
          counts.textContent = `${(s.concepts || 0).toLocaleString()} entities · ${(s.morphisms || 0).toLocaleString()} morphisms`;
          card.appendChild(counts);
        }

        if (loaded) {
          const cap = capabilityEl(s.name);
          if (cap) card.appendChild(cap);
        }

        if (s.source) {
          const cite = document.createElement('div');
          cite.className = 'cite';
          cite.textContent = s.source;
          card.appendChild(cite);
        }
        grid.appendChild(card);
      }

      srcFilter.addEventListener('input', () => {
        const q = srcFilter.value.toLowerCase();
        grid.querySelectorAll('.source-card').forEach(c =>
          c.style.display = c.textContent.toLowerCase().includes(q) ? '' : 'none');
      });

      // ---- OWL vocabularies (dual-load: .prx.gz OR .owl source) ----
      // Two routes for the same target: the hash-validated `.prx.gz`
      // distribution envelope (re-checked against the embedded lock pin) or
      // the authoritative `.owl` source. Same UX as Sources; two buttons
      // per row instead of one. Driven entirely by what
      // `available_ontologies` reports — no per-vocabulary knowledge here.
      if (ontologyCatalog.length) {
        const ontTitle = document.createElement('div');
        ontTitle.className = 'section-title';
        ontTitle.textContent = 'Ontologies — load .prx (hash-validated) or .owl source';
        dash.appendChild(ontTitle);

        const ontGrid = document.createElement('div');
        ontGrid.className = 'source-grid';
        dash.appendChild(ontGrid);

        const orderedOnt = [...ontologyCatalog].sort((a, b) =>
          (a.availability === b.availability ? a.name.localeCompare(b.name) : (a.availability === 'loaded' ? -1 : 1)));

        for (const s of orderedOnt) {
          const loaded = s.availability === 'loaded';
          const card = document.createElement('div');
          card.className = `source-card ${loaded ? 'loaded' : 'available'}`;
          card.dataset.ontology = s.name;

          const top = document.createElement('div');
          top.className = 'row';
          const nm = document.createElement('span');
          nm.className = 'name';
          nm.textContent = s.name;
          top.appendChild(nm);
          const badge = document.createElement('span');
          badge.className = `badge ${loaded ? 'badge-loaded' : 'badge-available'}`;
          badge.textContent = s.availability;
          top.appendChild(badge);
          if (loaded && s.staging) {
            const sb = document.createElement('span');
            sb.className = 'badge badge-staging';
            sb.textContent = s.staging;
            top.appendChild(sb);
          }
          // Dual-load action: only where a `.prx.gz` is published AND a
          // .owl source is staged (i.e. the vocab appears in
          // available_ontologies). Otherwise no Load — the catalog row
          // is still rendered.
          if (!loaded && ontologyByName.has(s.name)) {
            const meta = ontologyByName.get(s.name);
            const prxBtn = document.createElement('button');
            prxBtn.className = 'load-btn';
            prxBtn.dataset.loadPrx = s.name;
            prxBtn.textContent = 'Load .prx';
            prxBtn.title = meta.prx_url;
            prxBtn.addEventListener('click', () => loadOntology('prx', meta, card, top));
            top.appendChild(prxBtn);

            const srcBtn = document.createElement('button');
            srcBtn.className = 'load-btn';
            srcBtn.style.background = '#6e7681';
            srcBtn.dataset.loadSource = s.name;
            srcBtn.textContent = 'Load source';
            srcBtn.title = meta.source_url;
            srcBtn.addEventListener('click', () => loadOntology('source', meta, card, top));
            top.appendChild(srcBtn);
          }
          card.appendChild(top);

          const kind = document.createElement('div');
          kind.className = 'kind';
          kind.textContent = `${s.kind || ''}${s.version ? ' · ' + s.version : ''}`;
          card.appendChild(kind);

          if (loaded && (s.concepts || s.morphisms)) {
            const counts = document.createElement('div');
            counts.className = 'counts';
            counts.textContent = `${(s.concepts || 0).toLocaleString()} entities · ${(s.morphisms || 0).toLocaleString()} morphisms`;
            card.appendChild(counts);
          }

          if (loaded) {
            const cap = capabilityEl(s.name);
            if (cap) card.appendChild(cap);
          }

          if (s.source || s.citation) {
            const cite = document.createElement('div');
            cite.className = 'cite';
            cite.textContent = s.source || s.citation;
            card.appendChild(cite);
          }
          ontGrid.appendChild(card);
        }
      }

      // ---- Substrate ontologies (flat, filterable) ----
      if (ontologies.length) {
        const ontTitle = document.createElement('div');
        ontTitle.className = 'section-title';
        ontTitle.textContent = `Reasoning substrate — ${ontologies.length} ontologies`;
        dash.appendChild(ontTitle);

        const ontFilter = document.createElement('input');
        ontFilter.className = 'filter-box';
        ontFilter.placeholder = 'Filter ontologies…';
        dash.appendChild(ontFilter);

        const list = document.createElement('div');
        list.className = 'ont-list';
        dash.appendChild(list);

        for (const o of [...ontologies].sort((a, b) => a.name.localeCompare(b.name))) {
          const card = document.createElement('div');
          card.className = 'ont-card';
          const concepts = Array.isArray(o.concepts) ? o.concepts.length : (o.concepts || 0);
          card.innerHTML =
            `<span class="name">${o.name}</span>` +
            `<span class="domain">${o.domain || ''}</span>` +
            `<span class="counts">${concepts.toLocaleString()} entities · ${(o.morphisms || 0).toLocaleString()} morphisms</span>`;
          list.appendChild(card);
        }
        ontFilter.addEventListener('input', () => {
          const q = ontFilter.value.toLowerCase();
          list.querySelectorAll('.ont-card').forEach(c =>
            c.style.display = c.textContent.toLowerCase().includes(q) ? '' : 'none');
        });
      }
    }

    send.addEventListener('click', handleSend);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSend(); });

    initialize();
  </script>
</body>
</html>
